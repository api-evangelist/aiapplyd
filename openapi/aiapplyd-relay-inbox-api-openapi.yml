openapi: 3.2.0
info:
  title: Aiapplyd Relay Inbox API
  version: 115c47ce
  contact:
    email: support@aiapplyd.com
    name: AI Applyd
    url: https://aiapplyd.com
  license:
    name: Proprietary
    url: https://aiapplyd.com/legal/terms
  description: 'Operations tagged relay-inbox across 2 of this provider''s published API definitions: aiapplyd-openapi.json, aiapplyd-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Current environment
  url: https://api.aiapplyd.com/api/v1
security:
- BearerAuth: []
tags:
- name: relay-inbox
paths:
  /relay-inbox:
    get:
      tags:
      - relay-inbox
      summary: List Inbox Emails
      description: List the authenticated user's synced inbound emails (gmail + relay), most recent first. Optionally filter by applicationResultId or jobListingId.
      parameters:
      - schema:
          type: integer
          description: Filter to emails linked to this application result row
          example: 1234
          exclusiveMinimum: 0
        required: false
        description: Filter to emails linked to this application result row
        name: applicationResultId
        in: query
      - schema:
          anyOf:
          - type: boolean
          - type: string
            enum:
            - '0'
            - '1'
            - 'true'
            - 'false'
          description: When true, return ARCHIVED emails (archivedAt set); when false, the active inbox. Omitted on a read scoped to one application or job listing, which returns both.
          example: false
        required: false
        description: When true, return ARCHIVED emails (archivedAt set); when false, the active inbox. Omitted on a read scoped to one application or job listing, which returns both.
        name: archived
        in: query
      - schema:
          type: string
          enum:
          - action_required
          - application_confirmation
          - assessment_request
          - cancellation
          - follow_up_request
          - general
          - interview_invite
          - offer_letter
          - outbound
          - promotional
          - recruiter_outreach
          - rejection
          - reschedule
          - scheduling
          - spam
          - unrelated
          - verification
          description: Filter to a single effective category (coalesce(override, signalType)). Allowlist-gated - a hidden category returns nothing.
          example: interview_invite
        required: false
        description: Filter to a single effective category (coalesce(override, signalType)). Allowlist-gated - a hidden category returns nothing.
        name: category
        in: query
      - schema:
          type: integer
          description: Filter to emails linked to this job listing row
          example: 5678
          exclusiveMinimum: 0
        required: false
        description: Filter to emails linked to this job listing row
        name: jobListingId
        in: query
      - schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
          description: Max rows to return (most recent first)
          example: 50
        required: false
        description: Max rows to return (most recent first)
        name: limit
        in: query
      - schema:
          type:
          - integer
          - 'null'
          minimum: 0
          default: 0
          description: Number of rows to skip (pagination), applied after filters/sort.
          example: 0
        required: false
        description: Number of rows to skip (pagination), applied after filters/sort.
        name: offset
        in: query
      - schema:
          type: string
          minLength: 1
          maxLength: 200
          description: Case-insensitive substring match across subject, sender name, sender email, and snippet.
          example: interview
        required: false
        description: Case-insensitive substring match across subject, sender name, sender email, and snippet.
        name: search
        in: query
      - schema:
          type: string
          enum:
          - received_desc
          - received_asc
          default: received_desc
          description: Sort order for the inbox feed by received time (newest or oldest first).
          example: received_desc
        required: false
        description: Sort order for the inbox feed by received time (newest or oldest first).
        name: sort
        in: query
      - schema:
          anyOf:
          - type: boolean
          - type: string
            enum:
            - '0'
            - '1'
            - 'true'
            - 'false'
          description: When true, return only STARRED emails (starredAt set).
          example: true
        required: false
        description: When true, return only STARRED emails (starredAt set).
        name: starred
        in: query
      - schema:
          anyOf:
          - type: boolean
          - type: string
            enum:
            - '0'
            - '1'
            - 'true'
            - 'false'
          description: When true, only UNREAD emails (readAt null); when false, only READ; absent returns both.
          example: true
        required: false
        description: When true, only UNREAD emails (readAt null); when false, only READ; absent returns both.
        name: unread
        in: query
      responses:
        '200':
          description: Inbox emails retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelayInboxListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: getRelayInbox
    servers:
    - description: Current environment
      url: https://api.aiapplyd.com/api/v1
  /relay-inbox/counts:
    get:
      tags:
      - relay-inbox
      summary: Inbox Counts
      description: 'Return the authenticated user''s active-inbox tallies: the unread count and a per-effective-category breakdown (every visible category key present, 0 when none). Computed over the ACTIVE inbox only (archivedAt IS NULL) and gated by the same recruiter-relevant allowlist as the list. Powers the cross-surface inbox status (tracking / overview / single-application) without re-fetching the full list.'
      responses:
        '200':
          description: Inbox counts retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelayInboxCountsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: getRelayInboxCounts
    servers:
    - description: Current environment
      url: https://api.aiapplyd.com/api/v1
  /relay-inbox/bulk:
    post:
      tags:
      - relay-inbox
      summary: Bulk Inbox Action
      description: Apply a single action (read / unread / archive / unarchive / star / unstar) to up to 200 owned inbox emails in one atomic D1 batch. Only the user's own relay rows among the requested ids are touched; returns the number actually updated.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelayBulkRequest'
      responses:
        '200':
          description: Bulk action applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelayBulkResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postRelayInboxBulk
    servers:
    - description: Current environment
      url: https://api.aiapplyd.com/api/v1
  /relay-inbox/{id}:
    get:
      tags:
      - relay-inbox
      summary: Get Inbox Email Detail
      description: Return the FULL contents of a single inbox email owned by the authenticated user - full body (bodyText), persisted outbound HTML or recovered inbound HTML, the recruiter's real sender address, classifier signal + confidence, and the matched company/job.
      parameters:
      - schema:
          type: string
          pattern: ^\d+$
          description: synced_email row id (the inbox message)
          example: '1'
        required: true
        description: synced_email row id (the inbox message)
        in: path
        name: id
      responses:
        '200':
          description: Full email retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelayInboxDetailResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: getRelayInboxById
    servers:
    - description: Current environment
      url: https://api.aiapplyd.com/api/v1
  /relay-inbox/{id}/thread:
    get:
      tags:
      - relay-inbox
      summary: Get Inbox Email Thread
      description: Return EVERY owned relay message in the same conversation as the given email - inbound recruiter mail AND the user's own outbound replies (signalType `outbound`) - oldest first, so the UI renders the two-way thread top-down. Messages share the target's threadId; a threadId-less email returns just itself. Each message carries its full bodyText plus persisted outbound HTML or best-effort inbound HTML recovered from raw MIME.
      parameters:
      - schema:
          type: string
          pattern: ^\d+$
          description: synced_email row id (the inbox message)
          example: '1'
        required: true
        description: synced_email row id (the inbox message)
        in: path
        name: id
      responses:
        '200':
          description: Thread messages retrieved (oldest first)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelayInboxThreadResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: getRelayInboxByIdThread
    servers:
    - description: Current environment
      url: https://api.aiapplyd.com/api/v1
  /relay-inbox/{id}/attachments/{partId}:
    get:
      tags:
      - relay-inbox
      summary: Download Inbox Attachment
      description: 'Stream one file a sender attached to an owned inbox email, addressed by the `partId` from the detail read''s `attachments` list. The file is decoded live from the stored raw MIME (nothing is persisted per attachment), scoped to the authenticated owner of the message. Always served as a download (Content-Disposition: attachment, nosniff), and HTML/SVG/XML parts are typed as application/octet-stream so an attachment can never execute on the API origin. Returns 404 when the message is not the user''s, when no part carries that id, or when the raw message is no longer stored (older messages are evicted once a user passes their stored-mail cap).'
      parameters:
      - schema:
          type: string
          pattern: ^\d+$
          description: synced_email row id (the inbox message)
          example: '1'
        required: true
        description: synced_email row id (the inbox message)
        in: path
        name: id
      - schema:
          type: string
          maxLength: 64
          pattern: ^\d[\d.]{0,62}$
          description: MIME part index path from the detail read's `attachments[].partId` ("2", "1.3").
          example: '2'
        required: true
        description: MIME part index path from the detail read's `attachments[].partId` ("2", "1.3").
        in: path
        name: partId
      responses:
        '200':
          description: Attachment file bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: getRelayInboxByIdAttachmentsByPartId
    servers:
    - description: Current environment
      url: https://api.aiapplyd.com/api/v1
  /relay-inbox/{id}/category:
    patch:
      tags:
      - relay-inbox
      summary: Re-categorize Inbox Email
      description: Set the user's manual category override for an owned inbox email (fixes classifier false positives). Stores `userCategoryOverride` so the corrected category becomes the `effectiveSignalType` everywhere, AND re-applies the application-stage outcome for the corrected category (interview / offer / rejection), guarded against downgrading a more-advanced stage exactly like the email-detected path. Spam/promotional corrections never advance a stage.
      parameters:
      - schema:
          type: string
          pattern: ^\d+$
          description: synced_email row id (the inbox message)
          example: '1'
        required: true
        description: synced_email row id (the inbox message)
        in: path
        name: id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelayCategoryUpdateRequest'
      responses:
        '200':
          description: Category override saved and outcome re-applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelayCategoryUpdateResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: patchRelayInboxByIdCategory
    servers:
    - description: Current environment
      url: https://api.aiapplyd.com/api/v1
  /relay-inbox/{id}/read:
    patch:
      tags:
      - relay-inbox
      summary: Mark Inbox Email Read/Unread
      description: 'Set the read state of an owned inbox email. `read: true` stamps `readAt = now`; `read: false` clears it (mark unread). Scoped to the authenticated user''s own relay rows.'
      parameters:
      - schema:
          type: string
          pattern: ^\d+$
          description: synced_email row id (the inbox message)
          example: '1'
        required: true
        description: synced_email row id (the inbox message)
        in: path
        name: id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelayReadRequest'
      responses:
        '200':
          description: Read state updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelayInboxStateResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: patchRelayInboxByIdRead
    servers:
    - description: Current environment
      url: https://api.aiapplyd.com/api/v1
  /relay-inbox/{id}/archive:
    patch:
      tags:
      - relay-inbox
      summary: Archive/Unarchive Inbox Email
      description: 'Set the archived state of an owned inbox email. `archived: true` stamps `archivedAt = now` (moves it to the Archived view); `archived: false` clears it (restores to the active inbox). Scoped to the user''s own relay rows.'
      parameters:
      - schema:
          type: string
          pattern: ^\d+$
          description: synced_email row id (the inbox message)
          example: '1'
        required: true
        description: synced_email row id (the inbox message)
        in: path
