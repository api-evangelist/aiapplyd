        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: patchRelayInboxByIdArchive
    servers:
    - description: Current environment
      url: https://api.aiapplyd.com/api/v1
  /relay-inbox/{id}/star:
    patch:
      tags:
      - relay-inbox
      summary: Star/Unstar Inbox Email
      description: 'Set the starred (pin) state of an owned inbox email. `starred: true` stamps `starredAt = now`; `starred: false` clears it. Scoped to the user''s own relay rows.'
      parameters:
      - schema:
          type: string
          pattern: ^\d+$
          description: synced_email row id (the inbox message)
          example: '1'
        required: true
        description: synced_email row id (the inbox message)
        in: path
        name: id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelayStarRequest'
      responses:
        '200':
          description: Star state updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelayInboxStateResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
