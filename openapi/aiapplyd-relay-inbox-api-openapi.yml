      operationId: patchRelayInboxByIdStar
    servers:
    - description: Current environment
      url: https://api.aiapplyd.com/api/v1
  /relay-inbox/{id}/reply:
    post:
      tags:
      - relay-inbox
      summary: Reply to Inbox Email
      description: 'Send the user''s reply OUT to the original recruiter from the user''s relay alias, so the recruiter only ever sees the alias and the user''s real address stays private. Accepts canonical plaintext plus optional rich HTML; the server sanitizes the HTML and derives the guarded plaintext from it before SES. The reply carries RFC822 threading headers (In-Reply-To / References / fresh Message-ID) + an `Re:` subject so it lands inside the recruiter''s original thread, and both sent parts are persisted on a relay synced_email row (signalType `outbound`, shared threadId) so both directions appear in the Inbox thread. ABUSE-GATED (fail-closed): recipient validity, body-size cap, per-user hourly burst bucket, and a plan-gated daily cap - over-limit returns 429; an invalid/bulk/suppressed recipient or oversized body returns 400. Gated on RELAY_EMAIL_DOMAIN alone (the sole relay kill-switch) - when the domain is unset, returns 200 with status `relay_disabled` (nothing sent) so the UI can show it is pending go-live.'
      parameters:
      - schema:
          type: string
          pattern: ^\d+$
          description: synced_email row id (the inbox message)
          example: '1'
        required: true
        description: synced_email row id (the inbox message)
        in: path
        name: id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelayReplyRequest'
      responses:
        '200':
          description: Reply sent (or skipped with status when relay disabled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelayReplyResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postRelayInboxByIdReply
    servers:
    - description: Current environment
      url: https://api.aiapplyd.com/api/v1
  /relay-inbox/forwarding/stop:
    get:
      tags:
      - relay-inbox
      summary: Mute Non-Essential Emails (confirm page)
      description: 'SAFE (RFC 9110): performs ZERO writes. Public link from the forwarded relay email footer. Verifies the signed email-preferences token and returns a self-contained HTML confirmation page whose button POSTs to this same path to actually mute. Automated GETs from mail-security scanners (Gmail link proxy, Apple MPP, Outlook SafeLinks, Proofpoint/Barracuda detonation) therefore change nothing. An invalid/expired token redirects (302) to the web inbox with `forwarding=invalid`.'
      parameters:
      - schema:
          type: string
          minLength: 1
          description: Signed email-preferences token (userId + email) identifying whose relay alias to stop forwarding.
          example: eyJ1c2VySWQiOiJ1c2VyXzEyMyJ9.abc123
        required: true
        description: Signed email-preferences token (userId + email) identifying whose relay alias to stop forwarding.
        name: token
        in: query
      responses:
        '200':
          description: Confirmation page rendered. Nothing was changed.
          content:
            text/html:
              schema:
                type: string
                description: Self-contained HTML confirmation page (no external assets).
        '302':
          description: Redirect (302) to the web inbox when the token is invalid or expired.
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: getRelayInboxForwardingStop
    post:
      tags:
      - relay-inbox
      summary: Mute Non-Essential Emails (confirm)
      description: 'The ONLY mutating half of the mute flow: submitted by the button on the GET confirmation page (same signed token, carried in the query string). Verifies the token, then mutes non-essential forwarding for that user''s relay alias (sets status=disabled). Essential mail (interview invites, assessment requests, offers, application confirmations) is still forwarded; every inbound message is still captured + classified into the AI Applyd inbox. Redirects (302) to the web inbox with `forwarding=stopped` (or `forwarding=invalid` on a bad token).'
      parameters:
      - schema:
          type: string
          minLength: 1
          description: Signed email-preferences token (userId + email) identifying whose relay alias to stop forwarding.
          example: eyJ1c2VySWQiOiJ1c2VyXzEyMyJ9.abc123
        required: true
        description: Signed email-preferences token (userId + email) identifying whose relay alias to stop forwarding.
        name: token
        in: query
      responses:
        '302':
          description: Redirect (302) to the web inbox after muting (or on an invalid/expired token).
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postRelayInboxForwardingStop
    servers:
    - description: Current environment
      url: https://api.aiapplyd.com/api/v1
components:
  schemas:
    ApiErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            context:
              oneOf:
              - type: object
                properties:
                  errorType:
                    type: string
                    enum:
                    - validation
                  field:
                    type: string
                  fieldErrors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        expected:
                          type: string
                        field:
                          type: string
                        message:
                          type: string
                        received:
                          type: string
                      required:
                      - field
                      - message
                  schemaName:
                    type: string
                required:
                - errorType
              - type: object
