      type: object
      properties:
        clientRequestId:
          type: string
          format: uuid
          description: Stable client-generated UUID for this authored reply. Native clients reuse it across a manual Retry so the server can atomically dedupe an ambiguous prior delivery. Optional only for legacy clients.
          example: 894540e0-1066-4a24-9fc4-0ece5cda3e6f
        message:
          type: string
          minLength: 1
          maxLength: 50000
          description: Canonical plain-text reply body. Required for legacy clients and the text email part; when messageHtml is present, the server derives this value again from the sanitized HTML before every guard and send.
          example: Thanks for reaching out - Tuesday at 2pm works for me.
        messageHtml:
          type:
          - string
          - 'null'
          description: Optional rich reply body. The client sends allowlisted HTML, but the server always sanitizes it again and derives the guarded canonical plaintext from the sanitized result. Null or omission sends the plain message only.
          example: <p>Thanks for reaching out - <strong>Tuesday at 2pm</strong> works for me.</p>
      required:
      - message
      additionalProperties: false
