          $ref: '#/components/schemas/ResponseMetadata'
        success:
          type: boolean
          enum:
          - true
      required:
      - data
      - success
      additionalProperties: false
      description: Successful API response
    McpSessionBody:
      type: object
      properties:
        email:
          type: string
          format: email
          description: Google-verified email of the user to find or create.
          example: jane@example.com
        name:
          type: string
          minLength: 1
          description: Display name from the Google profile. Used when creating a new user.
          example: Jane Doe
        googleSub:
          type: string
          description: Google `sub` (stable account id). Informational; logged for traceability.
          example: '104821739203847102938'
      required:
      - email
      - name
      additionalProperties: false
    McpSessionData:
      type: object
      properties:
        sessionToken:
          type: string
          description: 'Raw Better Auth session token. Pass as `Authorization: Bearer <token>` on session-auth routes.'
          example: JuYbT8e0g3uVqkX...
        userId:
          type: string
          description: AI Applyd user id the session was minted for.
          example: usr_01HXY...
        email:
          type: string
          description: Resolved user email (lower-cased).
          example: jane@example.com
        name:
          type:
          - string
          - 'null'
          description: Resolved user display name, or null when unset.
          example: Jane Doe
        planTier:
          type: string
          description: Resolved plan tier for the user.
          example: free
        isNewUser:
          type: boolean
          description: True when the user was created by this call, false when an existing user was matched.
          example: false
      required:
      - sessionToken
      - userId
      - email
      - name
      - planTier
      - isNewUser
      additionalProperties: false
    ResponseMetadata:
      type: object
      properties:
        duration:
          type: number
          description: Request duration in milliseconds
          example: 150
