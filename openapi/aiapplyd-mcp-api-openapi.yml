    name: AI Applyd
    url: https://aiapplyd.com
  license:
    name: Proprietary
    url: https://aiapplyd.com/legal/terms
  description: 'Operations tagged mcp across 2 of this provider''s published API definitions: aiapplyd-openapi.json, aiapplyd-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Current environment
  url: https://api.aiapplyd.com/api/v1
security:
- BearerAuth: []
tags:
- name: MCP
paths:
  /mcp/session:
    post:
      tags:
      - MCP
      summary: Find-or-create a user and mint a Better Auth session (internal)
      description: 'Internal service-to-service endpoint (x-api-key: API_SECRET_KEY). Finds or creates the user by email, mints a Better Auth session via the internal adapter, and returns the raw session token for MCP tool auth.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/McpSessionBody'
      responses:
        '200':
          description: Session minted. `data.sessionToken` is the raw Better Auth session token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpSessionResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postMcpSession
    servers:
    - description: Current environment
      url: https://api.aiapplyd.com/api/v1
