openapi: 3.2.0
info:
  title: Aiapplyd Analytics API
  version: 115c47ce
  contact:
    email: support@aiapplyd.com
    name: AI Applyd
    url: https://aiapplyd.com
  license:
    name: Proprietary
    url: https://aiapplyd.com/legal/terms
  description: 'Operations tagged analytics across 2 of this provider''s published API definitions: aiapplyd-openapi.json, aiapplyd-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Current environment
  url: https://api.aiapplyd.com/api/v1
security:
- BearerAuth: []
tags:
- name: Analytics
paths:
  /analytics:
    get:
      tags:
      - Analytics
      summary: Get Application Analytics
      description: Get analytics dashboard data for job applications.
      responses:
        '200':
          description: Analytics data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: getAnalytics
    servers:
    - description: Current environment
      url: https://api.aiapplyd.com/api/v1
  /analytics/patterns:
    get:
      description: 'Strategic insights derived deterministically from the user''s applications: conversion funnel by archetype / remote-policy / score band, top blockers, tech-stack gaps, data-driven score floor, and prioritized recommendations. Returns `{status: "insufficient_data"}` when fewer than 5 applications have moved past Evaluated.'
      summary: Get Strategic Application Insights
      tags:
      - Analytics
      responses:
        '200':
          description: Pattern analysis (ready) or insufficient_data sentinel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatternAnalysisResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: getAnalyticsPatterns
    servers:
    - description: Current environment
      url: https://api.aiapplyd.com/api/v1
  /analytics/recommendations/apply:
    post:
      description: 'Apply a structured pattern-analyzer recommendation. The actionType + actionPayload are produced by the analyzer and round-tripped through the FE. Idempotent: repeat-applies do not double-write.'
      summary: Apply Pattern-Analyzer Recommendation
      tags:
      - Analytics
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyRecommendationRequest'
      responses:
        '200':
          description: Recommendation applied (or idempotent no-op).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyRecommendationResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postAnalyticsRecommendationsApply
    servers:
    - description: Current environment
      url: https://api.aiapplyd.com/api/v1
components:
