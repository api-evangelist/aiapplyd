    AnalyticsData:
      type:
      - object
      - 'null'
      properties:
        atsScoreDistribution:
          type: object
          properties:
            excellent:
              type: integer
              description: Scores >= 80
            fair:
              type: integer
              description: Scores >= 40 and < 60
            good:
              type: integer
              description: Scores >= 60 and < 80
            poor:
              type: integer
              description: Scores < 40
          required:
          - excellent
          - fair
          - good
          - poor
          additionalProperties: false
          description: ATS score distribution across 4 buckets
        avgAtsScore:
          type:
          - number
          - 'null'
          description: Average ATS score across all scored jobs
        dailyAnswers:
          type: array
          items:
            $ref: '#/components/schemas/DailyApplication'
          description: Employer-confirmed answers per day for the last 14 days
        dailyApplications:
          type: array
          items:
            $ref: '#/components/schemas/DailyApplication'
          description: Application counts per day for the last 14 days
        matchQualityByWeek:
          type: array
          items:
            $ref: '#/components/schemas/MatchQualityWeek'
          description: Roles scored for this user per ISO week over the last 8 weeks, split into quality bands. Weeks with no supply are omitted.
        monthlyApplications:
          type: integer
          description: Jobs applied this month
        outcomes:
          allOf:
          - $ref: '#/components/schemas/OutcomeMetrics'
          - description: Real-outcome success metrics from the email + calendar pipeline.
        previousWeekApplications:
          type: integer
          description: Jobs applied 14-7 days ago for trend comparison
        recentActivity:
          type: array
          items:
            type: object
            properties:
              company:
                type:
                - string
                - 'null'
              companyDomain:
                type:
                - string
                - 'null'
                description: Trusted company-intel domain (company.domain) for the FE logo favicon fallback
              companyLogoUrl:
                type:
                - string
                - 'null'
                description: Company logo URL (company-intel R2 logo, falling back to the scraped snapshot)
              id:
                type: integer
              status:
                type: string
                enum:
                - saved
                - preparing
                - applied
                - interviewing
                - offered
                - rejected
                - archived
                description: Status of a job listing
                example: saved
              title:
                type: string
              updatedAt:
                type:
                - string
                - 'null'
            required:
            - company
            - companyDomain
            - companyLogoUrl
            - id
            - status
            - title
            - updatedAt
            additionalProperties: false
        responseRate:
          type: number
          description: Percentage of applied jobs with response
          example: 35.5
        statusCounts:
          type: object
          properties:
            applied:
              type: integer
            archived:
              type: integer
            interviewing:
              type: integer
            offered:
              type: integer
            preparing:
              type: integer
            rejected:
              type: integer
            saved:
              type: integer
          required:
          - applied
          - archived
          - interviewing
          - offered
          - preparing
          - rejected
          - saved
          additionalProperties: false
        topCompanies:
          type: array
          items:
            type: object
            properties:
              company:
                type: string
              companyDomain:
                type:
                - string
                - 'null'
                description: Trusted company-intel domain (company.domain) for the FE logo favicon fallback
              companyLogoUrl:
                type:
                - string
                - 'null'
                description: Company logo URL
              count:
                type: integer
              recentJobTitle:
                type:
                - string
                - 'null'
                description: Most recent job title at this company
            required:
            - company
            - companyDomain
            - companyLogoUrl
            - count
            - recentJobTitle
            additionalProperties: false
          description: Most applied-to companies with recent job title
        totalJobs:
          type: integer
        unactionedHighMatches:
          type: integer
          description: Roles scored 80+ that the user has neither dismissed nor applied to. The one figure on the analytics screen that names a next action.
          example: 942
        weeklyApplications:
          type: integer
          description: Jobs applied this week
      required:
      - atsScoreDistribution
      - avgAtsScore
      - dailyAnswers
      - dailyApplications
      - matchQualityByWeek
      - monthlyApplications
      - outcomes
      - previousWeekApplications
      - recentActivity
      - responseRate
      - statusCounts
      - topCompanies
      - totalJobs
      - unactionedHighMatches
      - weeklyApplications
    RemotePolicyFunnelRow:
      type: object
      properties:
        conversionRate:
          type: number
        progressed:
          type: integer
        total:
          type: integer
        workArrangement:
          type: string
          enum:
          - onsite
          - hybrid
          - remote_local
          - remote_country
          - remote_region
          - remote_global
          - unknown
          description: How a job can be performed geographically
          example: remote_country
      required:
      - conversionRate
      - progressed
      - total
      - workArrangement
      additionalProperties: false
    ResponseMetadata:
      type: object
      properties:
        duration:
          type: number
          description: Request duration in milliseconds
          example: 150
          exclusiveMinimum: 0
        performance:
          type: object
          properties:
            dbQueries:
              type: integer
              minimum: 0
            totalDbTime:
              type: number
              minimum: 0
          description: Performance metrics (preview/local only)
        requestId:
          type: string
          description: Unique request identifier
          example: req_abc123
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp
          example: '2026-09-25T17:29:47.224Z'
        version:
          type: string
          description: API version
          example: v1
    PatternAnalysisResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PatternAnalysisResult'
        meta:
          $ref: '#/components/schemas/ResponseMetadata'
        success:
          type: boolean
          enum:
          - true
      required:
      - data
      - success
      additionalProperties: false
      description: Successful API response
    BlockerRow:
      type: object
      properties:
        count:
          type: integer
        reason:
          type: string
          enum:
          - geo_restriction
          - stack_mismatch
          - seniority_mismatch
          - onsite_requirement
          - no_response
          - low_match
          - other
          - unknown
          description: Coarse "why this application did not progress" bucket. Used by the pattern-analyzer to surface top blockers and recommendations.
          example: stack_mismatch
        share:
          type: number
          description: 0..1 share of negative outcomes attributable to this blocker
          example: 0.32
      required:
      - count
      - reason
      - share
      additionalProperties: false
    ApplyRecommendationResult:
      type: object
      properties:
        changed:
          type: boolean
          description: True when the executor mutated state. False = idempotent no-op (already applied).
        message:
          type: string
          description: Human-readable summary of what happened.
        ok:
          type: boolean
          description: True when the executor accepted + processed the action.
      required:
      - changed
      - message
      - ok
      additionalProperties: false
