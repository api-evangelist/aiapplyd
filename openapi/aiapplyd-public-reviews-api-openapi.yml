    PublicReview:
      type: object
      properties:
        body:
          type: string
          description: The review text, as written by the reviewer.
          example: I stopped writing cover letters by hand and started getting replies within a fortnight.
        createdAt:
          type: string
          description: When the review was written (ISO-8601). Feeds `datePublished` in the Review markup.
          example: '2026-08-31T09:15:00.000Z'
        displayName:
          type: string
          description: The credit the reviewer chose for themselves. Feeds `author.name` in the Review markup.
          example: Ava K.
        rating:
          type: integer
          minimum: 1
          maximum: 5
          description: Star rating, 1-5. Feeds `reviewRating.ratingValue`.
          example: 5
      required:
      - body
      - createdAt
      - displayName
      - rating
      additionalProperties: false
    PublicReviewsPayload:
      type: object
      properties:
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/PublicReview'
      required:
      - reviews
      additionalProperties: false
