tags:
- name: public-reviews
paths:
  /public/reviews:
    get:
      description: 'List published reviews for the marketing site: approved by an admin AND explicitly consented to publication by their author. Returns display name, rating, body and creation date - nothing that identifies the account.'
      summary: List public reviews
      tags:
      - public-reviews
      parameters:
      - schema:
          type: integer
          minimum: 1
          maximum: 50
          description: Maximum reviews to return. Defaults to 12.
          example: 12
        required: false
        description: Maximum reviews to return. Defaults to 12.
        name: limit
        in: query
      responses:
        '200':
          description: Approved and consented reviews, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicReviewsResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: getPublicReviews
    servers:
    - description: Current environment
      url: https://api.aiapplyd.com/api/v1
