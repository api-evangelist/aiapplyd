openapi: 3.2.0
info:
  title: Aiapplyd Application Profile API
  version: 115c47ce
  contact:
    email: support@aiapplyd.com
    name: AI Applyd
    url: https://aiapplyd.com
  license:
    name: Proprietary
    url: https://aiapplyd.com/legal/terms
  description: 'Operations tagged application-profile across 2 of this provider''s published API definitions: aiapplyd-openapi.json, aiapplyd-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Current environment
  url: https://api.aiapplyd.com/api/v1
security:
- BearerAuth: []
tags:
- name: application-profile
paths:
  /application-profile:
    get:
      tags:
      - application-profile
      summary: Get Application Profile
      description: Get the authenticated user's application profile for applying to jobs.
      responses:
        '200':
          description: Application profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationProfileResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: getApplicationProfile
    put:
      tags:
      - application-profile
      summary: Create or Update Application Profile
      description: Create or update the authenticated user's application profile. All fields are optional; only provided fields are updated.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertApplicationProfile'
      responses:
        '200':
          description: Application profile created or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationProfileResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: putApplicationProfile
    servers:
    - description: Current environment
      url: https://api.aiapplyd.com/api/v1
  /application-profile/suggest:
    post:
      tags:
      - application-profile
      summary: Suggest Application Profile fields from parsed resume
      description: Reads the authenticated user's most recent parsed resume and returns per-field suggestions (currentEmployer, yearsOfExperience, highestEducation, workAuthorization). Each suggestion carries a `source` flag so the UI can show a "From resume" badge.
      responses:
        '200':
          description: Per-field application-profile suggestions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestApplicationProfileResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postApplicationProfileSuggest
    servers:
    - description: Current environment
      url: https://api.aiapplyd.com/api/v1
components:
  schemas:
    ApplicationProfileResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ApplicationProfileData'
        meta:
          $ref: '#/components/schemas/ResponseMetadata'
        success:
          type: boolean
          enum:
          - true
      required:
      - data
      - success
      additionalProperties: false
      description: Successful API response
    SuggestApplicationProfileData:
      type: object
      properties:
        suggestions:
          $ref: '#/components/schemas/ApplicationProfileSuggestions'
        hasResume:
          type: boolean
          description: False when the user has no parseable resume document on file. Frontend renders an upload-resume prompt in that case.
          example: true
      required:
      - suggestions
      - hasResume
