    SuggestApplicationProfileResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/SuggestApplicationProfileData'
        meta:
          $ref: '#/components/schemas/ResponseMetadata'
        success:
          type: boolean
          enum:
          - true
      required:
      - data
      - success
      additionalProperties: false
      description: Successful API response
    ApplicationProfileData:
      type: object
      properties:
        id:
          type: string
          description: Application profile identifier
          example: abc-123
        userId:
          type: string
          description: User identifier
          example: user_abc123
        phone:
          type:
          - string
          - 'null'
          description: Phone number
          example: +1-555-123-4567
        addressLine1:
          type:
          - string
          - 'null'
          description: Address line 1
          example: 123 Main St
        addressLine2:
          type:
          - string
          - 'null'
          description: Address line 2
          example: Apt 4B
        city:
          type:
          - string
          - 'null'
          description: City
          example: San Francisco
        state:
          type:
          - string
          - 'null'
          description: State or province
          example: CA
        zipCode:
          type:
          - string
          - 'null'
          description: ZIP or postal code
          example: '94105'
        country:
          type:
          - string
          - 'null'
          description: Country
          example: US
        linkedinUrl:
          type:
          - string
          - 'null'
          description: LinkedIn profile URL
          example: https://linkedin.com/in/johndoe
        portfolioUrl:
          type:
          - string
          - 'null'
          description: Portfolio website URL
          example: https://johndoe.dev
        githubUrl:
          type:
          - string
          - 'null'
          description: GitHub profile URL
          example: https://github.com/johndoe
        currentEmployer:
          type:
          - string
          - 'null'
          description: Current employer / company. Helps tailor recommendations; unlocks team analytics if the company onboards.
          example: Acme Corp
        dateOfBirth:
          type:
          - string
          - 'null'
          description: Date of birth (ISO 8601 date string)
          example: '1995-06-15'
        workAuthorization:
          type:
          - string
          - 'null'
          enum:
          - us_citizen
          - permanent_resident
          - visa_holder
          - require_sponsorship
          - other
          - null
          description: Work authorization status
          example: us_citizen
        willingToRelocate:
          type: boolean
          description: Willing to relocate for a job
          example: false
        relocationLocations:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Preferred relocation locations as "City, Country" or "Country". Middle admin segments stripped on read.
          example:
          - New York, United States
          - Austin, United States
        salaryCurrency:
          type:
          - string
          - 'null'
          enum:
          - usd
          - eur
          - gbp
          - cad
          - aud
          - inr
          - null
          description: Salary currency
          example: usd
        availableStartDate:
          type:
          - string
          - 'null'
          description: Earliest available start date (ISO 8601 date string)
          example: '2026-04-01'
        noticePeriod:
          type:
          - string
          - 'null'
          enum:
          - immediately
          - two_weeks
          - one_month
          - two_months
          - three_months
          - flexible
          - null
          description: Notice period before starting new position
          example: two_weeks
        personalNarrative:
          type:
          - string
          - 'null'
          description: Free-form narrative about gaps / transitions / short stints. Drives interview-prep red-flag question generation (F8).
          example: Took a 14-month gap in 2024 for caregiving; returning with a refreshed cloud certification.
        travelWillingness:
          type:
          - string
          - 'null'
          enum:
          - none
          - up_to_25
          - up_to_50
          - up_to_75
          - up_to_100
          - null
          description: Willingness to travel for work
          example: up_to_25
        securityClearance:
          type:
          - string
          - 'null'
          enum:
          - none
          - confidential
          - secret
          - top_secret
          - ts_sci
          - prefer_not_to_say
          - null
          description: Security clearance level
          example: none
        restrictiveCovenantStatus:
          type:
          - string
          - 'null'
          enum:
          - 'yes'
          - 'no'
          - prefer_not_to_say
          - null
          description: Currently subject to a non-compete / non-solicit / restrictive covenant with a former employer
          example: 'no'
        criminalRecordStatus:
          type:
          - string
          - 'null'
          enum:
          - 'yes'
          - 'no'
          - prefer_not_to_say
          - null
          description: Has a criminal conviction they are legally required to disclose
          example: 'no'
        backgroundCheckConsent:
          type:
          - string
          - 'null'
          enum:
          - 'yes'
          - 'no'
          - prefer_not_to_say
          - null
          description: Consents to a background / reference / credit check or drug screen where the role requires one
          example: 'yes'
        relatedToEmployeeStatus:
          type:
          - string
          - 'null'
          enum:
          - 'yes'
          - 'no'
          - prefer_not_to_say
          - null
          description: 'Has a family member or close personal relationship with an employee of a company they apply to. Global, not per-employer: only a "no" is committable on a form.'
          example: 'no'
        exportControlUsPerson:
          type:
          - string
          - 'null'
          enum:
          - 'yes'
          - 'no'
          - prefer_not_to_say
          - null
          description: Is a U.S. person for export-control (ITAR / EAR) purposes. The only declaration whose "yes" is the permissive answer.
          example: 'yes'
        highestEducation:
          type:
          - string
          - 'null'
          enum:
          - high_school
          - associate
          - bachelor
          - master
          - doctorate
          - any
          - null
          description: Highest education level completed
          example: bachelor
        yearsOfExperience:
          type:
          - integer
          - 'null'
          description: Total years of professional experience
          example: 5
        veteranStatus:
          type:
          - string
          - 'null'
          enum:
          - not_a_veteran
          - veteran
          - disabled_veteran
          - recently_separated_veteran
          - active_duty_wartime_veteran
          - armed_forces_service_medal_veteran
          - prefer_not_to_say
          - null
          description: Veteran status for EEO forms
          example: prefer_not_to_say
        disabilityStatus:
          type:
          - string
          - 'null'
          enum:
          - 'yes'
          - 'no'
          - prefer_not_to_say
          - null
          description: Disability status for EEO forms
          example: prefer_not_to_say
        gender:
          type:
          - string
          - 'null'
          enum:
          - male
          - female
          - non_binary
          - prefer_not_to_say
          - other
          - null
          description: Gender for EEO forms
          example: prefer_not_to_say
        ethnicity:
          type:
          - string
          - 'null'
          enum:
          - american_indian_or_alaska_native
          - asian
          - black_or_african_american
          - hispanic_or_latino
          - native_hawaiian_or_pacific_islander
          - white
          - two_or_more_races
          - prefer_not_to_say
          - other
          - null
          description: Ethnicity for EEO forms
          example: prefer_not_to_say
        sexualOrientation:
          type:
          - string
          - 'null'
          enum:
          - heterosexual
          - gay_or_lesbian
          - bisexual
          - prefer_not_to_say
          - other
          - null
          description: Sexual orientation for EEO forms
          example: prefer_not_to_say
        pronouns:
          type:
          - string
          - 'null'
          maxLength: 40
          description: Preferred pronouns, self-described free text. Never inferred from a name or from `gender`.
          example: she/her
        applyReadiness:
          type: object
          properties:
            missingRequiredForApply:
              type: array
              items:
                type: string
                enum:
                - zip_code
                - state
                - country
                description: An application_profile column an employer form can require and that we never invent
                example: zip_code
              description: Profile columns an employer form can require that are empty. We never invent these; the user fills them.
              example:
              - zip_code
              - state
          required:
          - missingRequiredForApply
          description: Required-for-apply columns that are still empty
        addressCompleteness:
          type: object
          properties:
            city:
              type: boolean
            complete:
              type: boolean
            country:
              type: boolean
            postalCode:
              type: boolean
            state:
              type: boolean
            street:
              type: boolean
          required:
          - city
          - complete
          - country
          - postalCode
          - state
          - street
        createdAt:
          type: string
          description: Profile creation timestamp
          example: '2026-01-15T12:00:00Z'
        updatedAt:
          type: string
          description: Profile last update timestamp
          example: '2026-03-10T08:30:00Z'
      required:
      - id
      - userId
      - phone
      - addressLine1
      - addressLine2
      - city
      - state
      - zipCode
      - country
      - linkedinUrl
      - portfolioUrl
      - githubUrl
      - currentEmployer
      - dateOfBirth
      - workAuthorization
      - willingToRelocate
      - relocationLocations
      - salaryCurrency
      - availableStartDate
      - noticePeriod
      - personalNarrative
      - travelWillingness
      - securityClearance
      - restrictiveCovenantStatus
      - criminalRecordStatus
      - backgroundCheckConsent
      - relatedToEmployeeStatus
      - exportControlUsPerson
      - highestEducation
      - yearsOfExperience
      - veteranStatus
      - disabilityStatus
      - gender
      - ethnicity
      - sexualOrientation
      - pronouns
      - applyReadiness
      - addressCompleteness
      - createdAt
      - updatedAt
    ApplicationProfileSuggestions:
      type: object
      properties:
        currentEmployer:
          type:
          - object
          - 'null'
          properties:
            value:
              type: string
            source:
              type: string
              enum:
              - resume
              - none
              description: Where a suggested value came from. `none` means no suggestion could be inferred.
              example: resume
          required:
          - value
          - source
          description: 'Suggested current employer from the most recent `current: true` work-experience entry.'
        yearsOfExperience:
          type:
          - object
          - 'null'
          properties:
            value:
              type: integer
              minimum: 0
              maximum: 50
            source:
              type: string
              enum:
              - resume
              - none
              description: Where a suggested value came from. `none` means no suggestion could be inferred.
              example: resume
          required:
          - value
          - source
          description: Suggested total years of experience from the parsed resume.
        highestEducation:
          type:
          - object
          - 'null'
          properties:
            value:
              type: string
              enum:
              - high_school
              - associate
              - bachelor
              - master
              - doctorate
              - any
              description: Education level requirement
              example: any
            source:
              type: string
              enum:
              - resume
              - none
              description: Where a suggested value came from. `none` means no suggestion could be inferred.
              example: resume
          required:
          - value
          - source
          description: Suggested highest education level from the parsed resume.
        workAuthorization:
          type:
          - object
          - 'null'
          properties:
            value:
              type: string
              enum:
              - us_citizen
              - permanent_resident
              - visa_holder
              - require_sponsorship
              - other
              description: Work authorization status for job applications
              example: us_citizen
            source:
              type: string
              enum:
              - resume
              - none
              description: Where a suggested value came from. `none` means no suggestion could be inferred.
              example: resume
          required:
          - value
          - source
          description: Suggested work authorization. Null when the resume does not state it explicitly (low confidence) so the FE can prompt the user.
      required:
      - currentEmployer
      - yearsOfExperience
      - highestEducation
      - workAuthorization
    UpsertApplicationProfile:
      type: object
      properties:
        phone:
          type:
          - string
          - 'null'
          maxLength: 20
          description: Phone number
          example: +1-555-123-4567
        addressLine1:
          type:
          - string
          - 'null'
          maxLength: 255
          description: Address line 1
          example: 123 Main St
        addressLine2:
          type:
          - string
          - 'null'
          maxLength: 255
          description: Address line 2
          example: Apt 4B
        city:
          type:
          - string
          - 'null'
          maxLength: 100
          description: City
          example: San Francisco
        state:
          type:
          - string
          - 'null'
          maxLength: 100
          description: State or province
          example: CA
        zipCode:
          type:
          - string
          - 'null'
          maxLength: 20
          description: ZIP or postal code
          example: '94105'
        country:
          type:
          - string
          - 'null'
          maxLength: 100
          description: Country
          example: US
        linkedinUrl:
          type:
          - string
          - 'null'
          maxLength: 500
          format: uri
          description: LinkedIn profile URL
          example: https://linkedin.com/in/johndoe
        portfolioUrl:
          type:
          - string
          - 'null'
          maxLength: 500
          format: uri
          description: Portfolio website URL
          example: https://johndoe.dev
        githubUrl:
          type:
          - string
          - 'null'
          maxLength: 500
          format: uri
          description: GitHub profile URL
          example: https://github.com/johndoe
        currentEmployer:
          type:
          - string
          - 'null'
          maxLength: 120
          description: Current employer / company. Helps tailor recommendations; unlocks team analytics if the company onboards.
          example: Acme Corp
        dateOfBirth:
          type:
          - string
          - 'null'
          description: Date of birth (ISO 8601 date string)
          example: '1995-06-15'
        workAuthorization:
          type:
          - string
          - 'null'
          enum:
          - us_citizen
          - permanent_resident
          - visa_holder
          - require_sponsorship
