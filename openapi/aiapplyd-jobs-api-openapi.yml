        location:
          type:
          - string
          - 'null'
          description: Job location
          example: Remote, US
        salary:
          type:
          - string
          - 'null'
          description: Salary range or details
          example: $120,000 - $160,000
        sourceUrl:
          type:
          - string
          - 'null'
