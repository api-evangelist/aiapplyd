    PollingEnvelope:
      type: object
      properties:
        message:
          type: string
          description: Human-readable description of the async operation state
          example: Resume optimization started
        resourceId:
          type: string
          description: Identifier of the resource whose detail endpoint should be polled
          example: '42'
        retryAfterMs:
          type: integer
          minimum: 0
          description: Suggested delay before the next poll, in milliseconds
          example: 3000
        status:
          type: string
          enum:
          - pending
          - processing
          - streaming
          - completed
          - failed
          description: Status of async polling operation
          example: processing
        throttled:
          type: boolean
          description: True when the per-user hourly auto-generation cap was hit; no work was enqueued and the client should not poll.
          example: true
      required:
      - message
      - retryAfterMs
      - status
      additionalProperties: false
  securitySchemes:
    BearerAuth:
      description: 'Session token from signing in to AI Applyd, sent as `Authorization: Bearer <token>`.'
      scheme: bearer
      type: http
