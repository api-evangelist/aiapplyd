        resolvedApplyUrl:
          type:
          - string
          - 'null'
          description: Resolved external ATS apply URL from the linked job match (e.g. the Greenhouse/Lever page a LinkedIn-scraped job actually applies on). Prefer this over `source` for the provider badge.
          example: https://boards.greenhouse.io/acme/jobs/123
        linkedinApplyMethod:
          type:
          - string
          - 'null'
          enum:
          - easy_apply
          - offsite
          - unknown
          - null
          description: Resolved LinkedIn apply target from the linked job match. `offsite` → applies on a company ATS (use resolvedApplyUrl for the badge); `easy_apply` → "LinkedIn Easy Apply"; `unknown`/null → fall back to `source`.
          example: offsite
        description:
          type: string
          description: Full job description text
          example: We are looking for a senior engineer...
        requirements:
