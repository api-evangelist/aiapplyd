  /jobs/{id}/ghosting-status:
    get:
      tags:
      - Jobs
      summary: Get Ghosting Status
      description: Detect potential ghosting based on time since last inbound email for this job.
      parameters:
      - schema:
          type: string
          pattern: ^\d+$
          description: Job listing identifier
          example: '1'
        required: true
        description: Job listing identifier
        in: path
        name: id
      responses:
        '200':
          description: Ghosting detection result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GhostingStatusResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: getJobsByIdGhostingStatus
components:
  schemas:
    CaseStudyRecommendation:
      type:
      - object
      - 'null'
      properties:
        anticipatedQuestions:
          type: array
          items:
            type: string
          description: Questions the interviewer might ask about this project
        framingStrategy:
          type: string
          description: How to frame the presentation (what to emphasize, what order)
        keyMetrics:
          type: array
          items:
            type: string
          description: Specific metrics to highlight from this project
        projectName:
          type: string
          description: Which project from the resume to present as a case study
        whyThisProject:
          type: string
          description: Why this project is the best fit for this specific role
      required:
      - anticipatedQuestions
      - framingStrategy
      - keyMetrics
      - projectName
      - whyThisProject
      description: Recommended case study project to present during the interview. Null when none applies.
    AtsScoreListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AtsScore'
        meta:
          $ref: '#/components/schemas/ResponseMetadata'
        success:
          type: boolean
          enum:
          - true
      required:
      - data
      - success
      additionalProperties: false
      description: Successful API response
    JobListingGoneResponse:
      type: object
      properties:
        hasArchiveInfo:
          type: boolean
          description: True when redirectTo was derived from real archive data, false when it is the catch-all default
          example: false
        redirectTo:
          type: string
          minLength: 1
          description: Path the frontend should redirect to after a gone response
          example: /dashboard/discover
        status:
          type: string
          enum:
          - gone
          description: Discriminator literal so clients can match this body shape via safeParse
          example: gone
      required:
      - hasArchiveInfo
      - redirectTo
      - status
      additionalProperties: false
