openapi: 3.2.0
info:
  contact:
    email: support@aiapplyd.com
    name: AI Applyd
    url: https://aiapplyd.com
  description: 'The AI Applyd API runs the whole job hunt for you: it matches you to roles that fit your profile, rewrites your resume for each posting, writes the cover letter the form asks for, and auto-applies across the major applicant tracking systems.'
  license:
    name: Proprietary
    url: https://aiapplyd.com/legal/terms
  title: AI Applyd Jobs API
  version: 115c47ce
servers:
- description: Current environment
  url: https://api.aiapplyd.com/api/v1
security:
- BearerAuth: []
tags:
- name: Jobs
paths:
  /jobs/extract-keywords:
    post:
      tags:
      - Jobs
      summary: Extract Keywords from Job Description
      description: Extract ATS keywords and skills from a job description. Requires authentication.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractKeywordsRequest'
      responses:
        '200':
          description: Extracted keywords with categories and importance weights
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractKeywordsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postJobsExtractKeywords
  /jobs/compare:
    post:
      tags:
      - Jobs
      summary: Compare Job Offers
      description: Compare 2-5 job listings side-by-side with weighted scoring across 10 dimensions. Requires authentication and a resume.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfferComparisonRequest'
      responses:
        '200':
          description: Offer comparison matrix with scores and recommendation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferComparisonResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postJobsCompare
  /jobs/parse-url:
    post:
      tags:
      - Jobs
      summary: Parse Job URL
      description: Fetch a job posting URL and extract structured job data using AI.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParseJobUrlRequest'
      responses:
        '200':
          description: Parsed job data from URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseJobUrlResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postJobsParseUrl
  /jobs/import-url:
    post:
      tags:
      - Jobs
      summary: Import Job by URL
      description: Scrape a single job posting from a direct application URL and add it to the authenticated user's feed. Rejects aggregator URLs (LinkedIn / Indeed / Glassdoor) - paste the company's direct application URL (Greenhouse / Lever / Ashby / Workday, etc.).
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportJobByUrlRequest'
      responses:
        '200':
          description: Job imported into the user feed (or matched to a pre-existing pooled posting)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJobByUrlResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postJobsImportUrl
  /jobs/ats-scores/{atsScoreId}:
    get:
      tags:
      - Jobs
      summary: Get ATS Score
      description: Get a single ATS score row by id (for polling async generation status).
      parameters:
      - schema:
          type: string
          pattern: ^\d+$
          description: ATS score identifier
          example: '1'
        required: true
        description: ATS score identifier
        in: path
        name: atsScoreId
      responses:
        '200':
          description: ATS score row
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtsScoreRecordResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: getJobsAtsScoresByAtsScoreId
  /jobs/stats:
    get:
      tags:
      - Jobs
      summary: Job Listing Stats
      description: 'Aggregate counts for the authenticated user: totals, applied-today, applied-this-week, ghosted, and interviewing.'
      responses:
        '200':
          description: Aggregate job listing stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: getJobsStats
  /jobs:
    get:
      tags:
      - Jobs
      summary: List Job Listings
      description: Get all job listings for the authenticated user.
      parameters:
      - schema:
          type: string
          enum:
          - saved
          - preparing
          - applied
          - interviewing
          - offered
          - rejected
          - archived
          description: Filter by a single job listing status
          example: saved
        required: false
        description: Filter by a single job listing status
        name: status
        in: query
      - schema:
          type: string
          description: Filter by multiple job listing statuses (comma-separated)
          example: applied,preparing
        required: false
        description: Filter by multiple job listing statuses (comma-separated)
        name: statuses
        in: query
      - schema:
          type: string
          maxLength: 200
          description: Search job listings by title, company, or location
          example: software engineer
        required: false
        description: Search job listings by title, company, or location
        name: search
        in: query
      - schema:
          type: string
          enum:
          - newest
          - oldest
          - best_match
          - status
          - company_az
          description: Sort order for the returned listings
          example: newest
        required: false
        description: Sort order for the returned listings
        name: sort
        in: query
      responses:
        '200':
          description: List of job listings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListingListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: getJobs
    post:
      tags:
      - Jobs
      summary: Create Job Listing
      description: 'Create a new job listing for tracking and ATS analysis. Idempotent per user on `sourceUrl`: when the caller already tracks the same posting (tracking params, trailing slash and fragment ignored), the existing listing is returned with 200 and nothing is inserted.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobListingRequest'
      responses:
        '200':
          description: The caller already tracks this posting; that listing is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListingCreatedResponse'
        '201':
          description: Job listing created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListingCreatedResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postJobs
  /jobs/{id}:
    get:
      tags:
      - Jobs
      summary: Get Job Listing
      description: Get a specific job listing by ID. Returns 410 Gone with a redirect target when the listing was deleted (e.g. blog deep-link to a stale ID).
      parameters:
      - schema:
          type: string
          pattern: ^\d+$
          description: Job listing identifier
          example: '1'
        required: true
        description: Job listing identifier
        in: path
        name: id
      responses:
        '200':
          description: Job listing details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListingResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '410':
          description: Job listing was deleted or never existed; body carries a redirectTo target
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListingGoneResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: getJobsById
    put:
      tags:
      - Jobs
      summary: Update Job Listing
      description: Update an existing job listing.
      parameters:
      - schema:
          type: string
          pattern: ^\d+$
          description: Job listing identifier
          example: '1'
        required: true
        description: Job listing identifier
        in: path
        name: id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateJobListingRequest'
      responses:
        '200':
          description: Job listing updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListingResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: putJobsById
    delete:
      tags:
      - Jobs
      summary: Delete Job Listing
      description: Delete a job listing and all associated ATS scores.
      parameters:
      - schema:
          type: string
          pattern: ^\d+$
          description: Job listing identifier
          example: '1'
        required: true
        description: Job listing identifier
        in: path
        name: id
      responses:
        '200':
          description: Job listing deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSuccessResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: deleteJobsById
  /jobs/{id}/ats-score:
    post:
      tags:
      - Jobs
      summary: Run ATS Score Analysis
      description: Run ATS compatibility analysis for a document against this job listing.
      parameters:
      - schema:
          type: string
          pattern: ^\d+$
          description: Job listing identifier
          example: '1'
        required: true
        description: Job listing identifier
        in: path
        name: id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunAtsScoreRequest'
      responses:
        '201':
          description: ATS score analysis completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtsScoreRecordResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postJobsByIdAtsScore
  /jobs/{id}/ats-scores:
    get:
      tags:
      - Jobs
      summary: List ATS Scores
      description: Get all ATS scores for a job listing.
      parameters:
      - schema:
          type: string
          pattern: ^\d+$
          description: Job listing identifier
          example: '1'
        required: true
        description: Job listing identifier
        in: path
        name: id
      responses:
        '200':
          description: List of ATS scores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtsScoreListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: getJobsByIdAtsScores
  /jobs/{id}/generate-interview-prep:
    post:
      tags:
      - Jobs
      summary: Generate Interview Prep Content
      description: Generate AI-powered interview preparation content for a specific job listing.
      parameters:
      - schema:
          type: string
          pattern: ^\d+$
          description: Job listing identifier
          example: '1'
        required: true
        description: Job listing identifier
        in: path
        name: id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateInterviewPrepRequest'
      responses:
        '200':
          description: Interview prep content generated successfully, or a polling/throttled envelope
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/GenerateInterviewPrepResponse'
                - $ref: '#/components/schemas/PollingResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postJobsByIdGenerateInterviewPrep
  /jobs/{id}/generate-all:
    post:
      tags:
      - Jobs
      summary: Generate Full Job Timeline
      description: Kick off interview prep, compensation intelligence, and the match report (when a job match is linked) in one batched, personalized action. Returns a polling envelope; the job-detail tabs poll each status.
      parameters:
      - schema:
          type: string
          pattern: ^\d+$
          description: Job listing identifier
          example: '1'
        required: true
        description: Job listing identifier
        in: path
        name: id
      responses:
        '202':
          description: Timeline generation queued; poll the job detail for per-tab statuses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PollingResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
