          enum:
          - saved
          - preparing
          - applied
          - interviewing
          - offered
          - rejected
          - archived
          description: Status of a job listing
          example: saved
        updatedAt:
          type:
          - string
          - 'null'
          description: Last update timestamp
          example: '2024-01-15T10:30:00Z'
        source:
          type:
          - string
          - 'null'
          enum:
          - linkedin
          - indeed
          - glassdoor
          - google
          - ziprecruiter
          - remotive
          - jobicy
          - arbeitnow
          - ashby
          - greenhouse
          - himalayas
