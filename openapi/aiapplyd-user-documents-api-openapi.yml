        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postUserDocumentsTranslatePreview
    servers:
    - description: Current environment
      url: https://api.aiapplyd.com/api/v1
  /user-documents/save-translation:
    post:
      tags:
      - user-documents
      summary: Save Translation Preview
      description: Persist a translation preview result as a new document with generated PDF.
      requestBody:
        content:
          application/json:
            schema:
