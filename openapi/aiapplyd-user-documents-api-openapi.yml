  /user-documents/shared/{token}:
    get:
      tags:
      - user-documents
      summary: Get Shared Document
      description: Get a publicly shared document by its share token. No authentication required.
      parameters:
      - schema:
          type: string
          minLength: 1
          description: Share token
        required: true
        description: Share token
        in: path
        name: token
      - schema:
          type: string
          enum:
          - metadata
          - file
          default: metadata
          description: Return public document metadata or the stored file bytes.
          example: metadata
        required: false
        description: Return public document metadata or the stored file bytes.
        name: content
        in: query
      responses:
        '200':
          description: Shared document details or safe stored-file bytes
          content:
            application/json:
              schema:
