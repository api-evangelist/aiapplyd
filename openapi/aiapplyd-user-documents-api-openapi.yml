        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postUserDocumentsSaveTranslation
    servers:
    - description: Current environment
      url: https://api.aiapplyd.com/api/v1
