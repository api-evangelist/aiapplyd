openapi: 3.2.0
info:
  title: Aiapplyd User Documents API
  version: 115c47ce
  contact:
    email: support@aiapplyd.com
    name: AI Applyd
    url: https://aiapplyd.com
  license:
    name: Proprietary
    url: https://aiapplyd.com/legal/terms
  description: 'Operations tagged user-documents across 2 of this provider''s published API definitions: aiapplyd-openapi.json, aiapplyd-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Current environment
  url: https://api.aiapplyd.com/api/v1
security:
- BearerAuth: []
tags:
- name: user-documents
paths:
  /user-documents:
    get:
      tags:
      - user-documents
      summary: List User Documents
      description: Get all standalone documents for the authenticated user.
      parameters:
      - schema:
          type: string
          enum:
          - cover_letter
          - resume
          - custom
          - tailored_resume
          - translation
          - match_report
          description: Filter by document type
          example: resume
        required: false
        description: Filter by document type
        name: type
        in: query
      - schema:
          type: integer
          default: 1
          description: Page number (1-based)
          example: 1
          exclusiveMinimum: 0
        required: false
        description: Page number (1-based)
        name: page
        in: query
      - schema:
          type: integer
          maximum: 100
          default: 50
          description: Results per page (max 100)
          example: 50
          exclusiveMinimum: 0
        required: false
        description: Results per page (max 100)
        name: limit
        in: query
      responses:
        '200':
          description: List of user documents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDocumentListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: getUserDocuments
    post:
      tags:
      - user-documents
      summary: Create User Document
      description: Create a new standalone document metadata record.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserDocumentRequest'
      responses:
        '201':
          description: User document created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDocumentCreatedResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postUserDocuments
    servers:
    - description: Current environment
      url: https://api.aiapplyd.com/api/v1
  /user-documents/translate-preview:
    post:
      tags:
      - user-documents
      summary: Translate Preview (Temporary)
      description: Upload a file and translate it without saving. Returns translated text for each language.
      requestBody:
        content:
          multipart/form-data:
            schema:
              allOf:
              - $ref: '#/components/schemas/TranslatePreviewRequest'
              - type: object
                properties:
                  file:
                    type: string
                    description: PDF or DOCX file to translate.
