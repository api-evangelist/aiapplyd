openapi: 3.2.0
info:
  contact:
    email: support@aiapplyd.com
    name: AI Applyd
    url: https://aiapplyd.com
  description: 'The AI Applyd API runs the whole job hunt for you: it matches you to roles that fit your profile, rewrites your resume for each posting, writes the cover letter the form asks for, and auto-applies across the major applicant tracking systems. Every send is tracked from the swipe to the employer''s own confirmation, so you always know what landed. Authenticate with a Bearer session token. The same surface powers the web app, the mobile app and the AI Applyd MCP server for ChatGPT, Claude and other agents.'
  license:
    name: Proprietary
    url: https://aiapplyd.com/legal/terms
  title: AI Applyd Reviews API
  version: fa810d82
servers:
- description: Current environment
  url: https://api.aiapplyd.com/api/v1
security:
- BearerAuth: []
tags:
- description: Your own product review.
  name: Reviews
paths:
  /reviews/me:
    get:
      description: 'Get the authenticated user''s own review, whatever its moderation status. Returns `review: null` when they have not written one - that is a normal state, not a 404.'
      summary: Get my review
      tags:
      - Reviews
      responses:
        '200':
          description: The caller's review, or null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnReviewResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: getReviewsMe
    post:
      description: 'Create or replace the authenticated user''s single review. Always lands in `pending` and always clears any previous moderation decision: an approval covers specific words, so edited words need a fresh one. `consentToPublish` must be sent on every submit - it is never carried over.'
      summary: Submit or update my review
      tags:
      - Reviews
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertOwnReview'
      responses:
        '200':
          description: The stored review, reset to `pending`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnReviewResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postReviewsMe
  /reviews/prompt:
    get:
      description: Whether the store-rating ask is due for the authenticated user. It becomes due once, after their first application with employer confirmation or their first interview / positive employer reply, whichever comes first. One re-ask is allowed 30 days after a "not now". Same answer on web, iOS and Android.
      summary: Get my rating-ask status
      tags:
      - Reviews
      responses:
        '200':
          description: The caller's rating-ask status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewPromptStatusResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: getReviewsPrompt
    post:
      description: 'Record what happened with the rating ask. `shown` / `requested` claim it (first device wins, `applied: false` means do not show). `rated` / `dismissed` answer an open web card.'
      summary: Record a rating-ask action
      tags:
      - Reviews
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordReviewPromptAction'
      responses:
        '200':
          description: Whether the action was applied, and the resulting status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordReviewPromptActionResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postReviewsPrompt
components:
  schemas:
    ApiErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            context:
              oneOf:
              - type: object
                properties:
                  errorType:
                    type: string
                    enum:
                    - validation
                  field:
                    type: string
                  fieldErrors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        expected:
                          type: string
                        field:
                          type: string
                        message:
                          type: string
                        received:
                          type: string
                      required:
                      - field
                      - message
                  schemaName:
                    type: string
                required:
                - errorType
              - type: object
                properties:
                  attemptedEmail:
                    type: string
                    format: email
                  errorType:
                    type: string
                    enum:
                    - authentication
                  failureReason:
                    type: string
                    enum:
                    - invalid_credentials
                    - account_locked
                    - expired_token
                    - token_expired
                    - missing_token
                    - invalid_token
                    - session_expired
                    description: Reason for authentication failure
                    example: token_expired
                  ipAddress:
                    type: string
                  operation:
                    type: string
                  service:
                    type: string
                  userAgent:
                    type: string
                required:
                - errorType
              - type: object
                properties:
                  actualPermission:
                    type: string
                  errorType:
                    type: string
                    enum:
                    - authorization
                  requiredPermission:
                    type: string
                  resource:
                    type: string
                  resourceId:
                    type: string
                  userId:
                    type: string
                required:
                - errorType
              - type: object
                properties:
                  constraint:
                    type: string
                  errorType:
                    type: string
                    enum:
                    - database
                  operation:
                    type: string
                    enum:
                    - insert
                    - update
                    - delete
                    - select
                    - batch
                    - transaction
                    - migration
                    description: Type of database operation
                    example: select
                  resourceId:
                    type: string
                  sqlState:
                    type: string
                  table:
                    type: string
                  userId:
                    type: string
                required:
                - errorType
              - type: object
                properties:
                  endpoint:
                    type: string
                  errorType:
                    type: string
                    enum:
                    - external_service
                  httpStatus:
                    type: number
                  operation:
                    type: string
                  resourceId:
                    type: string
                  responseTime:
                    type: number
                  retryAttempt:
                    type: integer
                  service:
                    type: string
                  serviceName:
                    type: string
                  userId:
                    type: string
                required:
                - errorType
              - type: object
                properties:
                  errorType:
                    type: string
                    enum:
                    - resource
                  resource:
                    type: string
                  resourceId:
                    type: string
                  service:
                    type: string
                  userId:
                    type: string
                required:
                - errorType
              - type: object
                properties:
                  errorType:
                    type: string
                    enum:
                    - rate_limit
                  limit:
                    type: number
                  resetTime:
                    type: string
                  windowMs:
                    type: number
                required:
                - errorType
              - type: object
                properties:
                  configKey:
                    type: string
                  errorType:
                    type: string
                    enum:
                    - configuration
                  operation:
                    type: string
                  service:
                    type: string
                required:
                - errorType
              description: Type-safe error context information
              example:
                errorType: validation
                fieldErrors:
                - field: email
                  message: Invalid email format
            details:
              oneOf:
              - type: object
                properties:
                  detailType:
                    type: string
                    enum:
                    - validation
                  validationErrors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        field:
                          type: string
                        message:
                          type: string
                      required:
                      - field
                      - message
                required:
                - detailType
                - validationErrors
                additionalProperties: false
              - type: object
                properties:
                  detailType:
                    type: string
                    enum:
                    - service_error
                  originalError:
                    type: string
                  serviceName:
                    type: string
                required:
                - detailType
                - serviceName
                additionalProperties: false
              - type: object
                properties:
                  currentSize:
                    type: number
                  detailType:
                    type: string
                    enum:
                    - batch
                  originalError:
                    type: string
                  statementCount:
                    type: number
                required:
                - detailType
                additionalProperties: false
              - type: object
                properties:
                  detailType:
                    type: string
                    enum:
                    - rate_limit
                  limit:
                    type: number
                  resetTime:
                    type: string
                  windowMs:
                    type: number
                required:
                - detailType
                - limit
                - resetTime
                - windowMs
                additionalProperties: false
              - type: object
                properties:
                  conflictingField:
                    type: string
                  detailType:
                    type: string
                    enum:
                    - resource
                  resourceId:
                    anyOf:
                    - type: string
                    - type: number
                  resourceType:
                    type: string
                required:
                - detailType
                additionalProperties: false
              - type: object
                properties:
                  detailType:
                    type: string
                    enum:
                    - generic
                  info:
                    type: string
                required:
                - detailType
                additionalProperties: false
              - type: object
                properties:
                  currentTokens:
                    type: integer
                    minimum: 0
                  detailType:
                    type: string
                    enum:
                    - insufficient_tokens
                  requiredTokens:
                    type: integer
                    minimum: 0
                required:
                - currentTokens
                - detailType
                - requiredTokens
                additionalProperties: false
            message:
              type: string
            validation:
              type: array
              items:
                type: object
                properties:
                  code:
                    type: string
                  field:
                    type: string
                  message:
                    type: string
                required:
                - field
                - message
                additionalProperties: false
          required:
          - code
          - message
          additionalProperties: false
        meta:
          $ref: '#/components/schemas/ResponseMetadata'
        success:
          type: boolean
          enum:
          - false
      required:
      - error
      - success
      additionalProperties: false
    RecordReviewPromptAction:
      type: object
      properties:
        action:
          type: string
          enum:
          - shown
          - requested
          - rated
          - dismissed
          description: '`shown` (web card rendered) and `requested` (native OS ask) claim the ask. `rated` and `dismissed` answer a shown web card.'
          example: shown
        platform:
          type: string
          enum:
          - web
          - ios
          - android
          description: 'Surface that showed the rating ask: the web app, the iOS app or the Android app.'
          example: ios
      required:
      - action
      - platform
      additionalProperties: false
    ReviewPromptStatusResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            prompt:
              $ref: '#/components/schemas/ReviewPromptStatus'
          required:
          - prompt
          additionalProperties: false
        meta:
          $ref: '#/components/schemas/ResponseMetadata'
        success:
          type: boolean
          enum:
          - true
      required:
      - data
      - success
      additionalProperties: false
      description: Successful API response
    OwnReviewData:
      type:
      - object
      - 'null'
      properties:
        body:
          type: string
        consentRecordedAt:
          type:
          - string
          - 'null'
          description: When consent was given. Null whenever consent is currently withheld.
          example: '2026-08-31T09:15:00.000Z'
        consentToPublish:
          type: boolean
        createdAt:
          type: string
        displayName:
          type: string
        id:
          type: integer
        rating:
          type: integer
          minimum: 1
          maximum: 5
          description: Star rating, 1-5 inclusive.
          example: 5
        status:
          type: string
          enum:
          - pending
          - approved
          - rejected
          description: Moderation state of a user review. Only `approved` rows that also carry publish consent are ever public.
          example: pending
        updatedAt:
          type: string
      required:
      - body
      - consentRecordedAt
      - consentToPublish
      - createdAt
      - displayName
      - id
      - rating
      - status
      - updatedAt
      additionalProperties: false
    ReviewPromptStatus:
      type: object
      properties:
        outcome:
          type:
          - string
          - 'null'
          enum:
          - shown
          - requested
          - rated
          - dismissed
          - null
          description: What happened the last time we asked. Null when never asked.
          example: null
        promptCount:
          type: integer
          minimum: 0
          description: How many times the ask has been shown, on any device.
          example: 0
        shouldPrompt:
          type: boolean
          description: True when the ask is due now. Clients show it only after a successful claim.
          example: true
        trigger:
          type:
          - string
          - 'null'
          enum:
          - landed
          - interview
          - null
          description: The good moment that made the person eligible. Null while not eligible.
          example: landed
      required:
      - outcome
      - promptCount
      - shouldPrompt
      - trigger
      additionalProperties: false
    RecordReviewPromptActionResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            applied:
              type: boolean
              description: 'False when nothing changed: the claim was lost to another device, the ask was not due, or there was no open card to answer. On a claim, show the ask only when this is true.'
              example: true
            prompt:
              $ref: '#/components/schemas/ReviewPromptStatus'
          required:
          - applied
          - prompt
          additionalProperties: false
        meta:
          $ref: '#/components/schemas/ResponseMetadata'
        success:
          type: boolean
          enum:
          - true
      required:
      - data
      - success
      additionalProperties: false
      description: Successful API response
    UpsertOwnReview:
      type: object
      properties:
        body:
          type: string
          minLength: 0
          maxLength: 2000
          default: ''
          description: 'The review itself, in the reviewer''s own words. Optional: an empty string records a stars-only rating.'
          example: I stopped writing cover letters by hand and started getting replies within a fortnight.
        consentToPublish:
          type: boolean
          description: Explicit permission to publish these words, this name and this rating on the public site. Required on every submit - it is never inherited from a previous version of the review.
          example: true
        displayName:
          type: string
          minLength: 2
          maxLength: 80
          description: What the reviewer wants to be credited as. Their choice, never their account name.
          example: Ava K.
        rating:
          type: integer
          minimum: 1
          maximum: 5
          description: Star rating, 1-5 inclusive.
          example: 5
      required:
      - consentToPublish
      - displayName
      - rating
      additionalProperties: false
    ResponseMetadata:
      type: object
      properties:
        duration:
          type: number
          minimum: 0
          description: Request duration in milliseconds
          example: 150
        performance:
          type: object
          properties:
            dbQueries:
              type: integer
              minimum: 0
            totalDbTime:
              type: number
              minimum: 0
          description: Performance metrics (preview/local only)
        requestId:
          type: string
          description: Unique request identifier
          example: req_abc123
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp
          example: '2026-10-19T20:12:14.033Z'
        version:
          type: string
          description: API version
          example: v1
    OwnReviewResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            review:
              $ref: '#/components/schemas/OwnReviewData'
          required:
          - review
          additionalProperties: false
        meta:
          $ref: '#/components/schemas/ResponseMetadata'
        success:
          type: boolean
          enum:
          - true
      required:
      - data
      - success
      additionalProperties: false
      description: Successful API response
  securitySchemes:
    BearerAuth:
      description: 'Session token from signing in to AI Applyd, sent as `Authorization: Bearer <token>`.'
      scheme: bearer
      type: http
