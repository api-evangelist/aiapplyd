      - success
      additionalProperties: false
    GoogleStatusData:
      type: object
      properties:
        calendar:
          $ref: '#/components/schemas/GoogleServiceStatus'
        gmail:
          $ref: '#/components/schemas/GoogleServiceStatus'
      required:
      - calendar
      - gmail
      additionalProperties: false
    GoogleDisconnectBody:
      type: object
      properties:
        service:
          type: string
          enum:
          - gmail
          - calendar
          description: Service within an integration provider the user opted into
          example: gmail
      required:
      - service
      additionalProperties: false
    GoogleDisconnectResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/GoogleDisconnectData'
        meta:
          $ref: '#/components/schemas/ResponseMetadata'
        success:
          type: boolean
          enum:
          - true
      required:
      - data
      - success
      additionalProperties: false
      description: Successful API response
    GoogleConnectResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/GoogleConnectData'
        meta:
          $ref: '#/components/schemas/ResponseMetadata'
        success:
          type: boolean
          enum:
          - true
      required:
      - data
      - success
      additionalProperties: false
      description: Successful API response
    GoogleServiceStatus:
      type: object
      properties:
        connected:
          type: boolean
          description: Whether a live (non-revoked) connection exists for this service
          example: true
        email:
          type:
          - string
          - 'null'
          description: Connected Google account email, when known
          example: user@gmail.com
        scopes:
          type: array
          items:
            type: string
          description: OAuth scopes Google granted for this service
          example:
          - https://www.googleapis.com/auth/gmail.modify
      required:
      - connected
      - email
      - scopes
      additionalProperties: false
    GoogleConnectData:
      type: object
      properties:
        authUrl:
          type: string
          format: uri
          description: Google authorization URL to redirect / open the user to
          example: https://accounts.google.com/o/oauth2/v2/auth?...
      required:
      - authUrl
      additionalProperties: false
    GoogleDisconnectData:
      type: object
      properties:
        disconnected:
          type: boolean
          description: True when the connection row was removed (or already absent)
          example: true
        service:
          type: string
          enum:
          - gmail
          - calendar
          description: Service within an integration provider the user opted into
          example: gmail
      required:
      - disconnected
      - service
      additionalProperties: false
    ResponseMetadata:
      type: object
      properties:
        duration:
          type: number
          description: Request duration in milliseconds
          example: 150
          exclusiveMinimum: 0
        performance:
          type: object
          properties:
            dbQueries:
              type: integer
              minimum: 0
            totalDbTime:
              type: number
              minimum: 0
          description: Performance metrics (preview/local only)
        requestId:
          type: string
          description: Unique request identifier
          example: req_abc123
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp
          example: '2026-09-25T17:29:47.224Z'
        version:
          type: string
          description: API version
          example: v1
  securitySchemes:
    BearerAuth:
      description: 'Session token from signing in to AI Applyd, sent as `Authorization: Bearer <token>`.'
      scheme: bearer
      type: http
