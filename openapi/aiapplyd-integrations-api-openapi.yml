openapi: 3.2.0
info:
  contact:
    email: support@aiapplyd.com
    name: AI Applyd
    url: https://aiapplyd.com
  description: 'The AI Applyd API runs the whole job hunt for you: it matches you to roles that fit your profile, rewrites your resume for each posting, writes the cover letter the form asks for, and auto-applies across the major applicant tracking systems. Every send is tracked from the swipe to the employer''s own confirmation, so you always know what landed. Authenticate with a Bearer session token. The same surface powers the web app, the mobile app and the AI Applyd MCP server for ChatGPT, Claude and other agents.'
  license:
    name: Proprietary
    url: https://aiapplyd.com/legal/terms
  title: AI Applyd Integrations API
  version: fa810d82
servers:
- description: Current environment
  url: https://api.aiapplyd.com/api/v1
security:
- BearerAuth: []
tags:
- description: Connected Gmail and Outlook mailboxes.
  name: Integrations
paths:
  /integrations/mail:
    get:
      tags:
      - Integrations
      summary: Mail connections
      description: The user's connected Gmail and Outlook mailboxes, the relay address, the address applications go out under, and whether integrations are open to this account.
      responses:
        '200':
          description: Mail connections retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailConnectionsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: getIntegrationsMail
  /integrations/mail/applicant-address:
    put:
      tags:
      - Integrations
      summary: Pick the applicant address
      description: Applications go out under the relay address or a connected mailbox.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicantAddressChoice'
      responses:
        '200':
          description: Applicant address updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailConnectionsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: putIntegrationsMailApplicantAddress
  /integrations/mail/{provider}/connect:
    post:
      tags:
      - Integrations
      summary: Start a mailbox connection
      description: Returns the provider consent URL. Needs Hired Yesterday (below it the refusal is the limit_reached envelope, 403) and an approved integrations beta request (else 403).
      parameters:
      - schema:
          type: string
          enum:
          - gmail
          - outlook
          description: Connected user mailbox provider
          example: gmail
        required: true
        description: Connected user mailbox provider
        in: path
        name: provider
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailConnectRequest'
      responses:
        '200':
          description: Consent URL built
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailConnectResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postIntegrationsMailByProviderConnect
  /integrations/mail/{provider}/callback:
    get:
      tags:
      - Integrations
      summary: Mailbox OAuth callback
      description: The provider redirects here after consent. Exchanges the code, stores the mailbox and redirects to the web Integrations page or the app.
      parameters:
      - schema:
          type: string
          enum:
          - gmail
          - outlook
          description: Connected user mailbox provider
          example: gmail
        required: true
        description: Connected user mailbox provider
        in: path
        name: provider
      - schema:
          type: string
          minLength: 1
        required: false
        name: code
        in: query
      - schema:
          type: string
        required: false
        name: error
        in: query
      - schema:
          type: string
          minLength: 1
        required: false
        name: state
        in: query
      responses:
        '302':
          description: Redirect back to the web Integrations page or the app with ?connected= or ?error=
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: getIntegrationsMailByProviderCallback
  /integrations/mail/{provider}/sync:
    post:
      tags:
      - Integrations
      summary: Pull mail now
      description: Pulls new job mail from the connected mailbox into the inbox, then returns the connections.
      parameters:
      - schema:
          type: string
          enum:
          - gmail
          - outlook
          description: Connected user mailbox provider
          example: gmail
        required: true
        description: Connected user mailbox provider
        in: path
        name: provider
      responses:
        '200':
          description: Mailbox synced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailConnectionsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postIntegrationsMailByProviderSync
  /integrations/mail/{provider}:
    delete:
      tags:
      - Integrations
      summary: Disconnect a mailbox
      description: Revokes the grant, deletes the mail pulled from this mailbox and removes the connection.
      parameters:
      - schema:
          type: string
          enum:
          - gmail
          - outlook
          description: Connected user mailbox provider
          example: gmail
        required: true
        description: Connected user mailbox provider
        in: path
        name: provider
      responses:
        '200':
          description: Mailbox disconnected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailConnectionsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: deleteIntegrationsMailByProvider
  /integrations/indeed:
    get:
      tags:
      - Integrations
      summary: Indeed connection
      description: Where the Indeed sign-in stands, the mailbox it signs in with, and whether integrations are open to this account.
      responses:
        '200':
          description: Indeed connection retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndeedConnectionResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: getIntegrationsIndeed
    delete:
      tags:
      - Integrations
      summary: Disconnect Indeed
      description: Deletes the stored Indeed session. Apply runs stop using it at once.
      responses:
        '200':
          description: Indeed disconnected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndeedConnectionResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: deleteIntegrationsIndeed
  /integrations/indeed/connect:
    post:
      tags:
      - Integrations
      summary: Start the Indeed sign-in
      description: Starts a browser run that signs in to Indeed with the applicant mailbox and reads Indeed's email code from it. Needs Hired Yesterday (else the limit_reached envelope, 403) and an approved integrations beta request (else 403) and a connected applicant mailbox (else 400). Pressing it while a run is in flight returns the current state.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndeedConnectBody'
      responses:
        '200':
          description: Sign-in started, or already running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndeedConnectionResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postIntegrationsIndeedConnect
  /integrations/indeed/phone-code:
    post:
      tags:
      - Integrations
      summary: Send Indeed's SMS code
      description: The code Indeed texted to the user. Accepted only while the sign-in waits for it (else 400).
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndeedPhoneCodeRequest'
      responses:
        '200':
          description: Code handed to the sign-in run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndeedConnectionResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postIntegrationsIndeedPhoneCode
  /integrations/beta-request:
    post:
      tags:
      - Integrations
      summary: Request the integrations beta
      description: 'Asks for Gmail, Outlook and Indeed connections. Needs Hired Yesterday (else the limit_reached envelope, 403). Idempotent: a repeat request keeps the first one, and a denied account may ask again. Answers with the account''s integrations access.'
      responses:
        '200':
          description: Request recorded, or already recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationsAccess'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postIntegrationsBetaRequest
components:
  schemas:
    ApplicantAddress:
      oneOf:
      - type: object
        properties:
          email:
            type:
            - string
            - 'null'
          kind:
            type: string
            enum:
            - relay
        required:
        - email
        - kind
      - type: object
        properties:
          email:
            type: string
          kind:
            type: string
            enum:
            - mailbox
          provider:
            type: string
            enum:
            - gmail
            - outlook
            description: Connected user mailbox provider
            example: gmail
        required:
        - email
        - kind
        - provider
    GmailForwardingView:
      type: object
      properties:
        confirmation:
          $ref: '#/components/schemas/GmailForwardingConfirmation'
        relayAddress:
          type:
          - string
          - 'null'
      required:
      - confirmation
      - relayAddress
    IndeedConnectionResponse:
      type: object
      properties:
        access:
          $ref: '#/components/schemas/IntegrationsAccess'
        connection:
          $ref: '#/components/schemas/IndeedConnectionView'
        deckLine:
          $ref: '#/components/schemas/IndeedDeckLine'
        signInMailbox:
          type:
          - object
          - 'null'
          properties:
            email:
              type: string
            provider:
              type: string
              enum:
              - gmail
              - outlook
              description: Connected user mailbox provider
              example: gmail
          required:
          - email
          - provider
        signInMailboxOptions:
          type: array
          items:
            type: object
            properties:
              email:
                type: string
              provider:
                type: string
                enum:
                - gmail
                - outlook
                description: Connected user mailbox provider
                example: gmail
            required:
            - email
            - provider
        stats:
          type: object
          properties:
            applications:
              type: integer
              minimum: 0
            deckJobs:
              type: integer
              minimum: 0
          required:
          - applications
          - deckJobs
        suggestedSite:
          type: string
          enum:
          - US
          - IN
          - GB
          - CA
          - AU
          - IE
          - DE
          - FR
          - NL
          - ES
          - IT
          - SG
          - AE
          - NZ
          - ZA
          - PH
          - MY
          - PK
          - BR
          - MX
          - JP
          description: The Indeed site the user has an account on, as an ISO 3166-1 alpha-2 country code
          example: DE
      required:
      - access
      - connection
      - signInMailbox
      - signInMailboxOptions
      - stats
      - suggestedSite
    ApiErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            context:
              oneOf:
              - type: object
                properties:
                  errorType:
                    type: string
                    enum:
                    - validation
                  field:
                    type: string
                  fieldErrors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        expected:
                          type: string
                        field:
                          type: string
                        message:
                          type: string
                        received:
                          type: string
                      required:
                      - field
                      - message
                  schemaName:
                    type: string
                required:
                - errorType
              - type: object
                properties:
                  attemptedEmail:
                    type: string
                    format: email
                  errorType:
                    type: string
                    enum:
                    - authentication
                  failureReason:
                    type: string
                    enum:
                    - invalid_credentials
                    - account_locked
                    - expired_token
                    - token_expired
                    - missing_token
                    - invalid_token
                    - session_expired
                    description: Reason for authentication failure
                    example: token_expired
                  ipAddress:
                    type: string
                  operation:
                    type: string
                  service:
                    type: string
                  userAgent:
                    type: string
                required:
                - errorType
              - type: object
                properties:
                  actualPermission:
                    type: string
                  errorType:
                    type: string
                    enum:
                    - authorization
                  requiredPermission:
                    type: string
                  resource:
                    type: string
                  resourceId:
                    type: string
                  userId:
                    type: string
                required:
                - errorType
              - type: object
                properties:
                  constraint:
                    type: string
                  errorType:
                    type: string
                    enum:
                    - database
                  operation:
                    type: string
                    enum:
                    - insert
                    - update
                    - delete
                    - select
                    - batch
                    - transaction
                    - migration
                    description: Type of database operation
                    example: select
                  resourceId:
                    type: string
                  sqlState:
                    type: string
                  table:
                    type: string
                  userId:
                    type: string
                required:
                - errorType
              - type: object
                properties:
                  endpoint:
                    type: string
                  errorType:
                    type: string
                    enum:
                    - external_service
                  httpStatus:
                    type: number
                  operation:
                    type: string
                  resourceId:
                    type: string
                  responseTime:
                    type: number
                  retryAttempt:
                    type: integer
                  service:
                    type: string
                  serviceName:
                    type: string
                  userId:
                    type: string
                required:
                - errorType
              - type: object
                properties:
                  errorType:
                    type: string
                    enum:
                    - resource
                  resource:
                    type: string
                  resourceId:
                    type: string
                  service:
                    type: string
                  userId:
                    type: string
                required:
                - errorType
              - type: object
                properties:
                  errorType:
                    type: string
                    enum:
                    - rate_limit
                  limit:
                    type: number
                  resetTime:
                    type: string
                  windowMs:
                    type: number
                required:
                - errorType
              - type: object
                properties:
                  configKey:
                    type: string
                  errorType:
                    type: string
                    enum:
                    - configuration
                  operation:
                    type: string
                  service:
                    type: string
                required:
                - errorType
              description: Type-safe error context information
              example:
                errorType: validation
                fieldErrors:
                - field: email
                  message: Invalid email format
            details:
              oneOf:
              - type: object
                properties:
                  detailType:
                    type: string
                    enum:
                    - validation
                  validationErrors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        field:
                          type: string
                        message:
                          type: string
                      required:
                      - field
                      - message
                required:
                - detailType
                - validationErrors
                additionalProperties: false
              - type: object
                properties:
                  detailType:
                    type: string
                    enum:
                    - service_error
                  originalError:
                    type: string
                  serviceName:
                    type: string
                required:
                - detailType
                - serviceName
                additionalProperties: false
              - type: object
                properties:
                  currentSize:
                    type: number
                  detailType:
                    type: string
                    enum:
                    - batch
                  originalError:
                    type: string
                  statementCount:
                    type: number
                required:
                - detailType
                additionalProperties: false
              - type: object
                properties:
                  detailType:
                    type: string
                    enum:
                    - rate_limit
                  limit:
                    type: number
                  resetTime:
                    type: string
                  windowMs:
                    type: number
                required:
                - detailType
                - limit
                - resetTime
                - windowMs
                additionalProperties: false
              - type: object
                properties:
                  conflictingField:
                    type: string
                  detailType:
                    type: string
                    enum:
                    - resource
                  resourceId:
                    anyOf:
                    - type: string
                    - type: number
                  resourceType:
                    type: string
                required:
                - detailType
                additionalProperties: false
              - type: object
                properties:
                  detailType:
                    type: string
                    enum:
                    - generic
                  info:
                    type: string
                required:
                - detailType
                additionalProperties: false
              - type: object
                properties:
                  currentTokens:
                    type: integer
                    minimum: 0
                  detailType:
                    type: string
                    enum:
                    - insufficient_tokens
                  requiredTokens:
                    type: integer
                    minimum: 0
                required:
                - currentTokens
                - detailType
                - requiredTokens
                additionalProperties: false
            message:
              type: string
            validation:
              type: array
              items:
                type: object
                properties:
                  code:
                    type: string
                  field:
                    type: string
                  message:
                    type: string
                required:
                - field
                - message
                additionalProperties: false
          required:
          - code
          - message
          additionalProperties: false
        meta:
          $ref: '#/components/schemas/ResponseMetadata'
        success:
          type: boolean
          enum:
          - false
      required:
      - error
      - success
      additionalProperties: false
    IndeedConnectionView:
      type:
      - object
      - 'null'
      properties:
        connectedAt:
          type:
          - integer
          - 'null'
        email:
          type: string
        lastError:
          type:
          - string
          - 'null'
          enum:
          - blocked_by_indeed
          - browser_unavailable
          - code_rejected
          - email_code_missing
          - mailbox_unreadable
          - no_account
          - phone_code_missing
          - phone_number_required
          - sign_in_refused
          - sign_in_stopped
          - session_not_saved
          - timed_out
          - unexpected_page
          - null
          description: Why the last Indeed sign-in attempt failed
          example: email_code_missing
        phoneHint:
          type:
          - string
          - 'null'
        site:
          type: string
          enum:
          - US
          - IN
          - GB
          - CA
          - AU
          - IE
          - DE
          - FR
          - NL
          - ES
          - IT
          - SG
          - AE
          - NZ
          - ZA
          - PH
          - MY
          - PK
          - BR
          - MX
          - JP
          description: The Indeed site the user has an account on, as an ISO 3166-1 alpha-2 country code
          example: DE
        stage:
          type:
          - string
          - 'null'
          enum:
          - opening_indeed
          - checking_account
          - waiting_for_email_code
          - entering_code
          - saving_session
          - null
          description: 'The step a running Indeed sign-in reached: opening Indeed, checking the address has an account, waiting for Indeed''s email code, typing it, saving the session'
          example: checking_account
        startedAt:
          type:
          - integer
          - 'null'
        status:
          type: string
          enum:
          - signing_in
          - waiting_for_phone_code
          - connected
          - needs_reconnect
          - failed
          description: 'Where the Indeed sign-in stands: a run is signing in, it waits for the SMS code the user types, the session is stored, the stored session stopped working, or the last attempt failed'
          example: connected
        updatedAt:
          type: integer
      required:
      - connectedAt
      - email
      - lastError
      - phoneHint
      - site
      - stage
      - startedAt
      - status
      - updatedAt
    IntegrationsAccess:
      type: object
      properties:
        allowed:
          type: boolean
        requiredTier:
          type: string
          enum:
          - job_seeker
          - hired_in_30
          - hired_yesterday
          description: Subscription plan tier level
          example: job_seeker
        state:
          type: string
          enum:
          - included
          - plan_required
          - beta_request
          - beta_pending
          - beta_denied
          description: 'Whether integrations are open: included, the plan is missing, or the beta request is not made, pending or denied'
          example: included
      required:
      - allowed
      - requiredTier
      - state
    MailConnectionsResponse:
      type: object
      properties:
        access:
          $ref: '#/components/schemas/IntegrationsAccess'
        applicantAddress:
          $ref: '#/components/schemas/ApplicantAddress'
        gmailForwarding:
          $ref: '#/components/schemas/GmailForwardingView'
        mailboxes:
          type: array
          items:
            $ref: '#/components/schemas/MailboxConnectionView'
        relayAddress:
          type:
