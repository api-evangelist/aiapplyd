        resolvedApplyUrl:
          type:
          - string
          - 'null'
          description: Resolved external ATS apply URL (e.g. the Greenhouse/Lever page a LinkedIn-scraped job actually applies on). Null when the job applies on its own page. The apply gate prefers this over `url` for platform detection.
          example: https://boards.greenhouse.io/acme/jobs/123
        linkedinApplyMethod:
          type: string
          enum:
          - easy_apply
          - offsite
          - unknown
          description: Resolved LinkedIn apply target. `offsite` → applies on a company ATS (use resolvedApplyUrl for the provider badge); `easy_apply` → in-platform LinkedIn Easy Apply ("LinkedIn Easy Apply" badge); `unknown` → not yet resolved / not a LinkedIn posting (fall back to `source` for the badge).
          example: offsite
        salary:
          type:
          - string
          - 'null'
        salaryMatch:
          type:
          - boolean
          - 'null'
          description: Job salary meets or exceeds user minimum. Null when either side lacks a salary value.
        saved:
          type: boolean
        seniorityMatch:
          type:
          - boolean
          - 'null'
          description: Job seniority band equals user preference. Null when either side lacks a band.
        skillsMatch:
          type:
          - boolean
          - 'null'
          description: At least one user canonical skill appears on the job. Null when either side lacks a skills list.
        skillsMatchCount:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Count of user canonical skills matched on this job. Null when either side lacks a skills list.
        source:
          type: string
        title:
          type: string
        url:
          type: string
        visaMatch:
          type:
          - boolean
          - 'null'
          description: User does not require sponsorship OR job offers sponsorship. Null when sponsorship status is unknown.
        visaSponsorship:
          type:
          - string
          - 'null'
        whyGoodFit:
          type:
          - string
          - 'null'
          description: 'Enrichment-v2: one-paragraph (<=280 chars) neutral third-person blurb describing why a generic candidate might want this role. Null when the description is too thin.'
          example: Remote-first Series B fintech with strong mentorship, modern TypeScript stack, and paid conference budget. Limited on-call and a small team where individual impact is high.
        workArrangement:
          type:
          - string
          - 'null'
          description: Canonical work-arrangement enum (remote_global / remote_country / remote_region / hybrid / onsite / unknown). Drives the "Remote" chip + filter. Null only when enrichment hasn't run yet.
          example: remote_global
        city:
          type:
          - string
          - 'null'
          description: Parsed city component of location.
        country:
          type:
          - string
          - 'null'
          description: Canonical country code.
        legitimacyTier:
          type:
          - string
          - 'null'
          enum:
          - high_confidence
          - proceed_with_caution
          - suspicious
          - null
          description: Deterministic posting-legitimacy verdict. Null when not yet evaluated.
          example: proceed_with_caution
        freshnessStatus:
          type:
          - string
          - 'null'
          enum:
          - fresh
          - aging
          - stale
          - unknown
          - null
          description: Posting age bucket (fresh / aging / stale / unknown).
          example: fresh
        repostedCount:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Number of prior live scraped_job rows for this URL family. 0 when no repost history.
          example: 0
        lastRepostDate:
          type:
          - string
          - 'null'
          description: posted_date of the most-recent prior repost. Null when no prior posting exists.
          example: '2026-03-04'
        legitimacySignals:
          type:
          - string
          - 'null'
          description: Serialized LegitimacySignals payload (score + signals[] + tier). Null when not yet evaluated.
        seniorityBand:
          type:
          - string
          - 'null'
          enum:
          - intern
          - entry
          - junior
          - mid
          - senior
          - staff
          - principal
          - lead
          - manager
          - director
          - vp
          - cxo
          - null
          description: Canonical seniority band parsed from the listing (intern / entry / junior / mid / senior / staff / principal / lead / manager / director / vp / cxo). Null when the band could not be inferred.
          example: senior
        salaryMinUsd:
          type:
          - integer
          - 'null'
          description: Lower bound of the listing salary range normalized to USD/year. Null when no parseable salary range exists.
          example: 120000
        salaryMaxUsd:
          type:
          - integer
          - 'null'
          description: Upper bound of the listing salary range normalized to USD/year. Null when no parseable salary range exists.
          example: 180000
        salaryCurrency:
          type:
          - string
          - 'null'
          description: ISO-4217 currency code of the original (pre-normalization) salary range (USD, EUR, GBP, ...). Null when no salary was reported.
          example: USD
        needsLivenessCheck:
          type: boolean
          description: True when the match is a stale-candidate on a browser-required aggregator (indeed/linkedin/glassdoor) and the frontend should call POST /job-matches/{id}/verify-live before allowing swipe-right. False means the listing is fresh enough to swipe directly.
          example: false
