          type:
          - integer
          - 'null'
          description: user_documents.id of the persisted markdown body, or null when no evaluation document exists.
          example: 1234
        generatedAt:
          type:
          - string
          - 'null'
          description: ISO timestamp of when the persisted match-report was last written. Null when no document exists.
          example: '2026-05-10T12:34:56Z'
        jobMatchId:
          type: integer
          description: job_matches.id the evaluation belongs to.
          example: 567
        matchScore:
          type:
          - number
          - 'null'
          description: Stored job_match.match_score (0-100). The match report leads on this figure, so it ships with the evaluation rather than being scraped out of the job-matches list query cache - which is empty on a direct page load and made a scored job render as "Not scored". Null only when the match genuinely carries no score.
          example: 74
        status:
          type: string
          enum:
          - idle
          - generating
          - completed
          - failed
          - out_of_tokens
          description: 'Persisted generation state, read from the PRIMARY so the client never sees a stale `generating` after the queue consumer has finished. Never `out_of_tokens` here - that is decided by POST /evaluate against the live balance and is not persisted. Rows written before migration 0223 have no stored status and are derived: a linked document means `completed`, otherwise `idle`.'
          example: completed
      required:
      - blocks
      - documentId
      - generatedAt
      - jobMatchId
      - matchScore
      - status
      additionalProperties: false
