openapi: 3.2.0
info:
  contact:
    email: support@aiapplyd.com
    name: AI Applyd
    url: https://aiapplyd.com
  description: 'The AI Applyd API runs the whole job hunt for you: it matches you to roles that fit your profile, rewrites your resume for each posting, writes the cover letter the form asks for, and auto-applies across the major applicant tracking systems.'
  license:
    name: Proprietary
    url: https://aiapplyd.com/legal/terms
  title: AI Applyd Job Matches API
  version: 115c47ce
servers:
- description: Current environment
  url: https://api.aiapplyd.com/api/v1
security:
- BearerAuth: []
tags:
- name: job-matches
paths:
  /job-matches/preferences:
    get:
      tags:
      - job-matches
      summary: Get Match Preferences
      description: Get the authenticated user's job match preferences.
      responses:
        '200':
          description: User preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferencesResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: getJobMatchesPreferences
    put:
      tags:
      - job-matches
      summary: Update Match Preferences
      description: Update job match preferences. Creates preferences if none exist.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePreferencesRequest'
      responses:
        '200':
          description: Preferences updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferencesResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: putJobMatchesPreferences
  /job-matches:
    get:
      tags:
      - job-matches
      summary: List Job Matches
      description: List today's AI-curated job matches. Excludes dismissed matches by default.
      parameters:
      - schema:
          type: integer
          maximum: 100
          default: 20
          description: Results per page (max 100)
          example: 20
          exclusiveMinimum: 0
        required: false
        description: Results per page (max 100)
        name: limit
        in: query
      - schema:
          type: integer
          default: 1
          description: Page number (1-based)
          example: 1
          exclusiveMinimum: 0
        required: false
        description: Page number (1-based)
        name: page
        in: query
      - schema:
          type: string
          description: Opaque keyset-pagination cursor returned by a prior list call as `pagination.nextCursor`. When present, the server runs in keyset mode and ignores `page`. Page-based callers should omit this field.
        required: false
        description: Opaque keyset-pagination cursor returned by a prior list call as `pagination.nextCursor`. When present, the server runs in keyset mode and ignores `page`. Page-based callers should omit this field.
        name: cursor
        in: query
      - schema:
          type:
          - boolean
          - 'null'
          description: Filter saved matches only
        required: false
        description: Filter saved matches only
        name: saved
        in: query
      responses:
        '200':
          description: Job matches list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: getJobMatches
  /job-matches/work-style-supply:
    get:
      tags:
      - job-matches
      summary: How much supply the user's work-style choice admits, and what it excludes
      description: 'Answers "400 hospitality jobs in the UK, 1 is remote, including onsite shows you 400" for the caller''s SAVED preferences. MEASURED 2026-09-09: 59% of onboarded users chose remote-only, and for a structurally onsite role family that is near-zero supply - UK hospitality holds 400 live jobs and ONE is remote, so those users saw four jobs and concluded we were broken. This endpoint NEVER widens a search and never touches saved preferences; it only counts, so the user decides with the real number in front of them. The admit-set is `acceptedArrangements`, the same single definition the pool filter and the read filter use, so the number cannot promise jobs the feed will not deliver. One grouped warehouse read served by `idx_scraped_job_is_active_country_role_city`.'
      responses:
        '200':
          description: Supply counts for the caller's saved work styles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkStyleSupplyResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: getJobMatchesWorkStyleSupply
  /job-matches/{id}:
    get:
      tags:
      - job-matches
      summary: Get a Job Match
      description: Get one job_match row owned by the authenticated user, using the same response projection as the match list.
      parameters:
      - schema:
          type: string
          pattern: ^\d+$
          description: Job match identifier
          example: '1'
        required: true
        description: Job match identifier
        in: path
        name: id
      responses:
        '200':
          description: Job match detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: getJobMatchesById
  /job-matches/{id}/save:
    post:
      tags:
      - job-matches
      summary: Save a Job Match
      description: Mark a job match as saved and create a job listing entry. Optionally set listing status to "applied" for quick-apply.
      parameters:
      - schema:
          type: string
          pattern: ^\d+$
          description: Job match identifier
          example: '1'
        required: true
        description: Job match identifier
        in: path
        name: id
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveMatchBody'
      responses:
        '200':
          description: Match saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchActionResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postJobMatchesByIdSave
  /job-matches/{id}/dismiss:
    post:
      tags:
      - job-matches
      summary: Dismiss a Job Match
      description: Dismiss a job match so it no longer appears in the list. Optionally records a structured dismiss reason for the engagement-feedback loop.
      parameters:
      - schema:
          type: string
          pattern: ^\d+$
          description: Job match identifier
          example: '1'
        required: true
        description: Job match identifier
        in: path
        name: id
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DismissMatchBody'
      responses:
        '200':
          description: Match dismissed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchActionResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postJobMatchesByIdDismiss
  /job-matches/subscribe-cell:
    post:
      tags:
      - job-matches
      summary: Subscribe to a (role_family, country) SEO cell
      description: Authenticated "notify me when this SEO cell fills" submission. Writes one row to `user_suggested_role` (deduped by normalized key, source='user') AND one row to `role_search_miss` (append-only telemetry) in a single `db.batch`. The orchestrator picks up the suggestion on its next 2h tick; the role-fulfilled notifier emails the user when the first matching job lands.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscribeCellBody'
      responses:
        '200':
          description: Subscription recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscribeCellResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postJobMatchesSubscribeCell
  /job-matches/validate-role:
    post:
      tags:
      - job-matches
      summary: Validate a free-text role title and show its taxonomy mapping
      description: 'Called by the role picker when a user picks "Add ". Answers whether the text names a real job in ANY language, which `role_family` it is searchable under, an English gloss when it was not typed in English, and - only when the input is a MISSPELLING of a real title - a suggested correction the user may accept. Never rewrites the title: `canonicalTitle` is the user''s own words (preset casing restored only on an exact preset match). Cheap and mostly free: a known preset and structurally-impossible input are answered without a model call, and every model verdict is cached in KV for 30 days keyed on the normalized title.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateRoleBody'
      responses:
        '200':
          description: Validation verdict + taxonomy mapping
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateRoleResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postJobMatchesValidateRole
  /job-matches/request-more:
    post:
      tags:
      - job-matches
      summary: Request More Matches (discover-empty re-fill)
      description: Called by the Discover empty-state CTA when the user burns through their whole match stack. Enqueues a targeted Indeed + LinkedIn scrape against the user's preferences and fans out a full (role × country) kickoff across every registered scraper. Respects the shared `low-pool-scrape:{userId}` 2h KV cooldown - repeat calls inside the window return `enqueued=false` with `reason='cooldown'`. No body; auth via session cookie.
      responses:
        '200':
          description: Scrape enqueued, already queued within cooldown, or user has no preferences yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestMoreMatchesResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postJobMatchesRequestMore
  /job-matches/apply-relaxation:
    post:
      tags:
      - job-matches
      summary: Apply Cascade Relaxation to Saved Preferences
      description: 'Called by the "Keep these matches coming" button on the relaxation banner. Reads the current `match:relaxation:{userId}` KV signal and persists the matching widening to the user''s `job_match_preference` row so the cascade sticks across sessions. Deletes the KV banner signal on success so the banner does not re-render on the next list GET. Idempotent: repeat calls when the banner is gone return `applied=false, reason=''no-relaxation''`.'
      responses:
        '200':
          description: Relaxation applied (or no-op when banner signal absent).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyRelaxationResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postJobMatchesApplyRelaxation
  /job-matches/revert-widening:
    post:
      tags:
      - job-matches
      summary: Undo Cascade Widening (Tighten Feed to Strict)
      description: Called by the "Undo" button on the relaxation banner. Deletes non-interacted job_match rows whose role_family falls outside the user's strict `preferredRoleFamilies` or whose country falls outside their `canonicalCountries`. Rows the user saved / dismissed / viewed are preserved - their explicit choices stand. Clears the KV banner signal. Does NOT modify the user's saved preferences.
      responses:
        '200':
          description: Feed tightened to strict (may be a no-op when nothing matched the criteria).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevertWideningResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postJobMatchesRevertWidening
  /job-matches/reset:
    post:
      tags:
      - job-matches
      summary: Reset All Matches to Discover Feed
      description: Reset all job matches back to discoverable state. Clears saved/dismissed/seen flags, deletes associated job listings and application results. Intended for dev/testing.
      responses:
        '200':
          description: All matches reset to discover feed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetMatchesResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postJobMatchesReset
  /job-matches/{id}/evaluate:
    post:
      tags:
      - job-matches
      summary: Enqueue the A-G Match Evaluation Report
      description: 'ENQUEUES the 7-block A-G structured evaluator (role summary, CV match, level strategy, comp & demand, personalization plan, interview plan, posting legitimacy) and returns IMMEDIATELY - it never blocks on generation. The client polls `GET /job-matches/{id}/evaluation` until `status` leaves `generating`. The worker persists the assembled markdown to R2 + a `user_document` row with `documentType=match_report` and stamps the doc id on `job_match.match_report_doc_id`. Idempotent by construction: the row is claimed with a compare-and-swap on `job_match.match_report_status` against the PRIMARY before the enqueue, so at-least-once queue delivery cannot bill the user twice for one report. Supply `force=true` to reclaim a `failed`/`completed` row and regenerate. When the user has no token balance NOTHING is claimed or enqueued and the response carries `status: out_of_tokens`.'
      parameters:
      - schema:
          type: string
          pattern: ^\d+$
          description: Job match identifier
          example: '1'
        required: true
        description: Job match identifier
        in: path
        name: id
      - schema:
          anyOf:
          - type: boolean
          - type: string
            enum:
            - '0'
            - '1'
            - 'true'
            - 'false'
          default: false
          description: Bypass the cached document and regenerate from scratch.
          example: false
        required: false
        description: Bypass the cached document and regenerate from scratch.
        name: force
        in: query
      responses:
        '200':
          description: Match evaluation generated (or cached)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluateMatchResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postJobMatchesByIdEvaluate
  /job-matches/{id}/evaluation:
    get:
      tags:
      - job-matches
      summary: Get Persisted A-G Match Evaluation
      description: Return the structured 7-block A-G evaluation payload persisted on `job_match.evaluation_blocks` plus the linked `user_document.id` for the assembled markdown. Used by the web Evaluation tab on first mount to render per-section cards without re-running the orchestrator. Returns `blocks=null` when no evaluation has been generated yet OR the stored blob fails schema validation; the FE then renders a "Generate evaluation" empty state.
      parameters:
      - schema:
          type: string
          pattern: ^\d+$
          description: Job match identifier
          example: '1'
        required: true
        description: Job match identifier
        in: path
        name: id
      responses:
        '200':
          description: Persisted evaluation blocks (may be null if not yet generated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEvaluationResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: getJobMatchesByIdEvaluation
  /job-matches/{id}/verify-live:
    post:
      tags:
      - job-matches
      summary: Verify a Job Match Is Still Live
      description: 'Confirm a browser-required aggregator listing (indeed / linkedin / glassdoor) is still live before the user swipes right on it. Short-circuits to live without spending the Browser Rendering budget when the underlying scraped_job is fresh (created or last-checked recently). Otherwise renders the listing through the free-tier Cloudflare Browser Rendering binding and runs the dead-page detectors. A confirmed-dead listing triggers the global removeTerminalJob cascade and returns `removed=true`. Fails open: if the BR cap is exhausted or the binding is absent the endpoint returns `live=true, reason="unverified_cap"` so the user is never blocked.'
      parameters:
      - schema:
          type: string
          pattern: ^\d+$
          description: Job match identifier
          example: '1'
        required: true
        description: Job match identifier
        in: path
        name: id
      responses:
        '200':
          description: Liveness verdict (live / removed / reason)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyLiveResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postJobMatchesByIdVerifyLive
components:
  schemas:
    PreferencesResponseData:
      allOf:
      - $ref: '#/components/schemas/JobMatchPreferencesData'
      - type: object
        properties:
          prefsChanged:
            type: boolean
            description: PUT only. True when this save changed at least one job_match_preference column (always true when it created the row). False means nothing moved. Absent on GET.
            example: true
    RequestMoreMatchesData:
      type: object
      properties:
        enqueued:
          type: boolean
          description: True when a targeted scrape was enqueued. False when the per-user 2h cooldown is active, the user has no preferences yet, or SCRAPE_QUEUE is not configured.
          example: true
        reason:
          type: string
          enum:
          - enqueued
          - cooldown
          - no-preferences
          - no-queue
          description: Why the request-more-matches call was or was not enqueued. Drives the frontend empty-state copy.
          example: enqueued
      required:
      - enqueued
      - reason
      additionalProperties: false
    RevertWideningData:
      type: object
      properties:
        deleted:
          type: integer
          minimum: 0
          description: Number of widened non-interacted job_match rows removed from the user's feed.
          example: 312
        reason:
          type: string
          enum:
          - reverted
          - nothing-to-revert
          - no-strict-prefs
          description: Outcome of the revert-widening call. `reverted` means at least one row was removed; `nothing-to-revert` means the feed was already strict-only; `no-strict-prefs` means the user has no strict role/country on their preferences so there is nothing to tighten against.
          example: reverted
      required:
      - deleted
      - reason
      additionalProperties: false
    MatchData:
      type: object
      properties:
        appliedAt:
          type:
          - string
          - 'null'
          description: Timestamp when the application was confirmed submitted. Null until submission completes.
          example: '2026-04-20T10:15:00Z'
        applicationStatus:
          type:
          - string
          - 'null'
          enum:
          - pending
          - pending_review
          - ready_to_submit
          - applied
          - applied_unconfirmed
          - skipped
          - error
          - cancelled
          - null
          description: Status of the latest applicationResult row for this match (pending / pending_review / ready_to_submit / applied / skipped / error). Null when no application has been started.
          example: ready_to_submit
        authPlatform:
          type:
          - string
          - 'null'
          description: Platform credential key required for auto-apply (e.g. "linkedin", "indeed"), or null if no auth needed
          example: linkedin
        requiresAuth:
          type: boolean
          description: True when this match's platform requires authenticated apply AND the user has not connected the corresponding integration. Frontend renders a locked card with a "Connect {authPlatform}" CTA when true.
          example: false
        platformType:
          type: string
          description: Resolved URL platform classifier (e.g. "linkedin", "greenhouse", "lever"). Always present.
          example: greenhouse
        benefits:
