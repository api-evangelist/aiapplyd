    WorkStyleSupplyData:
      type: object
      properties:
        total:
          type: integer
          minimum: 0
          description: Live jobs in this user's role families and countries, ANY work style.
          example: 400
        matching:
          type: integer
          minimum: 0
          description: Of those, the jobs their CURRENT work styles admit. Computed from `acceptedArrangements`, the same admit-set the feed uses, so this number cannot promise jobs the feed will not deliver.
          example: 4
        unlocked:
          type: array
          items:
            type: object
            properties:
              workStyle:
                type: string
                enum:
                - onsite
