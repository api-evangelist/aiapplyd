      properties:
        jobMatchId:
          type: integer
          description: job_matches.id the report belongs to.
          example: 567
        retryAfterMs:
          type: integer
          description: How long the client should wait before its first poll of GET /job-matches/{id}/evaluation. Zero for terminal statuses, where there is nothing to poll for.
          example: 3000
        status:
          type: string
          enum:
          - idle
          - generating
          - completed
          - failed
          - out_of_tokens
          description: generating = claimed and enqueued (or already in flight in another tab). completed = a valid report already exists, nothing was enqueued. failed = the previous attempt failed and `force` was not set; the client should offer Retry. out_of_tokens = the user has no balance, so NOTHING was claimed or enqueued; the client shows the top-up message plus Retry.
          example: generating
