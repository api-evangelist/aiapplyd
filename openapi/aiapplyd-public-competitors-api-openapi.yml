      required:
      - data
      - success
      additionalProperties: false
      description: Successful API response
    AlternativesEnrichment:
      type: object
      properties:
        alternatives:
          type: array
          items:
            $ref: '#/components/schemas/AlternativeRow'
        sourceCompetitor:
          type:
          - object
          - 'null'
          properties:
            domain:
              type: string
            logoUrl:
              type:
              - string
              - 'null'
            name:
              type: string
            slug:
              type: string
            tagline:
              type: string
          required:
          - domain
          - logoUrl
          - name
          - slug
          - tagline
        totalCount:
          type: integer
          minimum: 0
      required:
      - alternatives
      - sourceCompetitor
      - totalCount
      additionalProperties: false
    CompetitorPillar:
      type: object
      properties:
        body:
          type: string
          minLength: 1
        icon:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
      required:
      - body
      - icon
      - title
      additionalProperties: false
      description: Single pillar card shown on a competitor comparison page.
      example:
        body: One AI model picks the right jobs, writes the cover letter, and submits the application without 40 tabs.
        icon: zap
        title: One workflow, not forty tabs
    CompetitorListPayload:
      type: object
      properties:
        competitors:
          type: array
          items:
            $ref: '#/components/schemas/CompetitorListItem'
      required:
      - competitors
      additionalProperties: false
    ResponseMetadata:
      type: object
      properties:
        duration:
          type: number
          description: Request duration in milliseconds
          example: 150
          exclusiveMinimum: 0
        performance:
          type: object
          properties:
            dbQueries:
              type: integer
              minimum: 0
            totalDbTime:
              type: number
              minimum: 0
          description: Performance metrics (preview/local only)
        requestId:
          type: string
          description: Unique request identifier
          example: req_abc123
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp
          example: '2026-09-25T17:29:47.224Z'
        version:
          type: string
          description: API version
          example: v1
  securitySchemes:
    BearerAuth:
      description: 'Session token from signing in to AI Applyd, sent as `Authorization: Bearer <token>`.'
      scheme: bearer
      type: http
