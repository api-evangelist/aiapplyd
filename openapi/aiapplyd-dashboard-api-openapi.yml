                - detailType
                - requiredTokens
                additionalProperties: false
            message:
              type: string
            validation:
              type: array
              items:
                type: object
                properties:
                  code:
                    type: string
                  field:
                    type: string
                  message:
                    type: string
                required:
                - field
                - message
                additionalProperties: false
          required:
          - code
          - message
          additionalProperties: false
        meta:
          $ref: '#/components/schemas/ResponseMetadata'
        success:
          type: boolean
          enum:
          - false
      required:
      - error
      - success
      additionalProperties: false
    AIPersonaData:
      type: object
      properties:
        id:
          type: string
          description: AI persona identifier
          example: abc-123
        userId:
          type: string
          description: User identifier
          example: user_abc123
        presetId:
          type: string
          enum:
          - balanced
          - the_professional
          - the_conversationalist
          - the_storyteller
          - the_closer
          - the_enthusiast
          - custom
          description: Selected persona preset
          example: balanced
        personalDescription:
          type:
          - string
          - 'null'
          description: Free text about the user for AI personalization
          example: Senior engineer with 10 years in fintech
        toneInstructions:
          type:
          - string
          - 'null'
          description: Custom rules for AI tone and style
          example: Always mention my passion for open-source
        samplePhrases:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Example phrases the user would naturally use
          example:
          - Let me walk you through my approach
          - I thrive in fast-paced environments
        generateCoverLetterPerJob:
          type: boolean
          description: Whether AI generates a cover letter for each job application
          example: true
        tailorResumePerJob:
          type: boolean
          description: Whether AI tailors resume for each job application
          example: true
        resumeStrategy:
          type: string
          enum:
          - base
          - tailor
          description: Resume handling strategy
          example: tailor
        coverLetterStrategy:
          type: string
          enum:
          - 'off'
          - use_base
          - tailor_base
          - generate_new
          description: Cover letter handling strategy
          example: generate_new
        translationStrategy:
          type: string
          enum:
          - 'off'
          - translate
          - translate_and_tailor
          description: Translation strategy
          example: 'off'
        mode:
          type: string
          enum:
          - copilot
          - auto_approve
          description: 'Application mode: copilot (review before submitting) or auto_approve (submits automatically)'
          example: copilot
        allowFabrication:
          type: boolean
          description: Fill-gaps for the apply agent, enabled by default. When true, a required field the agent cannot take directly from profile facts is sourced real-data-first (the resume, tailored resume, and cover letter for this application, then job preferences, then profile) and only fabricated as a last resort, marked as assumed. When false (explicit opt-out), it never fabricates such an answer. Contact/identity completion (phone, city, postal, profile links) always completes required fields and is not governed by this flag.
          example: true
        scoringWeights:
          type:
          - object
          - 'null'
          properties:
            location:
              type: number
              minimum: 0
              maximum: 2
            remote:
              type: number
              minimum: 0
              maximum: 2
            salary:
              type: number
              minimum: 0
              maximum: 2
            seniority:
              type: number
              minimum: 0
              maximum: 2
            skills:
              type: number
              minimum: 0
              maximum: 2
            visa:
              type: number
              minimum: 0
              maximum: 2
          required:
          - location
          - remote
          - salary
          - seniority
          - skills
          - visa
          description: Per-dimension match scoring weights. NULL when the user has never customised them (scorer falls back to uniform defaults).
          example:
            skills: 1
            location: 1
            remote: 1
            seniority: 1
            salary: 1
            visa: 1
        createdAt:
          type: string
          description: Persona creation timestamp
          example: '2026-01-15T12:00:00Z'
        updatedAt:
          type: string
          description: Persona last update timestamp
          example: '2026-03-10T08:30:00Z'
      required:
      - id
      - userId
      - presetId
      - personalDescription
      - toneInstructions
      - samplePhrases
      - generateCoverLetterPerJob
      - tailorResumePerJob
      - resumeStrategy
      - coverLetterStrategy
      - translationStrategy
      - mode
      - allowFabrication
      - scoringWeights
      - createdAt
      - updatedAt
    UserDocumentListData:
      type:
      - object
      - 'null'
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserDocument'
        pagination:
          type: object
          properties:
            hasNext:
              type: boolean
            hasPrev:
              type: boolean
            limit:
              type: integer
              exclusiveMinimum: 0
            page:
              type: integer
              exclusiveMinimum: 0
            totalCount:
              type: integer
              minimum: 0
            totalPages:
              type: integer
              minimum: 0
          required:
          - hasNext
          - hasPrev
          - limit
          - page
          - totalCount
          - totalPages
          additionalProperties: false
      required:
      - items
      - pagination
    DailyApplication:
      type: object
      properties:
        count:
          type: integer
        date:
          type: string
          description: Date in YYYY-MM-DD format
          example: '2026-03-24'
      required:
      - count
      - date
      additionalProperties: false
  securitySchemes:
    BearerAuth:
      description: 'Session token from signing in to AI Applyd, sent as `Authorization: Bearer <token>`.'
      scheme: bearer
      type: http
