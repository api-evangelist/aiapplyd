      - latestAtsScore
      - preparationStatus
      - autoRetryStopped
      - autoRetryStoppedReason
      - employerReceiptConfirmed
      - submitEvidenceTier
      - nextAutoRetryAt
      - statusDisplay
      - errorCode
      - applicationResultStatus
