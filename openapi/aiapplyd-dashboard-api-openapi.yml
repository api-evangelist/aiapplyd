openapi: 3.2.0
info:
  contact:
    email: support@aiapplyd.com
    name: AI Applyd
    url: https://aiapplyd.com
  description: 'The AI Applyd API runs the whole job hunt for you: it matches you to roles that fit your profile, rewrites your resume for each posting, writes the cover letter the form asks for, and auto-applies across the major applicant tracking systems.'
  license:
    name: Proprietary
    url: https://aiapplyd.com/legal/terms
  title: AI Applyd Dashboard API
  version: 115c47ce
servers:
- description: Current environment
  url: https://api.aiapplyd.com/api/v1
security:
- BearerAuth: []
tags:
- name: Dashboard
paths:
  /dashboard/bootstrap:
    get:
      tags:
      - Dashboard
      summary: Dashboard bootstrap aggregate
      description: Single aggregate that collapses the per-slice dashboard reads (health, overview, analytics, jobs, documents, preferences, matches, agent config, pending review) into one envelope. Each slice degrades to a safe fallback on failure so one failing slice never 500s the whole response.
      responses:
        '200':
          description: Dashboard bootstrap aggregate envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardBootstrapResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: getDashboardBootstrap
components:
  schemas:
    MatchData:
      type: object
      properties:
        appliedAt:
          type:
          - string
          - 'null'
          description: Timestamp when the application was confirmed submitted. Null until submission completes.
          example: '2026-04-20T10:15:00Z'
        applicationStatus:
          type:
          - string
          - 'null'
          enum:
          - pending
          - pending_review
          - ready_to_submit
          - applied
          - applied_unconfirmed
          - skipped
          - error
          - cancelled
          - null
          description: Status of the latest applicationResult row for this match (pending / pending_review / ready_to_submit / applied / skipped / error). Null when no application has been started.
          example: ready_to_submit
        authPlatform:
          type:
          - string
          - 'null'
          description: Platform credential key required for auto-apply (e.g. "linkedin", "indeed"), or null if no auth needed
          example: linkedin
        requiresAuth:
          type: boolean
          description: True when this match's platform requires authenticated apply AND the user has not connected the corresponding integration. Frontend renders a locked card with a "Connect {authPlatform}" CTA when true.
          example: false
        platformType:
          type: string
          description: Resolved URL platform classifier (e.g. "linkedin", "greenhouse", "lever"). Always present.
          example: greenhouse
        benefits:
          type:
          - array
          - 'null'
          items:
            type: string
        company:
          type:
          - string
          - 'null'
        companyLogoUrl:
          type:
          - string
          - 'null'
        companyDomain:
          type:
          - string
          - 'null'
          description: Trusted company-intel domain (company.domain) for the company-jobs page logo fallback. Null when the match has no linked company record or the company has no domain.
          example: acme.com
        companySize:
          type:
          - string
          - 'null'
        createdAt:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        dismissed:
          type: boolean
        educationRequired:
          type:
          - string
          - 'null'
        extractedSkills:
          type:
          - array
          - 'null'
          items:
            type: string
        id:
          type: integer
        publicJobId:
          type:
          - integer
          - 'null'
        jobType:
          type:
          - string
          - 'null'
        listingStatus:
          type:
          - string
          - 'null'
          enum:
          - saved
          - preparing
          - applied
          - interviewing
          - offered
          - rejected
          - archived
          - null
          description: Status from the user's jobListings row for this match (saved / preparing / applied / rejected / interviewing / offered / archived). Null when the match has never been saved.
          example: preparing
        location:
          type:
          - string
          - 'null'
        locationMatch:
          type:
          - boolean
          - 'null'
          description: Job country is in user preferences OR job is remote. Null when both sides lack data.
        geoTier:
          type: string
          enum:
          - exact_city
          - within_radius
          - in_country
          - remote
          - off_country
          - unknown
          description: Rung this job occupies on the user's location-priority ladder (exact_city > within_radius > in_country > remote > off_country > unknown). `unknown` means the job could not be placed and must NEVER be rendered as a location match.
          example: within_radius
        distanceKm:
          type:
          - number
          - 'null'
          description: Whole-km great-circle distance to the user's NEAREST preferred city. Null means NOT COMPUTABLE (missing coordinates on either side) and must be read as unknown, never as "far" and never as 0.
          example: 24
        matchScore:
          type:
          - number
          - 'null'
        postedAt:
          type:
          - string
          - 'null'
        preparationStatus:
          type:
          - string
          - 'null'
          enum:
          - pending
          - preparing
          - ready
          - submitting
          - submitted
          - failed
          - cancelled
          - null
          description: Preparation progress for the latest application (pending / preparing / ready / submitting / submitted / failed). Null when no application has been started.
          example: preparing
        remoteMatch:
          type:
          - boolean
          - 'null'
          description: Job supports any remote arrangement. Null when work arrangement is missing.
        resolvedApplyUrl:
          type:
          - string
          - 'null'
          description: Resolved external ATS apply URL (e.g. the Greenhouse/Lever page a LinkedIn-scraped job actually applies on). Null when the job applies on its own page. The apply gate prefers this over `url` for platform detection.
          example: https://boards.greenhouse.io/acme/jobs/123
        linkedinApplyMethod:
          type: string
          enum:
          - easy_apply
          - offsite
          - unknown
          description: Resolved LinkedIn apply target. `offsite` → applies on a company ATS (use resolvedApplyUrl for the provider badge); `easy_apply` → in-platform LinkedIn Easy Apply ("LinkedIn Easy Apply" badge); `unknown` → not yet resolved / not a LinkedIn posting (fall back to `source` for the badge).
          example: offsite
        salary:
          type:
          - string
          - 'null'
        salaryMatch:
          type:
          - boolean
          - 'null'
          description: Job salary meets or exceeds user minimum. Null when either side lacks a salary value.
        saved:
          type: boolean
        seniorityMatch:
          type:
          - boolean
          - 'null'
          description: Job seniority band equals user preference. Null when either side lacks a band.
        skillsMatch:
          type:
          - boolean
          - 'null'
          description: At least one user canonical skill appears on the job. Null when either side lacks a skills list.
        skillsMatchCount:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Count of user canonical skills matched on this job. Null when either side lacks a skills list.
        source:
          type: string
        title:
          type: string
        url:
          type: string
        visaMatch:
          type:
          - boolean
          - 'null'
          description: User does not require sponsorship OR job offers sponsorship. Null when sponsorship status is unknown.
        visaSponsorship:
          type:
          - string
          - 'null'
        whyGoodFit:
          type:
          - string
          - 'null'
          description: 'Enrichment-v2: one-paragraph (<=280 chars) neutral third-person blurb describing why a generic candidate might want this role. Null when the description is too thin.'
          example: Remote-first Series B fintech with strong mentorship, modern TypeScript stack, and paid conference budget. Limited on-call and a small team where individual impact is high.
        workArrangement:
          type:
          - string
          - 'null'
          description: Canonical work-arrangement enum (remote_global / remote_country / remote_region / hybrid / onsite / unknown). Drives the "Remote" chip + filter. Null only when enrichment hasn't run yet.
          example: remote_global
        city:
          type:
          - string
          - 'null'
          description: Parsed city component of location.
        country:
          type:
          - string
          - 'null'
          description: Canonical country code.
        legitimacyTier:
          type:
          - string
          - 'null'
          enum:
          - high_confidence
          - proceed_with_caution
          - suspicious
          - null
          description: Deterministic posting-legitimacy verdict. Null when not yet evaluated.
          example: proceed_with_caution
        freshnessStatus:
          type:
          - string
          - 'null'
          enum:
          - fresh
          - aging
          - stale
          - unknown
          - null
          description: Posting age bucket (fresh / aging / stale / unknown).
          example: fresh
        repostedCount:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Number of prior live scraped_job rows for this URL family. 0 when no repost history.
          example: 0
        lastRepostDate:
          type:
          - string
          - 'null'
          description: posted_date of the most-recent prior repost. Null when no prior posting exists.
          example: '2026-03-04'
        legitimacySignals:
          type:
          - string
          - 'null'
          description: Serialized LegitimacySignals payload (score + signals[] + tier). Null when not yet evaluated.
        seniorityBand:
          type:
          - string
          - 'null'
          enum:
          - intern
          - entry
          - junior
          - mid
          - senior
          - staff
          - principal
          - lead
          - manager
          - director
          - vp
          - cxo
          - null
          description: Canonical seniority band parsed from the listing (intern / entry / junior / mid / senior / staff / principal / lead / manager / director / vp / cxo). Null when the band could not be inferred.
          example: senior
        salaryMinUsd:
          type:
          - integer
          - 'null'
          description: Lower bound of the listing salary range normalized to USD/year. Null when no parseable salary range exists.
          example: 120000
        salaryMaxUsd:
          type:
          - integer
          - 'null'
          description: Upper bound of the listing salary range normalized to USD/year. Null when no parseable salary range exists.
          example: 180000
        salaryCurrency:
          type:
          - string
          - 'null'
          description: ISO-4217 currency code of the original (pre-normalization) salary range (USD, EUR, GBP, ...). Null when no salary was reported.
          example: USD
        needsLivenessCheck:
          type: boolean
          description: True when the match is a stale-candidate on a browser-required aggregator (indeed/linkedin/glassdoor) and the frontend should call POST /job-matches/{id}/verify-live before allowing swipe-right. False means the listing is fresh enough to swipe directly.
          example: false
      required:
      - appliedAt
      - applicationStatus
      - authPlatform
      - requiresAuth
      - platformType
      - benefits
      - company
      - companyLogoUrl
      - companySize
      - createdAt
      - description
      - dismissed
      - educationRequired
      - extractedSkills
      - id
      - publicJobId
      - jobType
      - listingStatus
      - location
      - locationMatch
      - geoTier
      - distanceKm
      - matchScore
      - postedAt
      - preparationStatus
      - remoteMatch
      - resolvedApplyUrl
      - linkedinApplyMethod
      - salary
      - salaryMatch
      - saved
      - seniorityMatch
      - skillsMatch
      - skillsMatchCount
      - source
      - title
      - url
      - visaMatch
      - visaSponsorship
      - whyGoodFit
      - workArrangement
      - city
      - country
      - legitimacyTier
      - freshnessStatus
      - repostedCount
      - lastRepostDate
      - legitimacySignals
      - seniorityBand
      - salaryMinUsd
      - salaryMaxUsd
      - salaryCurrency
      - needsLivenessCheck
      additionalProperties: false
    ResponseMetadata:
      type: object
      properties:
        duration:
          type: number
          description: Request duration in milliseconds
          example: 150
          exclusiveMinimum: 0
        performance:
          type: object
          properties:
            dbQueries:
              type: integer
              minimum: 0
            totalDbTime:
              type: number
              minimum: 0
          description: Performance metrics (preview/local only)
        requestId:
          type: string
          description: Unique request identifier
          example: req_abc123
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp
          example: '2026-09-25T17:29:47.224Z'
        version:
          type: string
          description: API version
          example: v1
    ApplicationConfigData:
      type: object
      properties:
        status:
          type: string
          enum:
          - active
          - paused
          - completed
          description: Status of an AI agent config
          example: paused
        totalApplications:
          type: integer
          description: Postings the user has applications against, one unit each. Every other counter except totalEmployerReceipts is a slice of it and they sum to it exactly. Absent means not computed, which is NOT the same as zero.
          example: 49
        totalApplied:
          type: integer
          description: 'Applications with retained employer proof: a linked employer receipt or a retained post-submit screenshot audited as employer confirmation. A legacy applied status or landing confidence grade alone does not count.'
          example: 3
        totalErrors:
          type: integer
        totalSkipped:
          type: integer
        totalSubmitConfirmed:
          type: integer
        totalSubmitClicked:
          type: integer
        totalDeadPostings:
          type: integer
          description: Applications whose posting no longer exists (job_closed / job_removed). Excluded from every other counter and from every rate, in both numerator and denominator. Absent means not computed, which is NOT the same as zero.
          example: 2
        totalEmployerReceipts:
          type: integer
          description: Distinct linked employer or ATS confirmation emails. OVERLAPS totalApplied and must not be summed with the partitioning counters. Absent means not computed, which is NOT the same as zero.
          example: 0
        totalPendingReview:
          type: integer
          description: Postings whose newest row the USER parked for review (pending_review with a copilot apply mode). Never a row our own worker parked. Absent means not computed, which is NOT the same as zero.
          example: 1
        totalQueuedToApply:
          type: integer
          description: 'Postings we will submit or retry without the user: newest row pending / ready_to_submit, or a pending_review row our worker parked and the backstop retries. Absent means not computed, which is NOT the same as zero.'
          example: 2
      required:
      - status
      - totalApplied
      - totalErrors
      - totalSkipped
      - totalSubmitConfirmed
      - totalSubmitClicked
      additionalProperties: false
    MatchListData:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MatchData'
        pagination:
          type: object
          properties:
            hasNext:
              type: boolean
            hasPrev:
              type: boolean
            limit:
              type: integer
              exclusiveMinimum: 0
            page:
              type: integer
              exclusiveMinimum: 0
            totalCount:
              type: integer
              minimum: -1
              description: 'Total matches across all pages. Page-mode: a real count (>=0). Cursor-mode: the sentinel -1 (COUNT(*) skipped for keyset-paging speed); cursor callers read `hasNextPage`/`nextCursor` instead.'
              example: -1
            totalPages:
              type: integer
              minimum: 0
            hasNextPage:
              type: boolean
              description: True when another page is available. Mirrors `hasNext` for cursor-mode callers; page-mode callers can keep using `hasNext`.
            nextCursor:
              type:
              - string
              - 'null'
              description: Opaque cursor for the next keyset page, or null when no further rows. Pass back as `?cursor=` on the next request. Page-mode callers can ignore this.
          required:
          - hasNext
          - hasPrev
          - limit
          - page
          - totalCount
          - totalPages
          - hasNextPage
          - nextCursor
          additionalProperties: false
        searchCompleted:
          type: boolean
          default: false
          description: True once a scrape for the user's current criteria has completed at least once. Drives whether the empty state may say "nothing found" vs "still searching".
          example: false
        relaxation:
          type:
          - string
          - 'null'
          enum:
          - seniority_plus_two
          - role_family_neighbors
          - include_remote_auto
          - all_relaxations
          - null
          default: null
          description: Summary bucket describing how far the matcher widened the user's filters (null = strict match). Drives the Discover relaxation banner.
          example: null
        relaxationDetail:
          type:
          - object
          - 'null'
          properties:
            deltas:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                    enum:
                    - seniority
                    - workStyle
                    - city
                    - roleFamily
                  from:
                    anyOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                  to:
                    anyOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                required:
                - field
                - from
                - to
                additionalProperties: false
            finalCount:
              type: integer
              minimum: 0
            level:
              type: string
              enum:
              - seniority_plus_two
              - role_family_neighbors
              - include_remote_auto
              - all_relaxations
              description: Summary bucket describing how far the matcher widened the user's filters to fill the Discover feed. Null means strict match (no widening).
              example: seniority_plus_two
            strictCount:
              type: integer
              minimum: 0
          default: null
          required:
          - deltas
          - finalCount
          - level
          - strictCount
          additionalProperties: false
          description: Rich per-delta relaxation payload  -  lists each filter the matcher widened and the specific "from → to" values. Null when no relaxation applied OR when the cascade did not write a detail payload (legacy path). Consumers should prefer this over `relaxation` for banner copy.
          example: null
        relaxations:
          type: array
          items:
            type: string
            enum:
            - none
            - seniority_plus_two
            - role_family_neighbors
            - include_remote
            - include_remote_auto
            - all_relaxations
            - region
            - drop_country
            description: Candidate-pool cascade relaxation code emitted by the job matcher. `none` is telemetry-only; the wire `relaxations[]` only ever carries the subset of tiers that actually filled the feed.
            example: seniority_plus_two
          default: []
          description: Per-tier filter relaxation telemetry labels (cascade detail). Consumers use `relaxation` for UI copy.
          example: []
        state:
          type: string
          enum:
          - strict
          - searching
          - widened
          default: strict
          description: 'Current state of the Discover feed: `strict` (exact matches), `searching` (empty list, first-pass, scrape still running), or `widened` (relaxed matches shown while strict search continues). Drives the Discover banner variant.'
          example: strict
        widenedDimension:
          type:
          - string
          - 'null'
          default: null
          description: Single human-readable name of the dimension that was widened (e.g. "location radius"). Non-null only when `state` is `widened`. UI shows at most one dimension change to keep the message scannable.
          example: null
        widenedDelta:
          type:
          - string
          - 'null'
          default: null
          description: Short human-readable description of the single widening change (e.g. "by 25mi"). Non-null only when `state` is `widened`.
          example: null
        liveRows:
          type: array
          items:
            $ref: '#/components/schemas/LiveMatchData'
          default: []
          description: Supported-ATS jobs fetched live from the user's city during this request because the persisted pool was effectively empty. Not job_match rows - they have no id and cannot be swiped or applied to until the background scrape persists them. Render as a labelled "fresh from <city>" band.
          example: []
        liveCity:
          type:
          - string
          - 'null'
          default: null
          description: The city `liveRows` were fetched from, for the band label. Null when no live fetch ran.
          example: null
        searchProgress:
          type: object
          properties:
            found:
              type: integer
              minimum: 0
              description: Total roles scored and kept for this user, all time.
              example: 77
            lastFoundAt:
              type:
              - string
              - 'null'
              description: When the most recent role was added to this user's feed. Null when the feed has never been populated.
              example: '2026-08-27T05:51:40.000Z'
            lastRunAt:
              type:
              - string
              - 'null'
              description: When the last scoring pass finished. Null when no pass has been recorded in the last 24 hours.
              example: '2026-08-27T05:51:40.000Z'
            reviewed:
              type: integer
              minimum: 0
              description: Roles this user has already dismissed or saved.
              example: 54
            scanned:
              type: integer
              minimum: 0
              description: Postings the last scoring pass looked at. 0 when no pass is on record.
              example: 1204
            scored:
              type: integer
              minimum: 0
              description: Postings from the last pass that cleared the match threshold.
              example: 31
            added:
              type: integer
              minimum: 0
              description: Roles the last pass added to the feed (the rest were already there).
              example: 11
          default:
            added: 0
            found: 0
            lastFoundAt: null
            lastRunAt: null
            reviewed: 0
            scanned: 0
            scored: 0
          required:
          - found
          - lastFoundAt
          - lastRunAt
          - reviewed
          - scanned
          - scored
          - added
          additionalProperties: false
          description: 'Counted facts about this user''s search: roles found all time, how many they have reviewed, and what the last scoring pass looked at. Zeroed on responses that do not compute it.'
        workModeBlocked:
          type:
          - object
          - 'null'
          properties:
            count:
              type: integer
              description: Persisted matches that pass every other Discover gate and fail only the work-mode gate. Always above zero; a zero is sent as a null payload.
              example: 6
              exclusiveMinimum: 0
            arrangements:
              type: object
              properties:
                onsite:
                  type: integer
                  minimum: 0
                hybrid:
                  type: integer
                  minimum: 0
                remote:
                  type: integer
                  minimum: 0
              required:
              - onsite
              - hybrid
              - remote
              description: The same total split by the work style each blocked row needs. The three sum to `count`.
              example:
                hybrid: 2
                onsite: 4
                remote: 0
            cities:
              type: array
              items:
                type: string
              maxItems: 3
              description: Up to three real city names read off the blocked rows, commonest first.
              example:
              - Edmonton
            roleFamily:
              type:
              - string
              - 'null'
              enum:
              - software_engineer_frontend
              - software_engineer_backend
              - software_engineer_fullstack
              - software_engineer_mobile
              - software_engineer_embedded
              - software_engineer_games
              - software_engineer_generic
              - devops_sre
              - platform_infra
              - security_engineer
              - qa_test
              - data_engineer
              - data_scientist
              - data_analyst
              - ml_engineer
              - ai_research
              - product_manager
              - project_program_manager
              - designer_product
              - designer_ux_research
              - designer_visual
              - engineering_manager
              - technical_writer
              - developer_advocate
              - solutions_engineer
              - support_engineer
              - sales
              - marketing
              - operations
              - executive
              - finance
              - legal
              - hr_recruiting
              - customer_success
              - healthcare
              - creative-design
              - trades-manual
              - education
              - hospitality
              - logistics-supply
              - manufacturing
              - gov-nonprofit
              - marketing-sales
              - consulting
              - retail
              - insurance
              - admin_office
              - other
              - robotics_engineer
              - control_systems_engineer
              - mechatronics_engineer
              - firmware_engineer
              - fpga_engineer
              - hardware_engineer
              - electrical_engineer
              - rf_engineer
              - analog_engineer
              - biomedical_engineer
              - aerospace_engineer
              - avionics_engineer
              - simulation_engineer
              - computer_vision_engineer
              - autonomous_vehicles_engineer
              - graphics_engineer
              - blockchain_engineer
              - smart_contract_engineer
              - game_designer
              - ios_engineer
              - android_engineer
              - mlops_engineer
              - ai_infrastructure_engineer
              - llm_engineer
              - prompt_engineer
              - research_engineer
              - applied_scientist
              - cloud_architect
              - solutions_architect
              - enterprise_architect
              - release_engineer
              - network_engineer
              - systems_engineer
              - database_administrator
              - appsec_engineer
              - pentest_engineer
              - soc_analyst
              - incident_responder
              - analytics_engineer
              - data_architect
              - bioinformatics_engineer
              - computational_biologist
              - quant_analyst
              - quant_developer
              - trading_systems_engineer
              - risk_analyst
              - sdet
              - automation_engineer
              - product_manager_growth
              - ux_writer
              - content_designer
              - design_engineer
              - documentation_engineer
              - customer_engineer
              - implementation_engineer
              - civil_engineer
              - mechanical_engineer
              - null
              description: The commonest role family among the blocked rows. Null when none of them carries one.
              example: civil_engineer
            unlockWorkStyles:
              type: array
              items:
                type: string
                enum:
                - onsite
                - hybrid
                - remote
                description: User's preferred work style, physical mode only, no geo scoping
                example: remote
              description: The work styles the one-tap action adds. Only styles that actually unlock rows appear, so the offer never names a mode worth nothing.
              example:
              - onsite
              - hybrid
          default: null
          required:
          - count
          - arrangements
          - cities
          - roleFamily
