openapi: 3.2.0
info:
  title: Aiapplyd Search API
  version: 115c47ce
  contact:
    email: support@aiapplyd.com
    name: AI Applyd
    url: https://aiapplyd.com
  license:
    name: Proprietary
    url: https://aiapplyd.com/legal/terms
  description: 'Operations tagged search across 2 of this provider''s published API definitions: aiapplyd-openapi.json, aiapplyd-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Current environment
  url: https://api.aiapplyd.com/api/v1
security:
- BearerAuth: []
tags:
- name: Search
paths:
  /search/describe:
    post:
      tags:
      - Search
      summary: Describe Your Search (natural language)
      description: Turn a free-text description of the job search the user wants into a structured search configuration. Stateless - nothing is persisted; the caller applies the returned config.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchDescribeRequest'
      responses:
        '200':
          description: Structured search config derived from the message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchDescribeResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postSearchDescribe
    servers:
    - description: Current environment
      url: https://api.aiapplyd.com/api/v1
  /search/describe/from-resume:
    post:
      tags:
      - Search
      summary: Set Up Search From Resume
      description: Derive a structured search configuration from a resume (deterministic canonicalization, no AI). Send `parsedData` to derive from the picked/uploaded resume, or omit the body to derive from the user's latest READY base resume. Stateless - nothing is persisted; the caller applies the returned config.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchDescribeFromResumeRequest'
      responses:
        '200':
          description: Structured search config derived from the base resume
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchDescribeFromResumeResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postSearchDescribeFromResume
    servers:
    - description: Current environment
      url: https://api.aiapplyd.com/api/v1
