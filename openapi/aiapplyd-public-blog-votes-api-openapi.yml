      - success
      additionalProperties: false
    RecordArticleVote:
      type: object
      properties:
        helpful:
          type: boolean
          description: true = the article was helpful, false = it was not.
          example: true
        voterKey:
          type: string
          minLength: 8
          maxLength: 64
          pattern: ^[\w-]+$
          description: Opaque anonymous id generated and kept by the reader's browser. One vote per key per post; voting again changes the vote.
          example: k3v9Q2xL_7aB
      required:
      - helpful
      - voterKey
      additionalProperties: false
    ArticleVoteCountsPayload:
      type: object
