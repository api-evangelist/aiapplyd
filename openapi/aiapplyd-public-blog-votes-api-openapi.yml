openapi: 3.2.0
info:
  contact:
    email: support@aiapplyd.com
    name: AI Applyd
    url: https://aiapplyd.com
  description: 'The AI Applyd API runs the whole job hunt for you: it matches you to roles that fit your profile, rewrites your resume for each posting, writes the cover letter the form asks for, and auto-applies across the major applicant tracking systems. Every send is tracked from the swipe to the employer''s own confirmation, so you always know what landed. Authenticate with a Bearer session token. The same surface powers the web app, the mobile app and the AI Applyd MCP server for ChatGPT, Claude and other agents.'
  license:
    name: Proprietary
    url: https://aiapplyd.com/legal/terms
  title: AI Applyd Public Blog Votes API
  version: fa810d82
servers:
- description: Current environment
  url: https://api.aiapplyd.com/api/v1
security:
- BearerAuth: []
tags:
- description: Anonymous "Was this article helpful?" votes on blog posts.
  name: public-blog-votes
paths:
  /public/blog/{slug}/helpful:
    get:
      description: Helpful and not-helpful vote counts for one blog post. Zeros when nobody has voted.
      summary: Get article helpful votes
      tags:
      - public-blog-votes
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 200
          pattern: ^[a-z0-9-]+$
          description: Blog post slug.
          example: how-to-beat-applicant-tracking-systems
        required: true
        description: Blog post slug.
        in: path
        name: slug
      responses:
        '200':
          description: Vote counts for the post.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleVoteCountsResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: getPublicBlogBySlugHelpful
    post:
      description: 'Record an anonymous "Was this article helpful?" vote. One vote per voterKey per post: voting again changes the vote instead of adding one. Returns the updated counts. Rate-limited per IP.'
      summary: Vote on article helpfulness
      tags:
      - public-blog-votes
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 200
          pattern: ^[a-z0-9-]+$
          description: Blog post slug.
          example: how-to-beat-applicant-tracking-systems
        required: true
        description: Blog post slug.
        in: path
        name: slug
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordArticleVote'
      responses:
        '200':
          description: Updated vote counts for the post.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleVoteCountsResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postPublicBlogBySlugHelpful
components:
  schemas:
    ArticleVoteCounts:
      type: object
      properties:
        helpful:
          type: integer
          minimum: 0
          description: Readers who found the article helpful.
          example: 42
        notHelpful:
          type: integer
          minimum: 0
          description: Readers who did not.
          example: 3
      required:
      - helpful
      - notHelpful
      additionalProperties: false
    ArticleVoteCountsResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ArticleVoteCountsPayload'
        meta:
          $ref: '#/components/schemas/ResponseMetadata'
        success:
          type: boolean
          enum:
          - true
      required:
      - data
      - success
      additionalProperties: false
      description: Successful API response
    ApiErrorResponse:
      type: object
      properties:
