          - 'null'
          description: Email from parsed resume
          example: john.doe@example.com
        experienceLevel:
          type: string
          enum:
          - entry
          - mid
          - senior
          - lead
          - executive
          description: Inferred experience level (DEPRECATED scalar  -  prefer `experienceLevels`). When `experienceLevels` is present it wins; the scalar is mirrored from its first element.
          example: senior
        experienceLevels:
          type: array
          items:
            type: string
            enum:
            - entry
            - mid
            - senior
            - lead
            - executive
            description: Professional experience level
            example: mid
          description: Inferred experience levels (multi-select). The résumé parser pre-selects ONE as primary; the user can add more. Empty/omitted = no seniority constraint.
          example:
          - mid
          - senior
        remoteGlobal:
          type: boolean
          description: Accept worldwide "Remote  -  Anywhere (Global)" jobs from any region. Set via the location picker's Remote-Anywhere option. Independent of workStyles "remote" (region-restricted).
          example: false
        fullName:
          type:
          - string
          - 'null'
          description: Full name from parsed resume
          example: John Doe
        phone:
          type:
          - string
          - 'null'
          description: Phone number from parsed resume
          example: +1-555-123-4567
        benefits:
          type: array
          items:
            type: string
          description: Must-have job benefits
          example:
          - health_insurance
          - remote_work
        companySize:
          type: array
          items:
            type: string
          description: Preferred company sizes
          example:
          - startup
          - medium
        educationLevel:
          type: string
          description: Minimum education level filter
          example: bachelor
        industries:
          type: array
          items:
            type: string
          description: Industries inferred from work experience
          example:
          - Technology
          - Finance
          - Healthcare
        jobTypes:
          type: array
          items:
            type: string
          description: Preferred job types
          example:
          - full_time
          - contract
        salaryCurrency:
          type: string
          enum:
          - usd
          - eur
          - gbp
          - cad
          - aud
          - inr
          description: Currency for the salary band (converted to USD for matching). Defaults to usd.
          example: eur
        salaryMax:
          type: integer
          description: Maximum desired salary (in salaryCurrency)
          example: 200000
          exclusiveMinimum: 0
        salaryMin:
          type: integer
          description: Minimum desired salary (in salaryCurrency)
          example: 80000
          exclusiveMinimum: 0
        visaSponsorship:
          type: string
          description: Visa sponsorship preference
          example: any
        skills:
          type: array
          items:
            type: string
          description: Skills extracted from resume
          example:
          - TypeScript
          - React
          - Node.js
        state:
          type:
          - string
          - 'null'
          description: State/province from resume
          example: California
        suggestedJobTitles:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 5
          description: 'Suggested job titles based on resume (max 5). Empty arrays and placeholder values ("anywhere", "any", ...) are rejected: a specific title is required to scope the job search.'
          example:
          - Senior Software Engineer
          - Full Stack Developer
        suggestedLocations:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 5
          description: 'Suggested job search locations as "City, Country" or "Country" (max 5). Middle admin segments (state/province) are stripped on ingest. Empty arrays and placeholder values ("anywhere", "any", ...) are rejected: a specific location is required to scope the job search.'
          example:
          - San Francisco, United States
          - Berlin, Germany
        workStyles:
          type: array
          items:
            type: string
            enum:
            - onsite
            - hybrid
            - remote
            description: User's preferred work style, physical mode only, no geo scoping
            example: remote
          minItems: 1
          description: Preferred work styles (onsite/hybrid/remote), multi-select, at least 1 required
          example:
          - remote
          - hybrid
      required:
      - city
      - country
      - email
      - fullName
      - phone
