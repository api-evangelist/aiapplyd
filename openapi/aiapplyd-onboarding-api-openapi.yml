openapi: 3.2.0
info:
  title: Aiapplyd Onboarding API
  version: 115c47ce
  contact:
    email: support@aiapplyd.com
    name: AI Applyd
    url: https://aiapplyd.com
  license:
    name: Proprietary
    url: https://aiapplyd.com/legal/terms
  description: 'Operations tagged onboarding across 2 of this provider''s published API definitions: aiapplyd-openapi.json, aiapplyd-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Current environment
  url: https://api.aiapplyd.com/api/v1
security:
- BearerAuth: []
tags:
- name: Onboarding
paths:
  /onboarding/parse-resume:
    post:
      tags:
      - Onboarding
      summary: Parse Resume for Onboarding
      description: Upload a resume file (PDF, DOCX, or TXT), save it as a user document, and use AI to extract structured data for profile creation.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                documentId:
                  type: string
                temporary:
                  type: string
                  enum:
                  - 'true'
                  - 'false'
      responses:
        '200':
          description: Parsed resume data for frontend review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseResumeResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postOnboardingParseResume
    servers:
    - description: Current environment
      url: https://api.aiapplyd.com/api/v1
  /onboarding/auto-setup:
    post:
      tags:
      - Onboarding
      summary: Auto-Setup from Parsed Resume
      description: Update user account, create job match preferences, and trigger initial job scrape using parsed resume data.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoSetupRequest'
      responses:
        '200':
          description: Auto-setup completed with preferences and scrape status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoSetupResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postOnboardingAutoSetup
    servers:
    - description: Current environment
      url: https://api.aiapplyd.com/api/v1
  /onboarding/discover-status:
    get:
      tags:
      - Onboarding
      summary: Poll Background Match Discovery Status
      description: Returns the current status of the background match-discovery job triggered by /onboarding/auto-setup. Frontend polls this after auto-setup to show retry affordance when discovery fails.
      responses:
        '200':
          description: Current discovery status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverStatusResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: getOnboardingDiscoverStatus
    servers:
    - description: Current environment
      url: https://api.aiapplyd.com/api/v1
  /onboarding/profile:
    post:
      tags:
      - Onboarding
      summary: Upsert Onboarding Profile
      description: Soft-patch the user's onboarding wizard answers. Every field is optional; only the fields posted are written. Idempotent per screen.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingProfileUpsert'
      responses:
        '200':
          description: Persisted onboarding profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingProfileResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postOnboardingProfile
    get:
      tags:
      - Onboarding
      summary: Get Onboarding Profile
      description: Read the user's onboarding wizard answers (or an empty profile when the wizard has not been started).
      responses:
        '200':
          description: Onboarding profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingProfileResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: getOnboardingProfile
    servers:
    - description: Current environment
      url: https://api.aiapplyd.com/api/v1
  /onboarding/resume-prefill:
    get:
      tags:
      - Onboarding
      summary: Get Resume Prefill
      description: Report which application-profile and job-preference fields still hold the value verified from the user's base resume, plus the canonical resume cities to offer as location chips. Returns field keys and city names only, never contact values.
      responses:
        '200':
          description: Resume prefill status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumePrefillResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: getOnboardingResumePrefill
    servers:
    - description: Current environment
      url: https://api.aiapplyd.com/api/v1
  /onboarding/complete:
    post:
      tags:
      - Onboarding
      summary: Complete Onboarding
      description: 'Finalize the onboarding wizard: stamp the completion milestone and soft-fill the user''s job-match preferences + AI persona from the wizard answers (only filling targets that are still empty). Idempotent - re-calling is a no-op for the soft-fill. An optional `autoApplyMode` arms the persona''s auto-apply status when the user opted into autopilot (only when still at the seeded default).'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteOnboardingRequest'
      responses:
        '200':
          description: Onboarding finalized with soft-fill summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingCompleteResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postOnboardingComplete
    servers:
    - description: Current environment
      url: https://api.aiapplyd.com/api/v1
  /onboarding/escrow:
    post:
      tags:
      - Onboarding
      summary: Mint Onboarding Escrow
      description: 'Store anonymous /start answers server-side at the account gate and return an opaque reference. The reference is threaded into the auth callback URL so a magic link opened in a DIFFERENT browser can still recover the answers. Anonymous by necessity: the account does not exist yet.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MintOnboardingEscrowBody'
      responses:
        '200':
          description: The escrow reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MintOnboardingEscrowResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postOnboardingEscrow
    servers:
    - description: Current environment
      url: https://api.aiapplyd.com/api/v1
  /onboarding/escrow/redeem:
    post:
      tags:
      - Onboarding
      summary: Redeem Onboarding Escrow
      description: Exchange an escrow reference for the answers it holds, then drop the blob. Requires a session. Returns answers:null for an absent, expired or already-redeemed reference - which is NOT the same as "the user answered nothing".
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemOnboardingEscrowBody'
      responses:
        '200':
          description: The escrowed answers, or nulls when the reference resolves to nothing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedeemOnboardingEscrowResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postOnboardingEscrowRedeem
    servers:
    - description: Current environment
      url: https://api.aiapplyd.com/api/v1
components:
  schemas:
    AutoSetupPreferencesData:
      type: object
      properties:
        createdAt:
          type:
          - string
          - 'null'
        excludeCompanies:
          type:
          - array
          - 'null'
          items:
            type: string
        experienceLevel:
          type:
          - string
          - 'null'
        id:
          type: integer
        industries:
          type:
          - array
          - 'null'
          items:
            type: string
        isActive:
          type: boolean
        locations:
          type:
          - array
          - 'null'
          items:
            type: string
        salaryMin:
          type:
          - number
          - 'null'
        targetRoles:
          type:
          - array
          - 'null'
          items:
            type: string
        updatedAt:
          type:
          - string
          - 'null'
      required:
      - createdAt
      - excludeCompanies
      - experienceLevel
      - id
      - industries
      - isActive
      - locations
      - salaryMin
      - targetRoles
      - updatedAt
      additionalProperties: false
    CompleteOnboardingRequest:
      type: object
      properties:
        autoApplyMode:
          type: string
          enum:
          - copilot
          - autopilot
      additionalProperties: false
    ApiErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            context:
              oneOf:
              - type: object
                properties:
                  errorType:
                    type: string
                    enum:
                    - validation
                  field:
                    type: string
                  fieldErrors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        expected:
                          type: string
                        field:
                          type: string
                        message:
                          type: string
                        received:
                          type: string
                      required:
                      - field
                      - message
                  schemaName:
                    type: string
                required:
                - errorType
              - type: object
                properties:
                  attemptedEmail:
                    type: string
                    format: email
                  errorType:
                    type: string
                    enum:
                    - authentication
                  failureReason:
                    type: string
                    enum:
                    - invalid_credentials
                    - account_locked
                    - expired_token
                    - token_expired
                    - missing_token
                    - invalid_token
                    - session_expired
                    description: Reason for authentication failure
                    example: token_expired
                  ipAddress:
                    type: string
                  operation:
                    type: string
                  service:
                    type: string
                  userAgent:
                    type: string
                required:
                - errorType
              - type: object
                properties:
                  actualPermission:
                    type: string
                  errorType:
                    type: string
                    enum:
                    - authorization
                  requiredPermission:
                    type: string
                  resource:
                    type: string
                  resourceId:
                    type: string
                  userId:
                    type: string
                required:
                - errorType
              - type: object
                properties:
                  constraint:
                    type: string
                  errorType:
                    type: string
                    enum:
                    - database
                  operation:
                    type: string
                    enum:
                    - insert
                    - update
                    - delete
                    - select
                    - batch
                    - transaction
                    - migration
                    description: Type of database operation
                    example: select
                  resourceId:
                    type: string
                  sqlState:
                    type: string
                  table:
                    type: string
                  userId:
                    type: string
                required:
                - errorType
              - type: object
                properties:
                  endpoint:
                    type: string
                  errorType:
                    type: string
                    enum:
                    - external_service
                  httpStatus:
                    type: number
                  operation:
                    type: string
                  resourceId:
                    type: string
                  responseTime:
                    type: number
                  retryAttempt:
                    type: integer
                  service:
                    type: string
                  serviceName:
                    type: string
                  userId:
                    type: string
                required:
                - errorType
              - type: object
                properties:
                  errorType:
                    type: string
                    enum:
                    - resource
                  resource:
                    type: string
                  resourceId:
                    type: string
                  service:
                    type: string
                  userId:
                    type: string
                required:
                - errorType
              - type: object
                properties:
                  errorType:
                    type: string
                    enum:
                    - rate_limit
                  limit:
                    type: number
                  resetTime:
                    type: string
                  windowMs:
                    type: number
                required:
                - errorType
              - type: object
                properties:
                  configKey:
                    type: string
                  errorType:
                    type: string
                    enum:
                    - configuration
                  operation:
                    type: string
                  service:
                    type: string
                required:
                - errorType
              description: Type-safe error context information
              example:
                errorType: validation
                fieldErrors:
                - field: email
                  message: Invalid email format
            details:
              oneOf:
              - type: object
                properties:
                  detailType:
                    type: string
                    enum:
                    - validation
                  validationErrors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        field:
                          type: string
                        message:
                          type: string
                      required:
                      - field
                      - message
                required:
                - detailType
                - validationErrors
                additionalProperties: false
              - type: object
                properties:
                  detailType:
                    type: string
                    enum:
                    - service_error
                  originalError:
                    type: string
                  serviceName:
                    type: string
                required:
                - detailType
                - serviceName
                additionalProperties: false
              - type: object
                properties:
                  currentSize:
                    type: number
                  detailType:
                    type: string
                    enum:
                    - batch
                  originalError:
                    type: string
                  statementCount:
                    type: number
                required:
                - detailType
                additionalProperties: false
              - type: object
                properties:
                  detailType:
                    type: string
                    enum:
                    - rate_limit
                  limit:
                    type: number
                  resetTime:
                    type: string
                  windowMs:
                    type: number
                required:
                - detailType
                - limit
                - resetTime
                - windowMs
                additionalProperties: false
              - type: object
                properties:
                  conflictingField:
                    type: string
                  detailType:
                    type: string
                    enum:
                    - resource
                  resourceId:
                    anyOf:
                    - type: string
                    - type: number
                  resourceType:
                    type: string
                required:
                - detailType
                additionalProperties: false
              - type: object
                properties:
                  detailType:
                    type: string
                    enum:
                    - generic
                  info:
                    type: string
                required:
                - detailType
                additionalProperties: false
              - type: object
                properties:
                  currentTokens:
                    type: integer
                    minimum: 0
                  detailType:
                    type: string
                    enum:
                    - insufficient_tokens
                  requiredTokens:
                    type: integer
                    minimum: 0
                required:
                - currentTokens
                - detailType
                - requiredTokens
                additionalProperties: false
            message:
              type: string
            validation:
              type: array
              items:
                type: object
                properties:
                  code:
                    type: string
                  field:
                    type: string
                  message:
                    type: string
                required:
                - field
                - message
                additionalProperties: false
          required:
          - code
          - message
          additionalProperties: false
        meta:
          $ref: '#/components/schemas/ResponseMetadata'
        success:
          type: boolean
          enum:
          - false
      required:
      - error
      - success
      additionalProperties: false
    ResumePrefillResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ResumePrefillData'
        meta:
          $ref: '#/components/schemas/ResponseMetadata'
        success:
          type: boolean
          enum:
          - true
      required:
      - data
      - success
      additionalProperties: false
      description: Successful API response
    ParsedResumeData:
      type: object
      properties:
        addressLine1:
          type:
          - string
          - 'null'
          description: Street + number exactly as printed, or null
          example: Hauptstrasse 12
        city:
          type:
          - string
          - 'null'
          description: City from resume
          example: San Francisco
        companySize:
          type: array
          items:
            type: string
          description: 'AI-inferred company size preferences: startup, small, medium, large, enterprise'
          example:
          - startup
          - medium
        country:
          type:
          - string
          - 'null'
          description: Country from resume
          example: United States
        currentJobTitle:
          type:
          - string
          - 'null'
          description: Current or most recent job title
          example: Senior Software Engineer
        documentId:
          type: integer
          description: ID of the saved user document
          example: 42
        education:
          type: array
          items:
            $ref: '#/components/schemas/EducationItem'
          description: Education history extracted from resume
        educationLevel:
          type:
          - string
          - 'null'
          description: 'AI-inferred education level: high_school, associate, bachelor, master, doctorate'
          example: bachelor
        email:
          type:
          - string
          - 'null'
          description: Email address from resume
          example: john.doe@example.com
        experienceLevel:
          type:
          - string
          - 'null'
          description: 'AI-inferred experience level: entry, mid, senior, lead, executive'
          example: senior
        fieldEvidence:
          type: array
          items:
            $ref: '#/components/schemas/ResumeFieldEvidence'
          description: Verbatim quotes the model offers for contact and level facts
        firstName:
          type:
          - string
          - 'null'
          description: First name parsed from full name
          example: John
        fullName:
          type:
          - string
          - 'null'
          description: Full name from resume
          example: John Doe
        githubUrl:
          type:
          - string
          - 'null'
          description: GitHub profile URL exactly as printed, or null
          example: https://github.com/johndoe
        industries:
          type: array
          items:
            type: string
          description: AI-inferred industries from work history
          example:
          - Software & SaaS
          - AI & Machine Learning
        jobTypes:
          type: array
          items:
            type: string
          description: 'AI-inferred job types: full_time, part_time, contract, freelance, internship, temporary'
          example:
          - full_time
        lastName:
          type:
          - string
          - 'null'
          description: Last name parsed from full name
          example: Doe
        linkedinUrl:
          type:
          - string
          - 'null'
          description: LinkedIn profile URL exactly as printed, or null
          example: https://www.linkedin.com/in/johndoe
        phone:
          type:
          - string
          - 'null'
          description: Phone number from resume
          example: +1-555-123-4567
        portfolioUrl:
          type:
          - string
          - 'null'
          description: Personal website / portfolio URL exactly as printed, or null
          example: https://johndoe.dev
        prefill:
          $ref: '#/components/schemas/ResumePrefill'
        professionalSummary:
          type:
          - string
          - 'null'
          description: Professional summary or objective
          example: Experienced full-stack engineer with 8 years building scalable web applications.
        skills:
          type: array
          items:
            type: string
          description: Skills extracted from resume
          example:
          - TypeScript
          - React
          - Node.js
          - PostgreSQL
        state:
          type:
          - string
          - 'null'
          description: State/province from resume
          example: California
        suggestedJobTitles:
          type: array
          items:
            type: string
          description: Suggested job titles based on experience
          example:
          - Senior Software Engineer
          - Full Stack Developer
          - Tech Lead
        suggestedLocations:
          type: array
          items:
            type: string
          description: Suggested job search locations based on resume
          example:
          - San Francisco, CA
          - Remote
        workExperience:
          type: array
          items:
            $ref: '#/components/schemas/WorkExperienceItem'
          description: Work experience history extracted from resume
        yearsOfExperience:
          type:
          - integer
          - 'null'
          description: Estimated total years of experience (whole number)
          example: 8
        zipCode:
          type:
          - string
          - 'null'
          description: ZIP/postal code from resume
          example: '94105'
      required:
      - city
      - companySize
      - country
      - currentJobTitle
      - documentId
      - education
      - educationLevel
      - email
      - experienceLevel
      - firstName
      - fullName
      - industries
      - jobTypes
      - lastName
      - phone
      - professionalSummary
      - skills
      - state
      - suggestedJobTitles
      - suggestedLocations
      - workExperience
      - yearsOfExperience
      - zipCode
      additionalProperties: false
    ResponseMetadata:
      type: object
      properties:
        duration:
          type: number
          description: Request duration in milliseconds
          example: 150
          exclusiveMinimum: 0
        performance:
          type: object
          properties:
            dbQueries:
              type: integer
              minimum: 0
            totalDbTime:
              type: number
              minimum: 0
          description: Performance metrics (preview/local only)
        requestId:
          type: string
          description: Unique request identifier
          example: req_abc123
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp
          example: '2026-09-25T17:29:47.224Z'
        version:
          type: string
          description: API version
          example: v1
    ResumePrefillData:
      type: object
      properties:
        documentId:
          type:
          - integer
          - 'null'
          description: The base resume the prefill came from, or null when there is none
          example: 42
        jobPreferenceFields:
          type: array
          items:
            type: string
            enum:
            - locations
            - experienceLevels
            - skills
            - targetRoles
            description: A job-preference field a verified resume prefill may fill when the user left it blank
            example: locations
          description: Job-preference fields whose saved value is still the one seeded from the resume
          example:
          - locations
          - skills
        profileFields:
          type: array
          items:
            type: string
            enum:
            - addressLine1
            - city
            - state
            - country
            - zipCode
            - phone
            - linkedinUrl
            - githubUrl
            - portfolioUrl
            - currentEmployer
            - highestEducation
            - yearsOfExperience
            description: An application-profile field a verified resume prefill may fill
            example: city
          description: Application-profile fields whose saved value still equals the verified resume value
          example:
          - city
          - country
          - linkedinUrl
        resumeLocations:
          type: array
          items:
            type: string
          description: Canonical cities from the resume (home first, then past roles), max 5, offered as opt-in location chips
          example:
          - Berlin, Germany
          - Munich, Germany
        seedableSkillsCount:
          type: integer
          minimum: 0
          description: How many resume skills the seed would write (deduped, spoken languages removed, capped)
          example: 12
        status:
          type: string
          enum:
          - none
          - pending
          - ready
          - failed
          description: 'Lifecycle of the base resume prefill: none (no resume), pending (parsing), ready, failed'
          example: ready
