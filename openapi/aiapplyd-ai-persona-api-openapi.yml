openapi: 3.2.0
info:
  contact:
    email: support@aiapplyd.com
    name: AI Applyd
    url: https://aiapplyd.com
  description: 'The AI Applyd API runs the whole job hunt for you: it matches you to roles that fit your profile, rewrites your resume for each posting, writes the cover letter the form asks for, and auto-applies across the major applicant tracking systems. Every send is tracked from the swipe to the employer''s own confirmation, so you always know what landed. Authenticate with a Bearer session token. The same surface powers the web app, the mobile app and the AI Applyd MCP server for ChatGPT, Claude and other agents.'
  license:
    name: Proprietary
    url: https://aiapplyd.com/legal/terms
  title: AI Applyd AI Persona API
  version: fa810d82
servers:
- description: Current environment
  url: https://api.aiapplyd.com/api/v1
security:
- BearerAuth: []
tags:
- description: 'How the agent writes and applies for you: tone, narrative, scoring weights and apply mode.'
  name: ai-persona
paths:
  /ai-persona:
    get:
      tags:
      - ai-persona
      summary: Get AI Persona
      description: Get the authenticated user's Voice & Tone persona settings.
      responses:
        '200':
          description: AI persona retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIPersonaResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: getAiPersona
    put:
      tags:
      - ai-persona
      summary: Create or Update AI Persona
      description: Create or update the authenticated user's Voice & Tone persona. Controls how AI generates content on their behalf.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertAIPersona'
      responses:
        '200':
          description: AI persona created or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIPersonaResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: putAiPersona
  /ai-persona/scoring-weights:
    patch:
      tags:
      - ai-persona
      summary: Update Scoring Weights
      description: Update the authenticated user's per-dimension match scoring weights. Each weight is a multiplier in [0, 2] applied on top of the deterministic match scorer. Defaults are uniform `1` per dimension.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScoringWeights'
      responses:
        '200':
          description: Scoring weights updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoringWeightsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: patchAiPersonaScoringWeights
  /ai-persona/suggest-tone:
    post:
      tags:
      - ai-persona
      summary: Recommend a Voice & Tone preset from the user's resume
      description: Inspects the user's latest resume and recommends one of the persona presets. Free-tier model; one short rationale string for inline display next to the preset cards.
      responses:
        '200':
          description: Voice & Tone preset recommendation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestVoiceToneResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postAiPersonaSuggestTone
  /ai-persona/suggest-narrative:
    post:
      tags:
      - ai-persona
      summary: Draft a background narrative from the user's resume
      description: Inspects the user's latest resume and drafts a short starter narrative (≤480 chars) the user can accept or edit. Free-tier model.
      responses:
        '200':
          description: Drafted background narrative
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestNarrativeResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postAiPersonaSuggestNarrative
  /ai-persona/derive-custom-tone:
    post:
      tags:
      - ai-persona
      summary: Derive a custom voice & tone from the user's resume, cover letter, and story
      description: Reads the user's base resume (+ base cover letter and background narrative when present) and derives a CUSTOM voice & tone (personal description, tone instructions, sample phrases), persisting it to the persona with preset kept at custom. Free-tier model. Idempotent; returns applied=false with a clear reason when no usable resume exists.
      responses:
        '200':
          description: Derived custom voice & tone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeriveCustomToneResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postAiPersonaDeriveCustomTone
  /ai-persona/auto-pilot:
    get:
      tags:
      - ai-persona
      summary: Get Auto Apply
      description: The Auto Apply switch, its daily number, match level and review mode, plus what it has sent for the user.
      responses:
        '200':
          description: Auto Apply settings and report
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      access:
                        type: string
                        enum:
                        - included
                        - grace
                        - upgrade_required
                        - plan_required
                        description: 'Whether this account may run Auto Apply: included in the plan, a time-limited grace, or which wall stands in the way'
                        example: included
                      dailyLimit:
                        type: integer
                        description: Most applications Auto Apply starts in a day
                        example: 10
                      enabled:
                        type: boolean
                        description: Auto Apply is on
                        example: true
                      enabledAt:
                        type:
                        - string
                        - 'null'
                      graceUntil:
                        type:
                        - string
                        - 'null'
                        description: 'When access is grace: the moment Auto Apply stops on this plan (ISO)'
                      isPaidPlan:
                        type: boolean
                        deprecated: true
                        description: Same as access being included or grace. Read access instead.
                      lastRun:
                        type:
                        - object
                        - 'null'
                        properties:
                          halted:
                            type:
                            - string
                            - 'null'
                          ranAt:
                            type: string
                          sent:
                            type: integer
                          skipped:
                            type: object
                            additionalProperties:
                              type: integer
                        required:
                        - halted
                        - ranAt
                        - sent
                        - skipped
                      matchLevel:
                        type: string
                        enum:
                        - excellent
                        - strong
                        - good
                        - stretch
                        description: 'Lowest match quality Auto Apply applies to: excellent (90+), strong (80+), good (70+) or stretch (60+)'
                        example: strong
                      matchesByLevel:
                        type: object
                        properties:
                          excellent:
                            type: integer
                          strong:
                            type: integer
                          good:
                            type: integer
                          stretch:
                            type: integer
                        description: Matches waiting right now at or above each level (not yet applied, not hidden)
                      mode:
                        type: string
                        enum:
                        - copilot
                        - auto_approve
                        description: auto_approve submits on its own; copilot holds each one for review
                        example: copilot
                      planDailyMax:
                        type: integer
                        description: The plan's own daily cap; dailyLimit never exceeds it
                        example: 15
                      recent:
                        type: array
                        items:
                          type: object
                          properties:
                            applyMode:
                              type:
                              - string
                              - 'null'
                              enum:
                              - copilot
                              - auto_approve
                              - null
                              description: 'AI agent mode: copilot (AI prepares, you review before submitting) or auto_approve (AI prepares and submits automatically)'
                              example: copilot
                            company:
                              type:
                              - string
                              - 'null'
                            companyLogoUrl:
                              type:
                              - string
                              - 'null'
                            createdAt:
                              type:
                              - string
                              - 'null'
                              description: When Auto Apply started it (UTC, SQLite timestamp)
                            id:
                              type: integer
                            jobTitle:
                              type:
                              - string
                              - 'null'
                            preparationStatus:
                              type:
                              - string
                              - 'null'
                            status:
                              type: string
                          required:
                          - applyMode
                          - company
                          - companyLogoUrl
                          - createdAt
                          - id
                          - jobTitle
                          - preparationStatus
                          - status
                      report:
                        type: object
                        properties:
                          confirmed:
                            type: integer
                            description: Auto Apply applications the employer confirmed receiving
                          inProgress:
                            type: integer
                            description: Applications Auto Apply is still preparing or submitting
                          notSent:
                            type: integer
                            description: Applications that failed, were skipped or were cancelled
                          started:
                            type: integer
                            description: Every application Auto Apply started for the user
                          submitted:
                            type: integer
                            description: Applications Auto Apply submitted, confirmed or still awaiting a receipt
                          waitingReview:
                            type: integer
                            description: Applications filled and waiting for the user to send them
                        required:
                        - confirmed
                        - inProgress
                        - notSent
                        - started
                        - submitted
                        - waitingReview
                      sentLastDay:
                        type: integer
                        description: Applications Auto Apply started in the last 24 hours
                    required:
                    - access
                    - dailyLimit
                    - enabled
                    - enabledAt
                    - graceUntil
                    - isPaidPlan
                    - lastRun
                    - matchLevel
                    - matchesByLevel
                    - mode
                    - planDailyMax
                    - recent
                    - report
                    - sentLastDay
                  meta:
                    $ref: '#/components/schemas/ResponseMetadata'
                  success:
                    type: boolean
                    enum:
                    - true
                required:
                - data
                - success
                additionalProperties: false
                description: Successful API response
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: getAiPersonaAutoPilot
    put:
      tags:
      - ai-persona
      summary: Update Auto Apply
      description: Switch Auto Apply on or off and set its daily number, match level and review mode. Turning it on needs a paid plan and starts the first applications right away.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dailyLimit:
                  type: integer
                  minimum: 1
                  maximum: 500
                enabled:
                  type: boolean
                matchLevel:
                  type: string
                  enum:
                  - excellent
                  - strong
                  - good
                  - stretch
                  description: 'Lowest match quality Auto Apply applies to: excellent (90+), strong (80+), good (70+) or stretch (60+)'
                  example: strong
                mode:
                  type: string
                  enum:
                  - copilot
                  - auto_approve
                  description: 'AI agent mode: copilot (AI prepares, you review before submitting) or auto_approve (AI prepares and submits automatically)'
                  example: copilot
              additionalProperties: false
      responses:
        '200':
          description: Auto Apply updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      access:
                        type: string
                        enum:
                        - included
                        - grace
                        - upgrade_required
                        - plan_required
                        description: 'Whether this account may run Auto Apply: included in the plan, a time-limited grace, or which wall stands in the way'
                        example: included
                      dailyLimit:
                        type: integer
                        description: Most applications Auto Apply starts in a day
                        example: 10
                      enabled:
                        type: boolean
                        description: Auto Apply is on
                        example: true
                      enabledAt:
                        type:
                        - string
                        - 'null'
                      graceUntil:
                        type:
                        - string
                        - 'null'
                        description: 'When access is grace: the moment Auto Apply stops on this plan (ISO)'
                      isPaidPlan:
                        type: boolean
                        deprecated: true
                        description: Same as access being included or grace. Read access instead.
                      lastRun:
                        type:
                        - object
                        - 'null'
                        properties:
                          halted:
                            type:
                            - string
                            - 'null'
                          ranAt:
                            type: string
                          sent:
                            type: integer
                          skipped:
                            type: object
                            additionalProperties:
                              type: integer
                        required:
                        - halted
                        - ranAt
                        - sent
                        - skipped
                      matchLevel:
                        type: string
                        enum:
                        - excellent
                        - strong
                        - good
                        - stretch
                        description: 'Lowest match quality Auto Apply applies to: excellent (90+), strong (80+), good (70+) or stretch (60+)'
                        example: strong
                      matchesByLevel:
                        type: object
                        properties:
                          excellent:
                            type: integer
                          strong:
                            type: integer
                          good:
                            type: integer
                          stretch:
                            type: integer
                        description: Matches waiting right now at or above each level (not yet applied, not hidden)
                      mode:
                        type: string
                        enum:
                        - copilot
                        - auto_approve
                        description: auto_approve submits on its own; copilot holds each one for review
                        example: copilot
                      planDailyMax:
                        type: integer
                        description: The plan's own daily cap; dailyLimit never exceeds it
                        example: 15
                      recent:
                        type: array
                        items:
                          type: object
                          properties:
                            applyMode:
                              type:
                              - string
                              - 'null'
                              enum:
                              - copilot
                              - auto_approve
                              - null
                              description: 'AI agent mode: copilot (AI prepares, you review before submitting) or auto_approve (AI prepares and submits automatically)'
                              example: copilot
                            company:
                              type:
                              - string
                              - 'null'
                            companyLogoUrl:
                              type:
                              - string
                              - 'null'
                            createdAt:
                              type:
                              - string
                              - 'null'
                              description: When Auto Apply started it (UTC, SQLite timestamp)
                            id:
                              type: integer
                            jobTitle:
                              type:
                              - string
                              - 'null'
                            preparationStatus:
                              type:
                              - string
                              - 'null'
                            status:
                              type: string
                          required:
                          - applyMode
                          - company
                          - companyLogoUrl
                          - createdAt
                          - id
                          - jobTitle
                          - preparationStatus
                          - status
                      report:
                        type: object
                        properties:
                          confirmed:
                            type: integer
                            description: Auto Apply applications the employer confirmed receiving
                          inProgress:
                            type: integer
                            description: Applications Auto Apply is still preparing or submitting
                          notSent:
                            type: integer
                            description: Applications that failed, were skipped or were cancelled
                          started:
                            type: integer
                            description: Every application Auto Apply started for the user
                          submitted:
                            type: integer
                            description: Applications Auto Apply submitted, confirmed or still awaiting a receipt
                          waitingReview:
                            type: integer
                            description: Applications filled and waiting for the user to send them
                        required:
                        - confirmed
                        - inProgress
                        - notSent
                        - started
                        - submitted
                        - waitingReview
                      sentLastDay:
                        type: integer
                        description: Applications Auto Apply started in the last 24 hours
                    required:
