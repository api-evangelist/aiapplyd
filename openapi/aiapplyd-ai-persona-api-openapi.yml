components:
  schemas:
    SuggestNarrativeResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/SuggestNarrativeData'
        meta:
          $ref: '#/components/schemas/ResponseMetadata'
        success:
          type: boolean
          enum:
          - true
      required:
      - data
      - success
      additionalProperties: false
      description: Successful API response
    DeriveCustomToneData:
      type: object
      properties:
        kind:
          type: string
          enum:
          - custom-tone
          description: Discriminator for the derive envelope.
          example: custom-tone
        applied:
          type: boolean
          description: Whether a custom tone was derived and persisted.
          example: true
        reason:
          type:
          - string
          - 'null'
          description: Why a tone could not be derived (e.g. no base resume). Null on success.
          example: null
        personalDescription:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Derived personal description (≤500 chars). Null when not applied.
          example: Senior backend engineer with eight years in fintech and payments.
        toneInstructions:
          type:
          - string
          - 'null'
          maxLength: 1000
          description: Derived tone instructions (≤1000 chars). Null when not applied.
          example: Write plainly and results-first. Lead with concrete metrics, avoid corporate jargon.
        samplePhrases:
          type:
          - array
          - 'null'
          items:
            type: string
            maxLength: 200
          maxItems: 10
          description: Derived sample phrases (≤10). Null when not applied.
          example:
          - Let me walk you through the impact
          - I owned this end to end
      required:
      - kind
      - applied
      - reason
      - personalDescription
      - toneInstructions
      - samplePhrases
      additionalProperties: false
    DeriveCustomToneResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/DeriveCustomToneData'
        meta:
          $ref: '#/components/schemas/ResponseMetadata'
        success:
          type: boolean
          enum:
          - true
      required:
      - data
      - success
      additionalProperties: false
      description: Successful API response
    AIPersonaResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AIPersonaData'
        meta:
          $ref: '#/components/schemas/ResponseMetadata'
        success:
          type: boolean
          enum:
          - true
      required:
      - data
      - success
      additionalProperties: false
      description: Successful API response
    SuggestVoiceToneData:
      type: object
      properties:
        kind:
          type: string
          enum:
          - voice-tone
          description: Discriminator for the suggestion envelope.
          example: voice-tone
        presetId:
          type: string
          enum:
          - balanced
          - the_professional
          - the_conversationalist
          - the_storyteller
          - the_closer
          - the_enthusiast
          - custom
          description: Recommended persona preset.
          example: balanced
        rationale:
          type: string
          minLength: 1
          maxLength: 400
          description: One-line, plain-language reason for the recommendation.
          example: Resume reads professional with concrete metrics. Try Balanced.
      required:
      - kind
      - presetId
      - rationale
      additionalProperties: false
    ApiErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            context:
              oneOf:
              - type: object
                properties:
                  errorType:
                    type: string
                    enum:
                    - validation
                  field:
                    type: string
                  fieldErrors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        expected:
                          type: string
                        field:
                          type: string
                        message:
                          type: string
                        received:
                          type: string
                      required:
                      - field
                      - message
                  schemaName:
                    type: string
                required:
                - errorType
              - type: object
                properties:
                  attemptedEmail:
                    type: string
                    format: email
                  errorType:
                    type: string
                    enum:
                    - authentication
                  failureReason:
                    type: string
                    enum:
                    - invalid_credentials
                    - account_locked
                    - expired_token
                    - token_expired
                    - missing_token
                    - invalid_token
                    - session_expired
                    description: Reason for authentication failure
                    example: token_expired
                  ipAddress:
                    type: string
                  operation:
                    type: string
                  service:
                    type: string
                  userAgent:
                    type: string
                required:
                - errorType
              - type: object
                properties:
                  actualPermission:
                    type: string
                  errorType:
                    type: string
                    enum:
                    - authorization
                  requiredPermission:
                    type: string
                  resource:
                    type: string
                  resourceId:
                    type: string
                  userId:
                    type: string
                required:
                - errorType
              - type: object
                properties:
                  constraint:
                    type: string
                  errorType:
                    type: string
                    enum:
                    - database
                  operation:
                    type: string
                    enum:
                    - insert
                    - update
                    - delete
                    - select
                    - batch
                    - transaction
                    - migration
                    description: Type of database operation
                    example: select
                  resourceId:
                    type: string
                  sqlState:
                    type: string
                  table:
                    type: string
                  userId:
                    type: string
                required:
                - errorType
              - type: object
                properties:
                  endpoint:
                    type: string
                  errorType:
                    type: string
                    enum:
                    - external_service
                  httpStatus:
                    type: number
                  operation:
                    type: string
                  resourceId:
                    type: string
                  responseTime:
                    type: number
                  retryAttempt:
                    type: integer
                  service:
                    type: string
                  serviceName:
                    type: string
                  userId:
                    type: string
                required:
                - errorType
              - type: object
                properties:
                  errorType:
                    type: string
                    enum:
                    - resource
                  resource:
                    type: string
                  resourceId:
                    type: string
                  service:
                    type: string
                  userId:
                    type: string
                required:
                - errorType
              - type: object
                properties:
                  errorType:
                    type: string
                    enum:
                    - rate_limit
                  limit:
                    type: number
                  resetTime:
                    type: string
                  windowMs:
                    type: number
                required:
                - errorType
              - type: object
                properties:
                  configKey:
                    type: string
                  errorType:
