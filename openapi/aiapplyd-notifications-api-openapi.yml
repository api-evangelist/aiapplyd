          type: boolean
          enum:
          - true
      required:
      - data
      - success
      additionalProperties: false
      description: Successful API response
    NotificationMutationData:
      type: object
      properties:
        updated:
          type: integer
          minimum: 0
      required:
      - updated
      additionalProperties: false
    ResponseMetadata:
      type: object
      properties:
        duration:
          type: number
          description: Request duration in milliseconds
          example: 150
          exclusiveMinimum: 0
        performance:
          type: object
          properties:
            dbQueries:
              type: integer
              minimum: 0
            totalDbTime:
              type: number
              minimum: 0
          description: Performance metrics (preview/local only)
        requestId:
          type: string
          description: Unique request identifier
          example: req_abc123
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp
          example: '2026-09-25T17:29:47.224Z'
        version:
          type: string
          description: API version
          example: v1
    DeletePushTokenRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 200
          pattern: ^Expo(?:nent)?PushToken\[[^\][\s]+\]$
          description: Expo push token issued by getExpoPushTokenAsync()
          example: ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]
      required:
      - token
      additionalProperties: false
    DocumentAtsScoredNotificationPayload:
      type: object
      properties:
        documentId:
          type: integer
          description: Owned user_document row id
          example: 42
          exclusiveMinimum: 0
        overallScore:
          type: number
          minimum: 0
          maximum: 100
          description: Persisted ATS score from 0 to 100
          example: 84
      required:
      - documentId
      - overallScore
      additionalProperties: false
    ApplicationReadyToSendNotificationContent:
      type: object
      properties:
        kind:
          type: string
          enum:
          - application_ready_to_send
        payload:
