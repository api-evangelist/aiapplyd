openapi: 3.2.0
info:
  title: Aiapplyd Notifications API
  version: 115c47ce
  contact:
    email: support@aiapplyd.com
    name: AI Applyd
    url: https://aiapplyd.com
  license:
    name: Proprietary
    url: https://aiapplyd.com/legal/terms
  description: 'Operations tagged notifications across 2 of this provider''s published API definitions: aiapplyd-openapi.json, aiapplyd-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Current environment
  url: https://api.aiapplyd.com/api/v1
security:
- BearerAuth: []
tags:
- name: Notifications
paths:
  /notifications/push-token:
    post:
      tags:
      - Notifications
      summary: Register Push Token
      description: 'Register (or move) an Expo push token to the authenticated user''s account. Idempotent: re-registering the same token MOVES it rather than creating a duplicate.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterPushTokenRequest'
      responses:
        '200':
          description: Push token registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushTokenResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postNotificationsPushToken
    servers:
    - description: Current environment
      url: https://api.aiapplyd.com/api/v1
  /notifications/push-token/unregister:
    post:
      tags:
      - Notifications
      summary: Unregister Push Token
      description: Drop an Expo push token from the authenticated user's account. Called on sign-out - a token left registered means the next person holding the phone receives the previous user's notifications.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeletePushTokenRequest'
      responses:
        '200':
          description: Push token unregistered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushTokenResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postNotificationsPushTokenUnregister
    servers:
    - description: Current environment
      url: https://api.aiapplyd.com/api/v1
  /notifications:
    get:
      tags:
      - Notifications
      summary: List Notification Feed
      description: List up to 30 active durable notifications for the authenticated user, newest first. Pass the last visible row id as cursor to fetch older rows; unreadCount always covers all active rows, including rows outside the current page. Payloads are strict machine facts; clients own localized presentation and navigation.
      parameters:
      - schema:
          type: string
          pattern: ^[1-9]\d{0,15}$
          description: Owned notification row id at the end of the previous page
          example: '42'
        required: false
        description: Owned notification row id at the end of the previous page
        name: cursor
        in: query
      responses:
        '200':
          description: Active notification feed retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationFeedResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: getNotifications
    servers:
    - description: Current environment
      url: https://api.aiapplyd.com/api/v1
  /notifications/read:
    patch:
      tags:
      - Notifications
      summary: Mark Notifications Read
      description: Mark up to 50 active notification rows read. Only rows owned by the authenticated user are touched.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationIdsRequest'
      responses:
        '200':
          description: Notification read state updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationMutationResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: patchNotificationsRead
    servers:
    - description: Current environment
      url: https://api.aiapplyd.com/api/v1
  /notifications/dismiss:
    patch:
      tags:
      - Notifications
      summary: Dismiss Notifications
      description: Dismiss up to 50 active notification rows. Only rows owned by the authenticated user are touched.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationIdsRequest'
      responses:
        '200':
          description: Notifications dismissed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationMutationResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: patchNotificationsDismiss
    servers:
    - description: Current environment
      url: https://api.aiapplyd.com/api/v1
