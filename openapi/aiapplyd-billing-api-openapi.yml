openapi: 3.2.0
info:
  title: Aiapplyd Billing API
  version: 115c47ce
  contact:
    email: support@aiapplyd.com
    name: AI Applyd
    url: https://aiapplyd.com
  license:
    name: Proprietary
    url: https://aiapplyd.com/legal/terms
  description: 'Operations tagged billing across 2 of this provider''s published API definitions: aiapplyd-openapi.json, aiapplyd-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: Current environment
  url: https://api.aiapplyd.com/api/v1
security:
- BearerAuth: []
tags:
- description: Subscription and billing management
  name: Billing
paths:
  /billing/create-checkout-session:
    post:
      description: Create a Stripe checkout session for subscription or token purchase. Customer is created if not exists and cached in KV.
      summary: Create Checkout Session
      tags:
      - Billing
      requestBody:
        description: Checkout session parameters
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCheckoutSessionRequest'
      responses:
        '200':
          description: Checkout session created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCheckoutSessionResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postBillingCreateCheckoutSession
    servers:
    - description: Current environment
      url: https://api.aiapplyd.com/api/v1
  /billing/create-portal-session:
    post:
      description: Create a Stripe billing portal session for managing subscriptions and payment methods.
      summary: Create Billing Portal Session
      tags:
      - Billing
      requestBody:
        description: Portal session parameters
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePortalSessionRequest'
      responses:
        '200':
          description: Portal session created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePortalSessionResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postBillingCreatePortalSession
    servers:
    - description: Current environment
      url: https://api.aiapplyd.com/api/v1
  /billing/sync-after-checkout:
    post:
      description: Sync subscription data after successful checkout. Call this from the success page.
      summary: Sync After Checkout
      tags:
      - Billing
      responses:
        '200':
          description: Sync completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncAfterCheckoutResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postBillingSyncAfterCheckout
    servers:
    - description: Current environment
      url: https://api.aiapplyd.com/api/v1
  /billing/subscription:
    get:
      description: Get the current user subscription details and token balance.
      summary: Get Subscription
      tags:
      - Billing
      responses:
        '200':
          description: Subscription details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSubscriptionResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: getBillingSubscription
    servers:
    - description: Current environment
      url: https://api.aiapplyd.com/api/v1
  /billing/cancel-subscription:
    post:
      description: Cancel the current user subscription. Can cancel immediately or at the end of the billing period.
      summary: Cancel Subscription
      tags:
      - Billing
      requestBody:
        description: Cancellation options
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelSubscriptionRequest'
      responses:
        '200':
          description: Subscription cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelSubscriptionResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postBillingCancelSubscription
    servers:
    - description: Current environment
      url: https://api.aiapplyd.com/api/v1
  /billing/subscription/switch:
    post:
      description: Switch to a different subscription plan. Upgrades are applied immediately with proration, downgrades are scheduled for period end.
      summary: Switch Subscription Plan
      tags:
      - Billing
      requestBody:
        description: New price ID to switch to
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchSubscriptionRequest'
      responses:
        '200':
          description: Subscription switched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwitchSubscriptionResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postBillingSubscriptionSwitch
    servers:
    - description: Current environment
      url: https://api.aiapplyd.com/api/v1
  /billing/invoices:
    get:
      description: Get the current user invoice history with pagination support.
      summary: Get Invoices
      tags:
      - Billing
      parameters:
      - schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
          description: Maximum number of invoices to return (max 100)
          example: 10
        required: false
        description: Maximum number of invoices to return (max 100)
        name: limit
        in: query
      - schema:
          type: string
          description: Cursor for pagination (invoice ID to start after)
          example: in_1234567890
        required: false
        description: Cursor for pagination (invoice ID to start after)
        name: startingAfter
        in: query
      responses:
        '200':
          description: Invoices retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetInvoicesResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: getBillingInvoices
    servers:
    - description: Current environment
      url: https://api.aiapplyd.com/api/v1
  /billing/usage:
    get:
      description: Returns per-action usage, limits, and remaining quota for the authenticated user. Enables frontend pre-flight limit checks.
      summary: Get Action Usage and Limits
      tags:
      - Billing
      responses:
        '200':
          description: Action usage data retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUsageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: getBillingUsage
    servers:
    - description: Current environment
      url: https://api.aiapplyd.com/api/v1
  /billing/action-costs:
    get:
      description: Returns the estimated min/typical/max billed-token cost for every AI action. Safe for CDN caching.
      summary: Get Per-Action Token Cost Estimates
      tags:
      - Billing
      responses:
        '200':
          description: Action cost estimates retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetActionCostsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: getBillingActionCosts
    servers:
    - description: Current environment
      url: https://api.aiapplyd.com/api/v1
  /native-billing/bootstrap:
    post:
      description: Return the opaque store-account binding and canonical native product catalog.
      summary: Get native billing bootstrap
      tags:
      - Billing
      responses:
        '200':
          description: Native billing bootstrap data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeBillingBootstrapResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postNativeBillingBootstrap
    servers:
    - description: Current environment
      url: https://api.aiapplyd.com/api/v1
  /billing/native/verify:
    post:
      description: Verify one native-store purchase against its provider and persist its entitlement.
      summary: Verify native billing purchase
      tags:
      - Billing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NativeBillingVerifyRequest'
      responses:
        '200':
          description: Native purchase verified and persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeBillingVerifyResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postBillingNativeVerify
    servers:
    - description: Current environment
      url: https://api.aiapplyd.com/api/v1
  /native-billing/purchases/accept:
    post:
      description: Accept one verified native-store token-pack purchase and settle its tokens exactly once.
      summary: Accept native token-pack purchase
      tags:
      - Billing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NativeStoreConsumableVerifyRequest'
      responses:
        '200':
          description: Native token-pack purchase accepted and settled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeStoreConsumableVerifyResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postNativeBillingPurchasesAccept
    servers:
    - description: Current environment
      url: https://api.aiapplyd.com/api/v1
components:
  schemas:
    PortalSessionPayload:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: URL to redirect user to for billing portal
          example: https://billing.stripe.com/session/1234567890
      required:
      - url
      additionalProperties: false
    ApiErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            context:
              oneOf:
              - type: object
                properties:
                  errorType:
                    type: string
                    enum:
                    - validation
                  field:
                    type: string
                  fieldErrors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        expected:
                          type: string
                        field:
                          type: string
                        message:
                          type: string
                        received:
                          type: string
                      required:
                      - field
                      - message
                  schemaName:
                    type: string
                required:
                - errorType
              - type: object
                properties:
                  attemptedEmail:
                    type: string
                    format: email
                  errorType:
                    type: string
                    enum:
                    - authentication
                  failureReason:
                    type: string
                    enum:
                    - invalid_credentials
                    - account_locked
                    - expired_token
                    - token_expired
                    - missing_token
                    - invalid_token
                    - session_expired
                    description: Reason for authentication failure
                    example: token_expired
                  ipAddress:
                    type: string
                  operation:
                    type: string
                  service:
                    type: string
                  userAgent:
                    type: string
                required:
                - errorType
              - type: object
                properties:
                  actualPermission:
                    type: string
                  errorType:
                    type: string
                    enum:
                    - authorization
                  requiredPermission:
                    type: string
                  resource:
                    type: string
                  resourceId:
                    type: string
                  userId:
                    type: string
                required:
                - errorType
              - type: object
                properties:
                  constraint:
                    type: string
                  errorType:
                    type: string
                    enum:
                    - database
                  operation:
                    type: string
                    enum:
                    - insert
                    - update
                    - delete
                    - select
                    - batch
                    - transaction
                    - migration
                    description: Type of database operation
                    example: select
                  resourceId:
                    type: string
                  sqlState:
                    type: string
                  table:
                    type: string
                  userId:
                    type: string
                required:
                - errorType
              - type: object
                properties:
                  endpoint:
                    type: string
                  errorType:
                    type: string
                    enum:
                    - external_service
                  httpStatus:
                    type: number
                  operation:
                    type: string
                  resourceId:
                    type: string
                  responseTime:
                    type: number
                  retryAttempt:
                    type: integer
                  service:
                    type: string
                  serviceName:
                    type: string
                  userId:
                    type: string
                required:
                - errorType
              - type: object
                properties:
                  errorType:
                    type: string
                    enum:
                    - resource
                  resource:
                    type: string
                  resourceId:
                    type: string
                  service:
                    type: string
                  userId:
                    type: string
                required:
                - errorType
              - type: object
                properties:
                  errorType:
                    type: string
                    enum:
                    - rate_limit
                  limit:
                    type: number
                  resetTime:
                    type: string
                  windowMs:
                    type: number
                required:
                - errorType
              - type: object
                properties:
                  configKey:
                    type: string
                  errorType:
                    type: string
                    enum:
                    - configuration
                  operation:
                    type: string
                  service:
                    type: string
                required:
                - errorType
              description: Type-safe error context information
              example:
                errorType: validation
                fieldErrors:
                - field: email
                  message: Invalid email format
            details:
              oneOf:
              - type: object
                properties:
                  detailType:
                    type: string
                    enum:
                    - validation
                  validationErrors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        field:
                          type: string
                        message:
                          type: string
                      required:
                      - field
                      - message
                required:
                - detailType
                - validationErrors
                additionalProperties: false
              - type: object
                properties:
                  detailType:
                    type: string
                    enum:
                    - service_error
                  originalError:
                    type: string
                  serviceName:
                    type: string
                required:
                - detailType
                - serviceName
                additionalProperties: false
              - type: object
                properties:
                  currentSize:
                    type: number
                  detailType:
                    type: string
                    enum:
                    - batch
                  originalError:
                    type: string
                  statementCount:
                    type: number
                required:
                - detailType
                additionalProperties: false
              - type: object
                properties:
                  detailType:
                    type: string
                    enum:
                    - rate_limit
                  limit:
                    type: number
                  resetTime:
                    type: string
                  windowMs:
                    type: number
                required:
                - detailType
                - limit
                - resetTime
                - windowMs
                additionalProperties: false
              - type: object
                properties:
                  conflictingField:
                    type: string
                  detailType:
                    type: string
                    enum:
                    - resource
                  resourceId:
                    anyOf:
                    - type: string
                    - type: number
                  resourceType:
                    type: string
                required:
                - detailType
                additionalProperties: false
              - type: object
                properties:
                  detailType:
                    type: string
                    enum:
                    - generic
                  info:
                    type: string
                required:
                - detailType
                additionalProperties: false
              - type: object
                properties:
                  currentTokens:
                    type: integer
                    minimum: 0
                  detailType:
                    type: string
                    enum:
                    - insufficient_tokens
                  requiredTokens:
                    type: integer
                    minimum: 0
                required:
                - currentTokens
                - detailType
                - requiredTokens
                additionalProperties: false
            message:
              type: string
            validation:
              type: array
              items:
                type: object
                properties:
                  code:
                    type: string
                  field:
                    type: string
                  message:
                    type: string
                required:
                - field
                - message
                additionalProperties: false
          required:
          - code
          - message
          additionalProperties: false
        meta:
          $ref: '#/components/schemas/ResponseMetadata'
        success:
          type: boolean
          enum:
          - false
      required:
      - error
      - success
      additionalProperties: false
    NativeBillingVerifyResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/NativeBillingVerifyPayload'
        meta:
          $ref: '#/components/schemas/ResponseMetadata'
        success:
          type: boolean
          enum:
          - true
      required:
      - data
      - success
      additionalProperties: false
      description: Successful API response
    NativeBillingVerifyRequest:
      oneOf:
      - $ref: '#/components/schemas/AppleNativeBillingVerifyRequest'
      - $ref: '#/components/schemas/GoogleNativeBillingVerifyRequest'
      discriminator:
        propertyName: provider
        mapping:
          apple_app_store: '#/components/schemas/AppleNativeBillingVerifyRequest'
          google_play: '#/components/schemas/GoogleNativeBillingVerifyRequest'
    NativeStoreConsumableVerifyRequest:
      oneOf:
      - $ref: '#/components/schemas/AppleNativeStoreConsumableVerifyRequest'
      - $ref: '#/components/schemas/GoogleNativeStoreConsumableVerifyRequest'
      discriminator:
        propertyName: provider
        mapping:
          apple_app_store: '#/components/schemas/AppleNativeStoreConsumableVerifyRequest'
          google_play: '#/components/schemas/GoogleNativeStoreConsumableVerifyRequest'
    CancelSubscriptionPayload:
      type: object
      properties:
        cancelAt:
          type:
          - string
          - 'null'
          format: date-time
          description: When the subscription is scheduled to end, or null when it ended immediately
          example: '2025-02-01T00:00:00.000Z'
        cancelAtPeriodEnd:
          type: boolean
          description: Provider flag for "will not renew". Read alongside cancelAt, never alone
          example: true
        canceledAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp when the subscription was cancelled
          example: '2025-01-15T12:00:00.000Z'
        status:
          type: string
          enum:
          - active
          - trialing
          - past_due
          - unpaid
          - canceled
          - incomplete
          - incomplete_expired
          - paused
          description: Updated subscription status
          example: active
        subscriptionId:
          type: string
          description: Stripe subscription ID
          example: sub_1234567890
      required:
      - cancelAt
      - cancelAtPeriodEnd
      - canceledAt
      - status
      - subscriptionId
      additionalProperties: false
    CreatePortalSessionRequest:
      type: object
      properties:
        returnUrl:
          type: string
          format: uri
          description: URL to return to after portal session
          example: https://aiapplyd.com/dashboard
      additionalProperties: false
    GetInvoicesResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/GetInvoicesPayload'
        meta:
          $ref: '#/components/schemas/ResponseMetadata'
        success:
          type: boolean
          enum:
          - true
      required:
      - data
      - success
      additionalProperties: false
      description: Successful API response
    ActionUsageItem:
      type: object
      properties:
        allowed:
          type: boolean
          description: Whether the user can perform this action
          example: true
        limit:
          type: number
          description: Max allowed per period (-1 = unlimited)
          example: 5
        period:
          type: string
          enum:
          - monthly
          - daily
          - weekly
          - lifetime
          - none
          description: Reset period (daily, weekly, monthly, lifetime, none)
          example: monthly
        remaining:
          type: number
          description: Remaining actions in current period (-1 = unlimited)
          example: 3
        used:
          type: number
          description: Actions used in current period
          example: 2
      required:
      - allowed
      - limit
      - period
      - remaining
      - used
      additionalProperties: false
    SyncAfterCheckoutPayload:
      type: object
      properties:
        amountCents:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Amount of the most recent one-time payment in cents (token purchases only)
          example: 999
        subscription:
          $ref: '#/components/schemas/SubscriptionPayload'
        synced:
          type: boolean
          description: Whether the sync was successful
          example: true
        tokensAdded:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Tokens added by the most recent top-up purchase (null for subscription checkouts)
          example: 50000
        tokensBalance:
