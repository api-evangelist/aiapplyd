    StarStoryData:
      type: object
      properties:
        action:
          type: string
          description: What the candidate did (specific, detailed)
        bestForQuestions:
          type: array
          items:
            type: string
          description: Question types this story can answer
          example:
          - Tell me about a time you led a team
          - How do you handle conflict?
        createdAt:
          type: string
          description: Story creation timestamp (ISO-8601)
          example: '2026-01-15T12:00:00Z'
        derivedFromResume:
          type: boolean
          description: True when this row was produced by the one-click "generate from resume" flow. Lets the UI flip its CTA to "Regenerate" and replace prior AI rows instead of duplicating them.
          example: true
        id:
          type: string
          description: STAR story identifier (UUID)
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        reflection:
          type:
          - string
          - 'null'
          description: Lessons learned / what would be done differently (signals seniority)
          example: I learned to invest in observability before scaling, not after.
        result:
          type: string
          description: Quantified outcome with metrics where possible
        situation:
          type: string
          description: Context for the story (1-2 sentences)
        task:
          type: string
          description: What needed to be done
        theme:
          type: string
          enum:
          - leadership
          - technical_challenge
          - conflict_resolution
          - ambiguity
          - customer_impact
          - failure
          - ownership
          - cross_functional
          - scaling
          - other
          description: Theme tag for a STAR+Reflection story
          example: leadership
        title:
          type: string
          description: Short memorable title
          example: Cutting CI from 22 to 6 minutes
        updatedAt:
          type: string
          description: Story last update timestamp (ISO-8601)
          example: '2026-03-10T08:30:00Z'
        usageCount:
