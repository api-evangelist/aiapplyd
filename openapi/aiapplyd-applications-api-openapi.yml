    PipelineStatusData:
      type: object
      properties:
        totalWaiting:
          type: integer
          minimum: 0
          description: Platform-wide apply queue depth (every ready_to_submit + submitting row).
          example: 12
        mine:
          type: integer
          minimum: 0
          description: How many of the caller's own rows are waiting for a slot or actively submitting.
          example: 2
        processing:
          type: integer
          minimum: 0
          description: How many of the caller's rows are actively being submitted right now (subset of `mine`).
          example: 1
        position:
          type: integer
          minimum: 0
          description: Frontmost 1-based platform-wide rank of any of the caller's active rows. 1 when one is already processing; the real rank of the caller's oldest waiting row otherwise; 0 when the caller has nothing in the queue.
