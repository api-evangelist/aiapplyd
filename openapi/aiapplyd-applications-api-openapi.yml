      type: object
      properties:
        position:
          type: integer
          minimum: 0
          description: 1-based rank of this row in the dispatcher's oldest-first ordering (created_at ASC) among all platform-wide rows still waiting or submitting. 1 while this row is actively processing. 0 when the row is not queued (terminal, awaiting approval, or still preparing).
          example: 3
        aheadCount:
          type: integer
          minimum: 0
          description: How many applications are ahead of this one platform-wide (position - 1).
          example: 2
        totalWaiting:
          type: integer
          minimum: 0
          description: Total rows in the apply queue right now (ready_to_submit + submitting, platform-wide).
          example: 12
        isProcessing:
          type: boolean
          description: True when this row is already being submitted / actively processed by a worker.
          example: false
        isDone:
          type: boolean
          description: True when the row reached a terminal status (applied / skipped / error / cancelled). The client stops polling once this flips true.
          example: false
        estimatedWaitSeconds:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Rough seconds until this row's turn. 0 when it is next in line or already processing. Null when the row is not waiting for a slot.
          example: 360
      required:
      - position
      - aheadCount
      - totalWaiting
      - isProcessing
      - isDone
      - estimatedWaitSeconds
      additionalProperties: false
