openapi: 3.2.0
info:
  contact:
    email: support@aiapplyd.com
    name: AI Applyd
    url: https://aiapplyd.com
  description: 'The AI Applyd API runs the whole job hunt for you: it matches you to roles that fit your profile, rewrites your resume for each posting, writes the cover letter the form asks for, and auto-applies across the major applicant tracking systems.'
  license:
    name: Proprietary
    url: https://aiapplyd.com/legal/terms
  title: AI Applyd Applications API
  version: 115c47ce
servers:
- description: Current environment
  url: https://api.aiapplyd.com/api/v1
security:
- BearerAuth: []
tags:
- name: Applications
paths:
  /applications:
    get:
      tags:
      - Applications
      summary: List Applications
      description: List application results for the authenticated user.
      parameters:
      - schema:
          type: integer
          maximum: 50
          default: 20
          description: Page size (max 50)
          example: 20
          exclusiveMinimum: 0
        required: false
        description: Page size (max 50)
        name: limit
        in: query
      - schema:
          type: integer
          default: 1
          description: Page number (1-based)
          example: 1
          exclusiveMinimum: 0
        required: false
        description: Page number (1-based)
        name: page
        in: query
      - schema:
          type: string
          maxLength: 200
          description: Search by job title or company name
          example: Software Engineer
        required: false
        description: Search by job title or company name
        name: search
        in: query
      - schema:
          type: string
          format: date-time
          description: Only return results created at or after this ISO timestamp
          example: '2026-06-12T00:00:00.000Z'
        required: false
        description: Only return results created at or after this ISO timestamp
        name: since
        in: query
      - schema:
          type: string
          enum:
          - newest
          - oldest
          - best_match
          - status
          - company_az
          default: newest
          description: 'Sort order: newest, oldest, best_match, status, or company_az'
          example: newest
        required: false
        description: 'Sort order: newest, oldest, best_match, status, or company_az'
        name: sort
        in: query
      - schema:
          type: string
          enum:
          - pending
          - pending_review
          - ready_to_submit
          - applied
          - applied_unconfirmed
          - skipped
          - error
          - cancelled
          description: Filter by a single result status
          example: applied
        required: false
        description: Filter by a single result status
        name: status
        in: query
      - schema:
          type: string
          description: Filter by multiple result statuses (comma-separated)
          example: pending,ready_to_submit
        required: false
        description: Filter by multiple result statuses (comma-separated)
        name: statuses
        in: query
      - schema:
          type: string
          description: Filter by application stage (comma-separated). Independent of status/bucket, which describe the submission lifecycle rather than the hiring conversation.
          example: callback,phone_screen,interview
        required: false
        description: Filter by application stage (comma-separated). Independent of status/bucket, which describe the submission lifecycle rather than the hiring conversation.
        name: stages
        in: query
      - schema:
          type: string
          enum:
          - waiting_for_review
          - queued_to_apply
          - verified
          - submitted
          - not_landed
          - taken_down
          description: Filter by Applications bucket. Selects the newest row of every posting the counter files under that bucket; takes precedence over status / statuses.
          example: queued_to_apply
        required: false
        description: Filter by Applications bucket. Selects the newest row of every posting the counter files under that bucket; takes precedence over status / statuses.
        name: bucket
        in: query
      responses:
        '200':
          description: Application results list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResultListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: getApplications
  /applications/usage:
    get:
      tags:
      - Applications
      summary: Get Apply Usage
      description: 'Returns the user''s rolling 30-day auto-apply cap: used, limit, resetAt (ISO), allowed.'
      responses:
        '200':
          description: Rolling-30d auto-apply cap status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationsUsageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: getApplicationsUsage
  /applications/prepare:
    post:
      tags:
      - Applications
      summary: Prepare Application Package
      description: Tailor resume and generate cover letter for a specific job match using AI.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrepareApplicationRequest'
      responses:
        '200':
          description: Application package prepared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrepareApplicationResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postApplicationsPrepare
  /applications/results/approve-batch:
    post:
      tags:
      - Applications
      summary: Bulk Approve Pending Applications
      description: Approve up to 25 pending_review results in one request. Each row is re-validated server-side (preflight + platform submittability + status guard) and enqueued independently. Per-row failures do not abort sibling rows.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkApproveRequest'
      responses:
        '200':
          description: Per-row approval verdicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkApproveResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postApplicationsResultsApproveBatch
  /applications/by-id/{resultId}:
    get:
      tags:
      - Applications
      summary: Get application result by ID
      description: Get one application result owned by the authenticated user.
      parameters:
      - schema:
          type: string
          pattern: ^\d+$
          description: Application result identifier
          example: '1'
        required: true
        description: Application result identifier
        in: path
        name: resultId
      responses:
        '200':
          description: Application result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResultItemResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: getApplicationsByIdByResultId
  /applications/{resultId}/approve:
    post:
      tags:
      - Applications
      summary: Approve Pending Application
      description: Approve a pending_review application in copilot mode, changing its status to ready_to_submit.
      parameters:
      - schema:
          type: string
          pattern: ^\d+$
          description: Application result identifier
          example: '1'
        required: true
        description: Application result identifier
        in: path
        name: resultId
      responses:
        '200':
          description: Application approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApproveResultResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postApplicationsByResultIdApprove
  /applications/{resultId}/reject:
    post:
      tags:
      - Applications
      summary: Reject Pending Application
      description: Reject a pending_review application in copilot mode, changing its status to skipped.
      parameters:
      - schema:
          type: string
          pattern: ^\d+$
          description: Application result identifier
          example: '1'
        required: true
        description: Application result identifier
        in: path
        name: resultId
      responses:
        '200':
          description: Application rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RejectResultResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postApplicationsByResultIdReject
  /applications/{resultId}/retry:
    post:
      tags:
      - Applications
      summary: Retry Failed Submission (Admin Only)
      description: 'Admin-only. Retry a failed application submission. Resets the result status and re-enqueues for submission. Returns 403 for non-admin users (2026-07-06: there is no user-facing retry).'
      parameters:
      - schema:
          type: string
          pattern: ^\d+$
          description: Application result identifier
          example: '1'
        required: true
        description: Application result identifier
        in: path
        name: resultId
      responses:
        '200':
          description: Submission retry queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApproveResultResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postApplicationsByResultIdRetry
  /applications/{resultId}/retry-prep:
    post:
      tags:
      - Applications
      summary: Retry Failed Preparation (Admin Only)
      description: 'Admin-only. Retry a failed or stuck application preparation. Resets the result and re-enqueues for preparation. Returns 403 for non-admin users (2026-07-06: there is no user-facing retry).'
      parameters:
      - schema:
          type: string
          pattern: ^\d+$
          description: Application result identifier
          example: '1'
        required: true
        description: Application result identifier
        in: path
        name: resultId
      responses:
        '200':
          description: Preparation retry queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApproveResultResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postApplicationsByResultIdRetryPrep
  /applications/{resultId}/cancel:
    post:
      tags:
      - Applications
      summary: Cancel Pre-Submission Application
      description: Cancel an in-flight auto-apply ONLY while it's still queued or preparing. Returns 409 Conflict once a Browserbase session has been spawned, the preparer has flipped into SUBMITTING, or the row has reached a terminal state. Used by auto-apply mode where there is no approve button so the user can still bail out before any cloud-browser cost is committed.
      parameters:
      - schema:
          type: string
          pattern: ^\d+$
          description: Application result identifier
          example: '1'
        required: true
        description: Application result identifier
        in: path
        name: resultId
      responses:
        '200':
          description: Application cancelled before submission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postApplicationsByResultIdCancel
  /applications/{resultId}/screenshot/{variant}:
    get:
      tags:
      - Applications
      summary: View Submission Screenshot
      description: Download a before/after submission screenshot captured by the auto-apply submitter. Returns the raw PNG bytes. Auth-gated by session because screenshots may contain form PII.
      parameters:
      - schema:
          type: string
          pattern: ^\d+$
          description: Application result ID
          example: '1'
        required: true
        description: Application result ID
        in: path
        name: resultId
      - schema:
          type: string
          enum:
          - before
          - after
          description: 'Which capture to serve: `before` (pre-submit) or `after` (post-submit).'
          example: before
        required: true
        description: 'Which capture to serve: `before` (pre-submit) or `after` (post-submit).'
        in: path
        name: variant
      responses:
        '200':
          description: Screenshot image (PNG)
          content:
            image/png:
              schema:
                type: string
                format: binary
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: getApplicationsByResultIdScreenshotByVariant
  /applications/by-job-match/{jobMatchId}:
    get:
      tags:
      - Applications
      summary: Get application result by job match ID
      description: Get the most recent application result for a given job match.
      parameters:
      - schema:
          type: string
          pattern: ^\d+$
          description: Job match identifier
          example: '1'
        required: true
        description: Job match identifier
        in: path
        name: jobMatchId
      responses:
        '200':
          description: Application result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleResultResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: getApplicationsByJobMatchByJobMatchId
  /applications/{resultId}/live-view:
    get:
      tags:
      - Applications
      summary: Get Browserbase Live View URL
      description: 'Returns a freshly-signed Browserbase debuggerFullscreenUrl that the web app can embed in an iframe to show the in-progress apply session live. Returns `available: false` once the run reaches a terminal state.'
      parameters:
      - schema:
          type: string
          pattern: ^\d+$
          description: Application result identifier
          example: '1'
        required: true
        description: Application result identifier
        in: path
        name: resultId
      responses:
        '200':
          description: Live view URL or unavailable marker
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveViewResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: getApplicationsByResultIdLiveView
  /applications/{resultId}/stage:
    patch:
      tags:
      - Applications
      summary: Update Application Stage
      description: Update the application stage (e.g. applied, interview, offered) for a specific application result.
      parameters:
      - schema:
          type: string
          pattern: ^\d+$
          description: Application result identifier
          example: '1'
        required: true
        description: Application result identifier
        in: path
        name: resultId
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApplicationStageRequest'
      responses:
        '200':
          description: Application stage updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateApplicationStageResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: patchApplicationsByResultIdStage
  /applications/{resultId}/extract-form:
    post:
      tags:
      - Applications
      summary: Extract and map form fields for an application
      description: Run form extractor, AI-map fields, AI-answer screening questions, and return proposed form values for copilot review.
      parameters:
      - schema:
          type: string
          pattern: ^\d+$
          description: Application result identifier
          example: '1'
        required: true
        description: Application result identifier
        in: path
        name: resultId
      responses:
        '200':
          description: Extracted form fields and screening answers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractFormResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: postApplicationsByResultIdExtractForm
  /applications/{resultId}/form-values:
    put:
      tags:
      - Applications
      summary: Update form values before submission
      description: Accept user-edited form field values and screening answers before submitting the application.
      parameters:
      - schema:
          type: string
          pattern: ^\d+$
          description: Application result identifier
          example: '1'
        required: true
        description: Application result identifier
        in: path
        name: resultId
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormValuesRequest'
      responses:
        '200':
          description: Form values updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormValuesResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: putApplicationsByResultIdFormValues
  /applications/{resultId}/download/{type}:
    get:
      tags:
      - Applications
      summary: Download result PDF
      description: Download the tailored resume or cover letter PDF for a specific application result.
      parameters:
      - schema:
          type: string
          pattern: ^\d+$
          description: Application result ID
          example: '1'
        required: true
        description: Application result ID
        in: path
        name: resultId
      - schema:
          type: string
          enum:
          - resume
          - cover-letter
          description: Type of document to download
          example: resume
        required: true
        description: Type of document to download
        name: type
        in: path
      responses:
        '200':
          description: PDF document binary
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: getApplicationsByResultIdDownloadByType
  /applications/{resultId}/submission-info:
    get:
      tags:
      - Applications
      summary: Get Submission Activity Info
      description: 'Get detailed submission activity: screenshots availability, form field log, submission attempts, and activity timeline.'
      parameters:
      - schema:
          type: string
          pattern: ^\d+$
          description: Application result identifier
          example: '1'
        required: true
        description: Application result identifier
        in: path
        name: resultId
      responses:
        '200':
          description: Submission activity details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScreenshotInfoResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      operationId: getApplicationsByResultIdSubmissionInfo
  /applications/{resultId}/generate-outreach:
    post:
      tags:
      - Applications
      summary: Generate Recruiter Outreach Messages
      description: Generate personalized LinkedIn connection requests, follow-up messages, and cold emails for a specific application result.
      parameters:
      - schema:
          type: string
          pattern: ^\d+$
          description: Application result identifier
          example: '1'
        required: true
        description: Application result identifier
        in: path
        name: resultId
      responses:
        '200':
          description: Outreach messages generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateOutreachResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
