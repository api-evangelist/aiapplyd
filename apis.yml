name: AI Applyd
aid: aiapplyd
description: 'AI Applyd is a job-application automation platform for candidates: it scores a resume against a posting
  for ATS compatibility, rewrites the resume and writes a cover letter per role, prepares interview material, matches
  new postings to a profile, and fills and submits applications on the employer''s own hiring system across 15 ATS
  platforms (Workday, Greenhouse, Lever, Ashby, Workable, iCIMS, SmartRecruiters and more), counting an application
  as sent only when the employer''s system confirms it. It publishes a hosted remote MCP server at mcp.aiapplyd.com/mcp
  (OAuth 2.1, 17 tools, listed in the official MCP Registry as com.aiapplyd/aiapplyd) with an MIT-licensed stdio
  bridge on GitHub, and serves the OpenAPI 3.0 description of its application backend at api.aiapplyd.com/api/v1/openapi.json.'
