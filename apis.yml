- name: AI Applyd MCP Server
  description: 'Hosted remote MCP server (streamable HTTP, OAuth 2.1 with PKCE, dynamic client registration and
    Client ID Metadata Documents) exposing 17 tools. The main loop: get job matches, apply to a match or a job URL
    (automatically or held for review), track applications with employer-confirmed receipts, approve, reject, cancel
    or refine held applications, read account readiness, set the resume, and save or skip matches. Also: ATS resume
    scoring, job-description analysis, resume optimization and translation, interview preparation, job search and
    preferences, cover letters and PDF builds. Every tool carries a title, all four annotation hints and an
    outputSchema. Tool catalog localizable via ?lang= (en, es, de, fr, pt-BR).'
  humanURL: https://aiapplyd.com/mcps
  baseURL: https://mcp.aiapplyd.com/mcp
