tools:
- name: aiapplyd_get_matches
  title: Get Job Matches
  description: >-
    List the user's matched jobs: the roles AI Applyd found for them against their saved job preferences, best matches
    first, each with a job_match_id, title, company, location, match score, a 500-character excerpt of the posting
    and the apply URL. Pass job_match_ids (up to 10) to read the full posting, skills and benefits of specific matches;
    job_url to read any posting without saving it; query, location or remote_only to narrow the list; after_job_match_id
    with the newestJobMatchId you stored to see only matches newer than your last check. Read-only: it spends no
    credits and changes nothing. Do not use it to change what the user is matched against; use aiapplyd_update_job_preferences
    for that. Next: pass a job_match_id to aiapplyd_apply, or save or skip a match with aiapplyd_triage_matches.
  inputs:
  - page
  - limit
  - saved_only
  - job_match_ids
  - job_url
  - query
  - location
  - remote_only
  - after_job_match_id
  required: []
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
  outputSchema: true
  tier: authenticated
- name: aiapplyd_apply
  title: Apply to Job
  description: >-
    Apply to one job on the user's behalf. Pass job_match_id from aiapplyd_get_matches, or job_url for any posting.
    AI Applyd rewrites the resume and cover letter for that role, then completes and submits the application on
    the employer's own hiring system (Workday, Greenhouse, Lever, Ashby, iCIMS and the other major ATS platforms).
    mode "auto" submits with no review step; mode "review" prepares everything and holds it for the user's approval;
    omit mode to follow the review setting on the user's account. The mode applies to this one application and never
    changes the user's settings. Spends one of the user's applications and AI credits, and a submitted application
    cannot be withdrawn, so apply only to jobs the user chose. Returns the application id and a tracking link; when
    the job already has an application, that one comes back with alreadyExisted true instead of a second. On a timeout
    or an error, call aiapplyd_get_applications before retrying, and never re-apply by job_url to a job already
    applied to by job_match_id. Do not use it to save or skip a match; use aiapplyd_triage_matches. Next: aiapplyd_get_applications
    to follow it, and aiapplyd_review_application if it waits for approval.
  inputs:
  - job_match_id
  - job_url
  - mode
  required: []
  annotations:
    readOnlyHint: false
    destructiveHint: true
    idempotentHint: false
    openWorldHint: true
  outputSchema: true
  tier: authenticated
- name: aiapplyd_get_applications
  title: Get Applications
  description: >-
    List the user's applications and where each one stands, or read one by application_id to see what will be or
    was sent: the tailored resume, the cover letter, the screening answers, why it stopped, and its place in the
    queue, plus the employer's confirmation page as an image when that page is the proof. Use this to check progress,
    to find applications waiting for the user's approval (status "waiting_for_review"), or to see whether an employer
    confirmed a submission. An application is reported as employer-confirmed only when the employer sent a receipt
    or showed its confirmation page. Other status filters: queued_to_apply, submitted, verified, not_landed, taken_down.
    Returns 20 per page. Read-only: it spends no credits. Do not use it to act on an application; use aiapplyd_review_application.
    Next: aiapplyd_review_application to approve, reject or change what is waiting.
  inputs:
  - application_id
  - status
  - page
  required: []
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
  outputSchema: true
  tier: authenticated
- name: aiapplyd_review_application
  title: Approve or Reject Applications
  description: >-
    Act on the user's applications. decision "approve" submits each waiting application on the employer's hiring
    system under the user's name: it spends one of their applications per job and cannot be undone. "reject" skips
    it: nothing is sent and nothing is spent. "cancel" stops one that is still queued or preparing. "refine" rewrites
    its resume or cover letter from instructions (document_type and instructions; uses AI credits). "re_prepare"
    builds its documents again (optional steps). "set_stage" records how it is going (stage). Pass up to 25 application_ids
    from aiapplyd_get_applications. Only approve on the user's explicit go-ahead, such as a "yes" to a specific
    application. On a timeout or an error, call aiapplyd_get_applications before retrying; an approve that already
    went through is reported as already approved. Do not use it for matches with no application yet; use aiapplyd_apply
    or aiapplyd_triage_matches. Next: aiapplyd_get_applications to follow the submissions.
  inputs:
  - decision
  - application_ids
  - document_type
  - instructions
  - steps
  - stage
  required:
  - decision
  - application_ids
  annotations:
    readOnlyHint: false
    destructiveHint: true
    idempotentHint: false
    openWorldHint: true
  outputSchema: true
  tier: authenticated
- name: aiapplyd_get_account
  title: Get Account
  description: >-
    Show the user's AI Applyd account: plan, token balance, applications left in the current 30-day window, the
    job preferences their matches are found against, and readiness: whether a resume is on file, whether setup is
    finished, and which profile fields employer forms require that are still empty. Also lists their resumes and
    the default apply mode. Call it first, and before applying to several jobs. Read-only: it spends no credits
    and changes nothing. Do not use it to change anything; use aiapplyd_update_job_preferences or aiapplyd_set_resume.
    Next: aiapplyd_set_resume when no resume is on file, otherwise aiapplyd_get_matches.
  inputs: []
  required: []
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
  outputSchema: true
  tier: authenticated
- name: aiapplyd_set_resume
  title: Set Resume
  description: >-
    Put the user's resume on their AI Applyd account as the base every application is tailored from. Pass exactly
    one: resume_text (the full text), resume_url (an https link to a PDF, DOCX or plain text file, up to 10 MB),
    or document_id (one of their saved resumes, from aiapplyd_get_account). A new upload is read by AI and uses
    the user's AI credits; switching to a saved resume with document_id is free. It also finishes account setup,
    so AI Applyd starts finding jobs for them. Use it when aiapplyd_get_account shows no resume on file, or when
    the user gives a new one. Do not use it to rewrite or score a resume; use aiapplyd_optimize_resume or aiapplyd_score_resume.
    Next: aiapplyd_get_matches.
  inputs:
  - resume_text
  - resume_url
  - document_id
  required: []
  annotations:
    readOnlyHint: false
    destructiveHint: false
    idempotentHint: false
    openWorldHint: true
  outputSchema: true
  tier: authenticated
  tier_note: not listed in the root document tier arrays; an anonymous call returns 401, so it requires a connected
    account
- name: aiapplyd_triage_matches
  title: Save or Skip Matches
  description: >-
    Save or skip job matches: the answer to "want this one?". action "save" keeps matches in the user's saved list;
    action "skip" dismisses them so they stop showing, with an optional reason (not_interested, wrong_location,
    too_senior, too_junior, salary_too_low, wrong_role, company_mismatch, already_applied, other) that teaches the
    matcher. Pass up to 25 job_match_ids from aiapplyd_get_matches. Nothing is sent to any employer and nothing
    is spent. Do not use it to apply; use aiapplyd_apply. Next: aiapplyd_get_matches for the next matches.
  inputs:
  - action
  - job_match_ids
  - reason
  required:
  - action
  - job_match_ids
  annotations:
    readOnlyHint: false
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
  outputSchema: true
  tier: authenticated
  tier_note: not listed in the root document tier arrays; an anonymous call returns 401, so it requires a connected
    account
- name: aiapplyd_score_resume
  title: Score Resume
  description: >-
    Score a resume for ATS compatibility. Returns an overall score, section scores, the keywords the resume matches
    and the ones it is missing, and specific rewrite suggestions. Pass job_description to score against a posting,
    or omit it for a general ATS readiness score. Requires a connected AI Applyd account and uses the user's credits.
    Do not use it to rewrite the resume; use aiapplyd_optimize_resume. Next: aiapplyd_optimize_resume rewrites the
    resume against the same posting.
  inputs:
  - resume_text
  - job_description
  required:
  - resume_text
  annotations:
    readOnlyHint: false
    destructiveHint: false
    idempotentHint: false
    openWorldHint: true
  outputSchema: true
  tier: authenticated
- name: aiapplyd_analyze_job_description
  title: Analyze Job Description
  description: >-
    Extract what a job posting actually screens on: the exact ATS keywords, must-have versus nice-to-have requirements,
    seniority signals, and red flags. Call this before tailoring a resume so the resume mirrors the posting's own
    language. Requires a connected AI Applyd account and uses the user's AI credits. Do not use it to read a posting
    from a link; use aiapplyd_get_matches with job_url. Next: aiapplyd_score_resume or aiapplyd_optimize_resume
    with the same job description.
  inputs:
  - job_description
  required:
  - job_description
  annotations:
    readOnlyHint: false
    destructiveHint: false
    idempotentHint: false
    openWorldHint: true
  outputSchema: true
  tier: authenticated
- name: aiapplyd_optimize_resume
  title: Optimize Resume with AI
  description: >-
    Rewrite a resume so it passes ATS screening. Returns the rewritten resume, a projected ATS score, and an itemised
    summary of every change made. Pass job_description to tailor the rewrite to one specific posting, or omit it
    for general ATS optimization. Requires a connected AI Applyd account. Uses the user's AI credits. Do not use
    it to apply: aiapplyd_apply tailors the resume for every application on its own.
  inputs:
  - resume_text
  - job_description
  required:
  - resume_text
  annotations:
    readOnlyHint: false
    destructiveHint: false
    idempotentHint: false
    openWorldHint: true
  outputSchema: true
  tier: authenticated
- name: aiapplyd_generate_interview_questions
  title: Generate Interview Questions
  description: >-
    Produce interview preparation for a specific role and company: company insights, the questions this role is
    asked with approach guidance, STAR scenarios drawn from the posting, talking points, questions to ask the interviewer,
    and salary negotiation prep. Pass application_id to prep for a job the user applied to (no new saved job), or
    job_title and company_name for any other job. Requires a connected AI Applyd account. Uses the user's AI credits,
    and saves the job to their account if it is not saved yet. Do not use it for a cover letter; use aiapplyd_generate_cover_letter.
  inputs:
  - job_title
  - company_name
  - job_description
  - application_id
  required: []
  annotations:
    readOnlyHint: false
    destructiveHint: false
    idempotentHint: false
    openWorldHint: true
  outputSchema: true
  tier: authenticated
- name: aiapplyd_translate_resume
  title: Translate Resume
  description: >-
    Translate the user's base resume, the one saved on their AI Applyd account, into another language (for example
    Spanish, French, German, Portuguese or Japanese), ready to send to employers in that market. Returns the new
    resume's title and a link; the translation is saved as a separate resume and the original stays unchanged. Needs
    a resume on file (see aiapplyd_set_resume) and uses the user's AI credits. Do not use it to tailor a resume
    to a job; use aiapplyd_optimize_resume, or aiapplyd_apply, which tailors every application.
  inputs:
  - target_language
  required:
  - target_language
  annotations:
    readOnlyHint: false
    destructiveHint: false
    idempotentHint: false
    openWorldHint: true
  outputSchema: true
  tier: authenticated
- name: aiapplyd_search_jobs
  title: Search Jobs
  description: >-
    Deprecated alias of aiapplyd_get_matches, use aiapplyd_get_matches. Returns the user's matched jobs filtered
    by title, location and remote, exactly as aiapplyd_get_matches with query, location and remote_only. Read-only:
    it never changes which roles AI Applyd hunts for.
  inputs:
  - job_title
  - location
  - remote_only
  required:
  - job_title
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
  outputSchema: true
  tier: authenticated
- name: aiapplyd_update_job_preferences
  title: Update Job Preferences
  description: >-
    Set what AI Applyd hunts for on the user's behalf, and re-run discovery immediately: target roles, locations,
    remote, salary band and currency, seniority (experience_levels), work styles, job types, visa sponsorship need,
    industries to exclude, or pause matching. Pass description to say it in plain words ("remote only, 120k+, senior,
    no crypto"); fields passed explicitly win over it. Lists REPLACE what is saved, so pass the complete list, not
    an addition. application_answers saves the answers employer forms ask for (phone, city, state, zip, country,
    LinkedIn, work authorization, relocation, start date, notice period): fill only values the user stated, never
    guesses. Only call this when the user asks. Read the current preferences first with aiapplyd_get_account. Do
    not use it to search; use aiapplyd_get_matches with query.
  inputs:
  - target_roles
  - locations
  - include_remote
  - remote_only
  - salary_min
  - salary_max
  - salary_currency
  - experience_levels
  - work_styles
  - job_types
  - needs_visa_sponsorship
  - exclude_industries
  - paused
  - description
  - application_answers
  required: []
  annotations:
    readOnlyHint: false
    destructiveHint: true
    idempotentHint: true
    openWorldHint: false
  outputSchema: true
  tier: authenticated
- name: aiapplyd_generate_cover_letter
  title: Generate Cover Letter
  description: >-
    Write a cover letter for a specific job from the base resume saved on the user's AI Applyd account, in their
    own voice and free of recruiter cliches. Returns the finished letter as text and saves it to the account. Pass
    application_id instead to get the letter already written for that application (no new letter), with instructions
    to change it. Needs a resume on file (see aiapplyd_set_resume) and a paid plan (Hired in 30+); without either
    it says so and links the fix. Uses the user's AI credits. Do not use it for applications: aiapplyd_apply already
    writes a cover letter for every one.
  inputs:
  - job_description
  - company_name
  - application_id
  - instructions
  required: []
  annotations:
    readOnlyHint: false
    destructiveHint: false
    idempotentHint: false
    openWorldHint: true
  outputSchema: true
  tier: paid
- name: aiapplyd_auto_apply
  title: Auto Apply to Job
  description: >-
    Deprecated alias of aiapplyd_apply, use aiapplyd_apply. Applies to ONE job posting by job_url, end to end, on
    the employer's own hiring system (Workday, Greenhouse, Lever, Ashby, Workable, iCIMS, Personio, Recruitee, Teamtailor,
    Rippling, Breezy, SmartRecruiters, BambooHR, JazzHR, softgarden), following the account's review setting. Spends
    one of the user's applications.
  inputs:
  - job_url
  required:
  - job_url
  annotations:
    readOnlyHint: false
    destructiveHint: true
    idempotentHint: false
    openWorldHint: true
  outputSchema: true
  tier: paid
- name: aiapplyd_build_pdf
  title: Build Resume
  description: >-
    Build a formatted, ATS-clean resume from raw text in the user's AI Applyd resume builder, where it stays editable
    and downloads as a PDF. Templates: modern, classic, or minimal. Private to the account by default; set make_public
    to true only if the user explicitly asks for a shareable public link. Requires a paid plan (Hired in 30+). Uses
    the user's AI credits. Do not use it to rewrite a resume; use aiapplyd_optimize_resume.
  inputs:
  - resume_text
  - template
  - make_public
  required:
  - resume_text
  annotations:
    readOnlyHint: false
    destructiveHint: false
    idempotentHint: false
    openWorldHint: true
  outputSchema: true
  tier: paid
